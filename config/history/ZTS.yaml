business:
  text: Zoetis makes and sells medicines, vaccines and diagnostics for pets and livestock worldwide; companion animal is about 70% of revenue (6,587 of 9,467 $m in 2025).
  source: tenk25
  quote: Zoetis Inc. is a global leader in the animal health industry, focused on the discovery, development, manufacture and commercialization of medicines, vaccines, diagnostic products and services, biodevices, genetic tests and precision animal health.
