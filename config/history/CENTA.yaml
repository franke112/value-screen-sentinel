business:
  text: Central Garden & Pet sells branded pet supplies and lawn and garden consumables to retailers and consumers; consumables and trusted brands drive repeat purchases.
  source: tenk
  quote: Our Pet segment offers a broad range of products for dog and cat supplies, including treats and chews, toys, beds and containment, grooming items, waste management and training pads.
