business:
  text: D.R. Horton builds and sells homes across the US, mostly entry-level, and develops lots (Forestar, 62% owned), with mortgage, title and rental operations.
  source: tenk25
  quote: D.R. Horton, Inc. is the largest homebuilding company in the United States as measured by number of homes closed. We construct and sell homes through our operating divisions in 126 markets across
    36 states.
