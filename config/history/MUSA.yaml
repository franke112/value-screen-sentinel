business:
  text: Murphy USA sells motor fuel and convenience merchandise to drivers at about 1,800 stores, often next to Walmart; low prices and convenience bring repeat visits.
  source: tenk
  quote: Our business consists primarily of the marketing of retail motor fuel products and convenience merchandise through a network of 1,800 retail stores located in 27 states
revenue_pass_through: 'E141 decision 2026-10-27: Murphy USA sells motor fuel at the pump price; its revenue moves with the price of gasoline (2020 -20%, 2022 +), not with how much business it does, so revenue growth and margin on revenue measure neither
  growth nor the cycle'
