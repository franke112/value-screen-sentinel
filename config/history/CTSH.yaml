business:
  text: Cognizant sells IT consulting, systems integration and outsourcing services to large enterprises; embedded delivery teams keep clients renewing.
  source: tenk
  quote: Our services include consulting, application development, systems integration, quality engineering and assurance, engineering research and development, application maintenance, infrastructure and
    security as well as business process services and automation.
