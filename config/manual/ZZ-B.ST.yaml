# ZZ-B.ST -- Zinzino AB (publ), hand-read from the issuer's own periodic
# reports. WRITTEN 2026-08-30 by the build session; no store file existed
# before. EVERY FIGURE IS UNVERIFIED: each was entered ONCE from a pypdf
# text extraction of the filed PDF and has NOT been read back -- the owner's
# second read is what turns a flag to VERIFIED (E21, E40). Section 5 refuses
# on every figure its basis reads until then.
#
# VERIFICATION PASS 2026-08-30 (E59, on the owner's instruction). Of the 57
# figures the TTM basis reads, 50 now carry VERIFIED / cross_document, each
# with its reconciliation written on the figure: a segment-note restatement
# of an income-statement line, a component sum to a printed subtotal, or a
# cross-document subtraction of two printed cumulative columns (9M 2025 less
# H1 2025, FY 2025 less 9M 2025, H1 2026 less Q1 2026 -- each column printed
# in a different report). Where a cumulative subtraction came out one to
# three off from column rounding it is named and NOT used as the tie. No
# ESEF/iXBRL package exists: Zinzino is a First North issuer (an MTF), and
# the annual-report release 1436889 carries two PDFs and no zip. SEVEN
# figures remain UNVERIFIED at the basis because no second figure exists to
# reconcile them to: the four E25 zeros (2026-Q2 borrowings x2 on the note
# form, FY2025 pension and asset retirement obligation on the note/caption
# form -- claims, not figures; only the owner's own read settles them), the
# E36 zero on `sbc` (the same), the 2026-Q2 `lease_liabilities` (an E71 sum
# of two balance-sheet parts the interim restates nowhere), and the 2026-Q2
# `shares_outstanding_period_end` (printed twice on p.19 and nowhere else --
# E59 excludes a figure that merely appears twice on one page). The 45
# figures the basis does not read are left as entered (E21), except the
# 2026-Q1 diluted count, corrected to note 4's print and flagged: the Q1
# report's p.5 and p.28 disagree by 300 shares.
#
# DOCUMENTS: five, all in sources/ and all recorded in sources/manifest.json
# by `vss nordic` on 2026-08-25 (origin nasdaq-nordic, market First North
# Sweden, company string 'Zinzino Holding AB'; the covers read 'Zinzino AB').
# Nothing was missing to fetch: the FY2025 annual report and every interim
# through Q2 2026 were already on disk. Note the exchange category: the
# YEAR-END REPORT 2025 is filed under 'Interim report (Q1 and Q3)', and its
# income-statement page (p.22) is in SWEDISH in the English PDF -- the
# captions are quoted as printed.
#
# BASIS: E19's twelve-month window is the four consecutive quarters 2025-Q3,
# 2025-Q4, 2026-Q1 and 2026-Q2, ending 2026-06-30 (61 days before
# 2026-08-30). Every interim prints a STANDALONE QUARTER column for the
# income statement AND the cash flow statement, so each quarter's figures
# come from its own document. The Q2 2026 report's H1 column and the Q1
# 2026 report's Q1 column together check the Q2 quarter for the income
# statement lines (e.g. net sales 868,952 + 881,712 = 1,750,664 against the
# printed 1,750,665); the year-end report's FY column checks Q3 + Q4 2025
# against the nine-month column (OCF 270,352 + 271,519 = 541,871 against
# the printed 541,870).
#
# ONE DISCREPANCY THE OWNER MUST RULE ON, recorded rather than resolved:
# OPERATING CASH FLOW FOR Q1 2026. The Q1 2026 report prints 125,618 (p.19).
# The Q2 2026 report prints H1 2026 = 280,002 and Q2 = 175,818 (p.25), which
# leaves 104,184 for Q1 -- 21,434 LESS than the Q1 report printed. 21,434 is
# exactly the 'Cash and cash equivalent 21,434' acquired with the ItWorks!
# subsidiaries (Q2 report note 6, p.36), which the Q2 report presents in
# INVESTING ('Acquisition of assets (note 5 & 6) ... 12,439' for H1 = 21,434
# acquired less 8,995 paid for Sanki) and which the Q1 report carried inside
# operating working capital. The file carries the Q1 REPORT'S PRINTED
# 125,618 (E19: each quarter keeps its own entry and page; 104,184 is a
# subtraction the accounts never print), so the TTM operating cash flow
# 136,614 + 271,519 + 125,618 + 175,818 = 709,569 stands 21,434 (3.0%) ABOVE
# what the Q2 report's own H1 implies, in the flattering direction.
#
# UNITS: SEK THOUSANDS for money, as every statement prints them ('Amounts
# in SEK thousands'; the key-figure pages print SEK millions and are cited
# only as a second reading). SHARE COUNTS ARE WHOLE SHARES, as printed.
# Signs as printed: outflows negative; the interest pair as POSITIVE
# MAGNITUDES per the schema (E18); a net financial INCOME on the income
# statement is entered NEGATIVE in `net_finance_costs`, which holds a net
# cost as a positive number.
#
# INTEREST (E34): Zinzino books interest INSIDE operating activities --
# 'Interest received' and 'Interest paid' sit above 'Cash flow from
# operating activities before changes in operating capital' in every cash
# flow statement (Q2 2026 p.25; AR p.82) -- so `interest_in_ocf: yes` and
# FCF0 adds back the NET INTEREST PAID. The net is NEGATIVE on this window
# (paid 3,704 against received 7,100 over the four quarters): E34's add-back
# REMOVES 3,396 of net interest income from FCF0. The interest on lease
# liabilities is inside 'Interest paid' (AR note 22 p.114: 'The interest
# portion of the leasing payment remains cash flow from operating
# activities'), so E34's rule already covers it.
#
# LEASES (E70): IFRS 16 filer -- `operating_leases_in_ocf: no`. The
# principal is in FINANCING ('Amortisation of lease liabilities attributable
# to lease agreements', Q2 2026 p.25; AR p.82 'Amortisation of leasing
# liabilities -21,499'), so the flow never bore it and nothing is added
# back; `lease_payments_capital` is a memo. IFRS 16.50(b).
#
# NET DEBT (E35, E35.1, E65-E68) -- what the file can and cannot supply at
# the basis end 2026-06-30:
#   * borrowings: ZERO in both fields on E25's `note` form. The AR states it
#     outright at 2025-12-31 -- p.64 'Zinzino has no interest-bearing loans,
#     apart from an unused overdraft facility of SEK 80 (80) million and
#     certain limited leasing commitments'; note 3(c) p.97 'the lack of
#     liabilities to credit institutions'; the p.97 maturity table lists
#     financial liabilities as leasing liabilities, accounts payable, other
#     liabilities and accrued costs and NO borrowings row. At 2026-06-30 the
#     interim says less: p.23 presents no borrowings caption and p.17 says
#     'The Group has an unutilised overdraft facility of SEK 80 (80)
#     million' -- the only facility, unutilised. The 2026-Q2 zeros cite both
#     and say which sentence is six months old; THE OWNER DECIDES whether
#     the interim's sentence is E25's 'sentence that states there is none'.
#   * lease_liabilities at 2026-06-30: 62,219 under E71 (2026-08-30) --
#     the Q2 2026 balance sheet (p.23) presents 'Lease liabilities 37,637'
#     (long-term) and 'Lease liabilities 24,582' (current) and totals them
#     nowhere, and the interim has no lease note; the issuer's own evidence
#     that they are one quantity is the annual report's note 22 (p.115,
#     'Long term / Current / Total 41,990'), note 3's single 'Leasing
#     liabilities' line (p.97) and note 37's roll-forward (p.122). Both
#     components are named on the field. Before E71 this leg was DATA
#     MISSING (E26, the BETS-B.ST precedent) and net debt did not form; now
#     the bridge's arithmetic completes -- 0 + 0 + 62,219 + 0 + 0 - 841,991
#     = -779,772, NET CASH -- and what still stops section 5 is E21: every
#     figure here is UNVERIFIED until the owner's second read.
#   * pension_deficit: ZERO on the `note` form, FY2025 entry, reaching the
#     TTM basis under E41 (annual-only). AR note 2.7.2 p.91: 'The Group
#     companies only have defined contribution pension plans.'
#   * asset_retirement_obligation: ZERO on E68.1's `caption` form, FY2025
#     entry, via E41. The balance sheet (AR p.80) presents no provision of
#     any kind; the words decommission / restoration / dismantling / asset
#     retirement appear nowhere in the annual report. Dietary supplements
#     sold by direct selling, with one Norwegian contract-manufacturing unit
#     (Faun Pharma AS): not on E68.1's refuse-until-read list.
#   * other_current_financial_assets: no such caption; left DATA MISSING
#     (E25 refuses a zero here outright). Omitting an asset is the
#     conservative direction. Cash is 'Cash and bank balances 841,991'.
#
# SHARE-BASED COMPENSATION (E36): ZERO on E25's `note` form, FY2025 entry,
# via E41 -- A JUDGEMENT, FLAGGED. Zinzino's incentive instruments are
# WARRANTS SOLD AT A MARKET PREMIUM: AR note 39 p.123 'At all subscription
# events, the option premium is determined at an estimated market value
# through Black & Scholes calculations' (also p.55). No IFRS 2 charge is
# stated anywhere: note 8 (employee benefits, p.101) has no share-based
# line, note 38 (non-cash items, p.123) has none, and the equity statement's
# only warrant entries are premiums RECEIVED ('Issued warrants 277' in 2024,
# none in 2025, p.81; the cash flow shows them as a FINANCING inflow,
# 'Issuance of options'). An instrument bought at fair value carries no
# IFRS 2 expense, which is why the accounts show none -- but no sentence
# says 'no share-based payment expense', so the zero rests on the premium
# sentence plus the absence of any charge. If the owner refuses the zero,
# FCF0 is DATA MISSING on E36's terms.
#
# SHARE COUNT (E38, E41, E75): the quarters state only QUARTERLY diluted
# averages (38,001,886 / 38,054,898 / 38,665,212 / 39,528,665, entered as
# stated and never summed, B27) and no interim states a twelve-month
# average. Before E75 the store took the FY2025 weighted diluted average
# 37,530,107 under E41 -- a count from BEFORE the 2,846,458 shares issued
# in H1 2026 for ItWorks!, Sanki, Bode Pro, Xion and Truvy and on warrant
# exercises (Q2 2026 pp.18-19). UNDER E75 (2026-08-30) THE DIVISOR IS THE
# COUNT OUTSTANDING AT THE WINDOW END, 39,165,998 (p.19, 'Number of
# outstanding shares'), `divisor_basis: period_end`, a drift of +4.36%
# against the E41 average -- the flattering understatement E75 exists to
# remove. E75.1 (2026-08-30): a stated DILUTED count at the window end
# would beat the basic one -- ZINZINO STATES NONE. The Q2 2026 interim
# prints diluted AVERAGES (p.6; note 4 p.34), diluted EPS, and the warrant
# programmes' sum on p.20 (3,293,314 potential Class B shares, 'a total
# dilution of the share capital amounting to approximately 8.4%'); the
# annual report the same shapes at 2025-12-31 (p.5, notes 36 and 39). So
# the divisor is the basic count, `divisor_basis: period_end_basic`, and
# the dropped dilution is named on the field.
#
# REVENUE, GROSS PROFIT, OPERATING PROFIT -- the figures the earlier
# reading carried (reports/SCREENER-REVIEW-3-2026-08-26.md), verified
# against the documents:
#   * NET SALES FY2025 3,172,194 (AR p.77 'Net sales 3,172,194'; p.5
#     '3,172.2'; year-end report p.22 'Nettoomsättning 3 172 194'): VERIFIED
#     as read. The file carries NET SALES as `revenue`, the line the vendor
#     and the ranking carry. The issuer ALSO prints 'Other operating revenues
#     165,264' (note 6 p.100: freight revenue 155,244, service and reminder
#     fees 1,828, other 8,192) and a TOTAL of 3,337,458 (p.77) that it calls
#     'Total revenue' (p.5), on which it strikes EVERY margin it states
#     (note 40 p.124). The interims print net sales and other revenue as two
#     lines with no TSEK total, so total revenue cannot be carried per
#     quarter without a sum (E26); net sales is carried throughout.
#   * OPERATING PROFIT FY2025 410,029 (AR p.77 'Operating profit 410,029',
#     p.82, p.65; p.5 '410.0'; year-end report p.22 'Rörelseresultat 410
#     029'): VERIFIED as read -- and NOT CARRIED AS A FIGURE. The schema's
#     `op_margin` reconciliation (0.1pp) demands the margin the source
#     states, and Zinzino states 12.3% on TOTAL revenue (p.5, p.65, note 40)
#     while the file's revenue line is net sales (410,029 / 3,172,194 =
#     12.9%); a margin computed to satisfy the check is refused by the
#     check's own text, and an `operating_income` without a margin fails the
#     load. So the operating profits are recorded HERE: Q3 2025 101,373
#     (p.21), Q4 2025 166,401 (p.22), Q1 2026 130,225 (p.16), Q2 2026
#     138,854 (p.22) -- TTM 536,853; stated operating margins on total
#     revenue 12.9% / 16.1% / 14.1% / 14.8% (key-figure pages), FY2025 12.3%.
#     ONE RE-PRESENTATION INSIDE THE WINDOW: the 2026 interims restate
#     FY2025 operating profit to 409,586 (Q1 2026 p.16; Q2 2026 p.22) by
#     moving 'Results from holdings in associated companies -443' out of
#     financial items (AR note 9 p.105) into operating profit; the 2026
#     quarters carry the associate result (-485, -498) inside operating
#     profit and the 2025 quarters do not. Under 0.5m over the window.
#     EBITDA IS CARRIED instead: the segment note prints it in TSEK every
#     quarter (Q3 2025 109,714; Q4 2025 175,210; Q1 2026 142,263; Q2 2026
#     153,073 -- the sum of `ebitda` and `depreciation_amortisation` on each
#     entry reproduces the quarter's operating profit) and it is the metric
#     the group's financial goal is set on ('operating margin before
#     depreciation shall exceed 11%', Q2 2026 p.6).
#   * GROSS PROFIT FY2025 1,119,056 (segment note 4 p.98 'Gross profit
#     1,058,539 | 60,517 | - | 1,119,056'; p.5 '1,119.1'; year-end report
#     p.22 'Bruttovinst 1 119 056'; the AR's income statement p.77 prints
#     costs by nature and NO gross-profit line): VERIFIED as read. The file
#     carries THE ISSUER'S figure. Definition, note 40 p.124: 'Profit from
#     total revenue less goods for resale' -- i.e. 3,337,458 total revenue
#     less 'Goods for resale and other direct costs' 2,218,402 (= raw
#     materials and consumables 622,400 + trading costs 1,596,002, p.77).
#     The vendor's 953.8 is 3,172,194 - 2,218,402 = 953,792: the same costs
#     against NET SALES, i.e. the issuer's figure less the 165,264 of other
#     operating revenues -- a traceable difference, as the earlier reading
#     said. The issuer's is the line printed on the face of every interim
#     income statement ('Gross profit 351,283', Q2 2026 p.22) and is what
#     'gross profit margin 37.5%' is struck on.
#
# COMMISSIONS TO DISTRIBUTORS -- what the accounts say, since it decides
# what the operating margin means. Zinzino is a direct-selling company
# (AR note 2.5.1: 'All sales within the business segment Zinzino are made
# via direct sales ... Sales are also made to the Group's independent
# distributors according to the same model'). The income statement carries
# NO line captioned commissions. What it carries, by nature (AR p.77):
# 'Raw materials and consumables -622,400' (note 23: cost of inventories
# 509,900 inside it) and 'TRADING COSTS -1,596,002' (2024: -1,023,725) --
# 50.3% of net sales, 47.8% of total revenue -- a line the annual report
# NEVER DEFINES and gives no note. The interims fold both into 'Goods for
# resale and other direct costs' ABOVE gross profit. The evidence that
# trading costs are the distributor remuneration is indirect but
# consistent: the balance sheet carries 'Commission liability 354,945'
# (295,202) in other current liabilities (note 32 p.120) and 'Accrued
# commission 41,915' (33,109) in accrued costs (note 33), a turnover the
# 1,596,002 line is the only one large enough to feed; related-party
# purchases are described as 'sales commissions ... calculated according
# to the same commission plan and under the same terms as for all other
# distributors within Zinzino's global sales organisation' (note 35
# pp.121-122: Saele Invest & Consulting AS 81,429, Moonwalk AG 12,892);
# and the Q2 2026 narrative attributes the gross margin's rise to
# 'normalised levels of distributor remuneration during the quarter'
# (p.12), which places that remuneration ABOVE gross profit. NOTHING
# IDENTIFIABLE AS COMMISSION SITS OUTSIDE COGS: 'Staff costs' are
# employees (note 8: salaries 172,068, of which executive bonuses 3,508),
# and 'External operating expenses -439,498' hold FX translation losses of
# 27,714 (note 10), sales-conference and marketing costs (note 27 'Pre-paid
# cost for sales conference 23,207'), audit and rent. So Zinzino's 33.5%
# 'gross margin' is a margin after BOTH product cost and the sales force,
# and its 12.3% operating margin is a margin on revenue of which roughly
# half is paid out to the field before anything else -- a supplement
# brand's economics with the distribution cost inside gross profit rather
# than below it. WHAT IS NOT STATED: the split of trading costs between
# commissions and other direct costs, and a policy sentence defining the
# line. The earlier reading's 'trading costs 1,596.0' is the vendor's
# rendering of the same p.77 line.
#
# ACQUISITIONS, NAMED BECAUSE THE CAPEX LINES DO NOT SEE THEM: the capex
# fields carry the two tiny printed investment lines (TTM intangibles
# -4,473, tangible -4,120). The growth is BOUGHT -- distributor databases,
# inventories and IP ('Acquisition of assets' -71,020 cash in FY2025; ItWorks!
# 290,613 and Sanki 75,367 in H1 2026, both paid almost entirely in NEWLY
# ISSUED SHARES, Q2 2026 notes 5-6 pp.35-36) -- and neither the cash nor the
# shares reach FCF0 or, on this basis, the divisor (see SHARE COUNT). A
# growth view that reads this file's FCF0 as organic reads it wrong.
#
# STALENESS: newest period end 2026-06-30. Next report: Q3 2026 on
# 2026-11-17 (Q2 2026 p.21).

