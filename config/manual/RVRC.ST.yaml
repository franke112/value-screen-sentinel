# config/manual/RVRC.ST.yaml -- RVRC Holding AB (publ), "RevolutionRace",
# hand-read from the issuer's own reports as filed on the Nasdaq Stockholm
# disclosure feed (sources/manifest.json, origin nasdaq-nordic, market
# "Main Market, Stockholm", company "RVRC Holding AB"). Built 2026-08-30.
# IFRS; FISCAL YEAR 1 JULY - 30 JUNE; quarterly reporter in SEK.
#
# PERIOD LABELS ARE FISCAL (period_basis: fiscal): the issuer's Q1 2025/26
# is July-September 2025 and is stored as 2026-Q1; Q4 2025/26 (April-June
# 2026) as 2026-Q4. E19's twelve months = 2026-Q1 + 2026-Q2 + 2026-Q3 +
# 2026-Q4, ending 2026-06-30 -- which is also the issuer's own fiscal year
# 2025/26, so the year-end report's Jul-Jun column checks every quarter.
#
# DOCUMENTS (each fetched and recorded by `vss nordic`):
#   2026-Q1  release 1396024 (2025-10-23), Interim report 1 July - 30 September 2025 (21 pp)
#            sources/RVRC.ST_2026-Q1_interim-report-q1-and-q3_2025-10-23_en_a0.pdf
#   2026-Q2  release 1416236 (2026-01-29), Interim report 1 July - 31 December 2025 (23 pp)
#            sources/RVRC.ST_2026-Q2_half-year-financial-report_2026-01-29_en_a0.pdf
#   2026-Q3  release 1437483 (2026-04-28), Interim report 1 July 2025 - 31 March 2026 (24 pp)
#            sources/RVRC.ST_2026-Q3_interim-report-q1-and-q3_2026-04-28_en_a0.pdf
#   2026-Q4  release 1457620 (2026-08-11), Year-end & Q4 report 1 July 2025 - 30 June 2026 (24 pp, unaudited)
#            sources/RVRC.ST_2026-Q4_financial-statement-release_2026-08-11_en_a0.pdf
#   FY 2025  release 1394559 (2025-10-15), Annual Report 2024/25 (122 pp, audited; year to 30 June 2025)
#            sources/RVRC.ST_2025-FY_annual-financial-report_2025-10-15_en_a0.pdf
#            -- ON FILE FOR POLICIES ONLY. Its year end (2025-06-30) is the
#            day the basis window opens, not inside it, so under E20/E41 it
#            supplies no figure; the accounting-policy sentences the zeros
#            below rest on are cited from it and the fact that they are a
#            year old is said on each. The Annual Report 2025/26 is due
#            2026-10-16 (year-end report p.24) and will replace the year-end
#            report as the annual document. No ESEF package is on the feed
#            for the 2024/25 report (release 1394559 carries one PDF).
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF, 100 dpi): each
# quarter's income statement and cash flow statement, the year-end
# report's balance sheet (both pages), APM reconciliation (p.19) and
# note 5 (p.22). The text layer carries every numeral intact; every figure
# agreed. Printed page = PDF page in every document.
#
# STATUS: all UNVERIFIED (owner's instruction). No section 5 run, no
# fv_base, no tier, no mbp; no growth view is registered.
#
# UNITS: SEK MILLION, WHOLE (money_unit millions, no decimals -- the
# reports round to the nearest million and print figures between 0 and
# 0.5 as 0, year-end report p.20). That coarseness is a fact about the
# accounts: a printed '-0' is a stated outflow under half a million and
# is entered as 0. share_unit WHOLE shares, as printed.
#
# E34 -- INTEREST. Both sides INSIDE operating activities: 'Interest
# received' and 'Interest paid' sit above 'Cash flow from operating
# activities before changes in working capital' in every cash flow
# statement (Q4 p.13: 1 and -1; year 4 and -4). `interest_in_ocf: yes`.
#
# E70 -- LEASES IN THE FLOW. IFRS 16 filer: 'Amortisation of lease
# liabilities' is a FINANCING line (Q4 p.13: -2; year -8); IFRS 16.50(b).
# The interest on leases is inside 'Interest paid' (AR 2024/25 note 18
# p.108: 'Interest expenses for lease liabilities 0').
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS at 2026-06-30:
#   * borrowings: NAMED ZEROS on E25's note form, from the basis document
#     itself -- the year-end report's APM reconciliation p.19 states
#     'Interest-bearing debt * 15' with '* Is composed of leasing
#     liabilities', and the balance sheet (p.12) presents no borrowings
#     caption. The group's SEK 600 m credit facility was undrawn at 30 June
#     2025 (AR 2024/25 note 21 p.110: 'Credit Facility B 600, Used 0') and
#     'Fees related to borrowings -0' in financing is the facility fee.
#   * leases: p.19 'Interest-bearing debt 15 ... composed of leasing
#     liabilities' is the STATED total; the balance sheet's two parts read
#     8 + 8 = 16, one off from whole-million rounding. The stated total is
#     entered and the parts named (E65; one IFRS 16 liability).
#   * pension: zero on the note form -- AR 2024/25 p.100: 'The group's
#     pension obligations only include contribution defined plans.' The
#     sentence is a year old; the 30 June 2026 balance sheet presents no
#     pension caption. THE OWNER DECIDES whether a year-old policy sentence
#     is E25's 'sentence that states there is none' (the same question
#     ZZ-B.ST's file asks).
#   * asset retirement obligation: zero on the CAPTION form (E68.1): the
#     30 June 2026 balance sheet (p.12) presents no provision caption of
#     any kind -- an online apparel retailer with leased premises and no
#     restoration provision recognised. Not on E68.1's refuse list.
#   * other_current_financial_assets: 'Interest-bearing assets (-) -' on
#     p.19, nil; the field takes no zero (E25), so it is blank.
#
# E36 -- SHARE-BASED COMPENSATION. Zero on the note form: the warrants are
# 'transferred to the participants at market price' (year-end report note
# 5 p.22, in the basis document) and 'are not reported according to
# IFRS 2. Instead, they are reported as an increase in equity equal to
# the price of the warrants as acquired' (AR 2024/25 p.100). The year-end
# report's 'Expenses mainly related to LTIP and stay-on-bonus 2' (p.19,
# Jul-Jun 2025/26, an item affecting comparability) is a cash expense
# already inside EBIT and the flow -- named, not an IFRS 2 charge.
#
# E38 / E75 / E75.1 -- DIVISOR. The reports print a BASIC weighted average
# only ('Weighted average number of shares 107,347,924' for Q4, 107,904,719
# for the year, note 5 p.22); diluted EPS (3.09) differs from basic (3.10),
# so a diluted count exists and is not printed -- `diluted_weighted_average_shares`
# is DATA MISSING, said so, never derived. E75 takes the window-end count:
# note 5 p.22 prints the NET count directly, 'the total number of
# outstanding shares (total number of shares reduced by treasury shares)
# amounts to 104,596,200' (107,359,430 issued less 2,763,230 treasury) --
# `shares_outstanding_period_end`, basic (E75.1: no diluted count at a
# date is printed).
#
# E23 -- CAPEX. Two lines printed ('Acquisition of tangible assets',
# 'Acquisition of intangible assets'), both tiny; the split fields are
# entered and `capex_combined` stays blank.
#
# THE MARGIN CHECK (B46, a second variant). RVRC prints its EBIT margin to
# one decimal from UNROUNDED figures, while EBIT and net sales are printed
# in whole millions. For Q1 (75 / 392 = 19.13% against the printed 19.0%)
# and Q3 (105 / 487 = 21.56% against 21.4%) the gap exceeds the loader's
# 0.1pp tolerance, so `operating_income` and `op_margin` are left blank
# on those two quarters and recorded in comments; Q2, Q4 and the year pass.
# The TTM EBIT the store forms is therefore missing two quarters.
#
# NOT PRESENTED: EBITDA (the issuer's operating APM is adjusted EBIT); a
# stated net debt / EBITDA (the covenant, 'must not exceed 3.50', is a
# threshold, and the group is net cash: p.19 'Net debt(+)/Net cash(-)
# -313'); a diluted weighted average count.

