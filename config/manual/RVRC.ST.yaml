sector: Consumer Cyclical   # the screener's own string (data/screener_snapshots/2026-08-29/fundamentals.sqlite, field sector) -- not from these documents
reporting_frequency: quarterly
origin: manual

interest_in_ocf:
  value: yes
  source: "Year-end & Q4 report 1 July 2025 - 30 June 2026 (unaudited); every interim of the year"
  page: "Q4 p.13, Group statement on cash flow, operating activities: 'Interest received 1' and 'Interest paid -1' (Apr-Jun 2026; year: 4 and -4) sit above 'Cash flow from operating activities before changes in working capital 51' and 'Cash flow from operating activities 31'. The same placement in the Q1 (p.10), Q2 (p.12) and Q3 (p.13) statements and in AR 2024/25 p.96"
  interest_source: cash_flow_statement

operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): the principal portion of lease payments is a financing flow; Q4 p.13 'Amortisation of lease liabilities -2' (year -8) sits in financing activities in every statement. Interest on leases, 0 to the nearest million (AR 2024/25 note 18 p.108), is inside 'Interest paid' in operating"

