# E34: where this filer books its interest, for the BASIS YEAR
# (FY2025). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0000021344 (Coca-Cola Company) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0000021344.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E34.1 via E18: this filer tags the income statement's PAIR
  # -- `finance_costs_period` (`InterestExpenseNonoperating`) and
  # `finance_income_period` (`InvestmentIncomeInterest`) -- and not the net
  # element. THE STORE SUBTRACTS the two stated figures on the
  # basis (E18, the same permission E16 gives the share count);
  # nothing here nets them and no net is written. The add-back
  # is that net, an ACCRUAL PROXY, and FCF0 prints it as one.
  interest_source: income_statement_net

# E70: whether this filer's operating cash flow bears its operating
# lease payments. Under ASC 842 it does, so FCF0 ADDS the stated cash
# paid (`operating_lease_payments`) back: the lease liability in net
# debt already charges the obligation, and the lease is counted once.
