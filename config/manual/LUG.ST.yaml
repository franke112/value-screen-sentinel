# config/manual/LUG.ST.yaml -- Lundin Gold Inc., hand-read from the issuer's
# quarterly filing packages as released on the Nasdaq Stockholm disclosure
# feed (sources/manifest.json, origin nasdaq-nordic, market "Main Market,
# Stockholm", company "Lundin Gold Inc."). Built 2026-08-30. IFRS; calendar
# year; quarterly reporter in US DOLLARS; Toronto-primary (TSX: LUG) with a
# Stockholm secondary listing quoted in SEK -- so reporting_currency USD and
# quote_currency SEK, and every price leg needs E24's conversion.
#
# WHERE ITS DOCUMENTS ARE. Lundin Gold is on the Nasdaq Stockholm feed: each
# results release carries the news release AND the full package (MD&A +
# financial statements) as attachments, which `vss nordic` fetched. The
# annual report is NOT on the feed (release 1437107 of 2026-04-24 is a
# two-page notice that it was published at lundingold.com/en/investors/
# quarterly-and-annual-financial-statements/; the file there is
# lug_2025_annual_report_final_23apr.pdf) and the AIF is on SEDAR+. The
# AUDITED annual statements are inside the Q4 package below, as Canadian
# practice has it, so nothing needed for the figures is missing.
#   Q3 2025  release 1399286 (2025-11-07), a0 = MD&A + interim FS (48 pp)
#            sources/LUG.ST_2025-Q3_interim-report-q1-and-q3_2025-11-07_en_a0.pdf
#   FY 2025  release 1421529 (2026-02-20), a0 = annual MD&A + AUDITED
#            consolidated statements (81 pp; independent auditor's report p.48)
#            sources/LUG.ST_2025-Q4_financial-statement-release_2026-02-20_en_a0.pdf
#   Q1 2026  release 1440378 (2026-05-07), a1 = MD&A + interim FS (43 pp)
#            sources/LUG.ST_2026-Q1_interim-report-q1-and-q3_2026-05-07_en_a1.pdf
#   Q2 2026  release 1457227 (2026-08-06), a1 = MD&A + interim FS (48 pp)
#            sources/LUG.ST_2026-Q2_half-year-financial-report_2026-08-06_en_a1.pdf
#   (the partner attachment of each release is the 9-11 page news release;
#   recorded, not read for figures.) No ESEF package exists: a Canadian
#   issuer filing under NI 51-102, not the Transparency Directive.
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF, 95 dpi): the
# statements of income and cash flows of every package, the Q2 2026 and
# FY2025 statements of financial position, Q2 2026 notes 17 and 19, FY2025
# notes 10-11 and 19, and the MD&A highlights tables (p.2 of each package)
# and the FY2025 MD&A's quarterly summary (p.21). The text layer carries
# every numeral intact; every figure agreed. Printed page = PDF page.
#
# STATUS: all UNVERIFIED (owner's instruction). No section 5 run, no
# fv_base, no tier, no mbp; no growth view is registered -- and see THE
# FLAG below before one is.
#
# UNITS: US$ THOUSANDS (money_unit thousands), as every statement is headed;
# share_unit WHOLE. Per-share figures in US$.
#
# THE FOURTH QUARTER IS ONLY PARTLY STATED. Canadian annual statements
# carry no Q4 column. The FY2025 MD&A states Q4 2025 revenue, income from
# mining operations, EBITDA, net income, EPS, cash provided by operating
# activities and free cash flow (highlights table p.2, 'Three months ended
# December 31, 2025') and the quarterly summary (p.21) adds diluted EPS and
# the share counts -- those are entered. It states NO Q4 cash capex (the
# p.21 'Additions to property, plant and equipment 27,331' is the accrual
# addition, not 'Acquisition and development of property, plant and
# equipment' paid), NO Q4 depletion and depreciation, NO Q4 interest
# received. FY less nine months would supply them and is a subtraction the
# accounts never print (E22), so on the TTM basis FCF0 is DATA MISSING for
# the capex leg and the interest leg. The FY2025 annual basis is complete.
#
# THE FLAG (reported, not decided -- the Norsk Hydro question). Revenue is
# ounces sold times a gold price the company does not hedge: 'The Company
# has not hedged the price of any commodity at this time' (FY2025 note 21,
# p.78; Q2 2026 MD&A p.24). Average realized gold price was $3,634/oz in
# Q3 2025, $4,299 in Q4 2025, $4,951 in Q1 2026 and $4,359 in Q2 2026
# (MD&A p.2 of each package), against all-in sustaining costs of $1,036 /
# $1,193 / $1,114 / $1,176 per oz -- so the TTM cash flow below is the
# product of a price that moved 36% inside the window and a mine plan for
# ONE asset (Fruta del Norte, Ecuador; 'dependence on a single mine' is in
# the issuer's own risk list). Concentrate sales are provisionally priced
# and marked to forward gold prices until final settlement (Q2 2026 note
# 3(a): a $23.3 million decrease in receivables in the quarter 'reflecting
# declining gold prices'). Royalties and Ecuadorian profit sharing scale
# with price (MD&A: 'For every $100 per oz increase in gold price', cash
# operating cost and AISC rise), and an Exploitation Agreement sovereign
# adjustment guarantees Ecuador no less than 50% of cumulative economic
# benefits over the life of mine (note 20). From 2026 the SILVER STREAM
# (below) sells 100% of payable silver to LunR for 10% of spot. A ten-year
# growth rate registered on this cash flow is a gold-price forecast times a
# reserve life unless it is written as volume with price as a scenario.
#
# THE SILVER STREAM OBLIGATION, named for a ruling. On 2026-05-28 Lundin
# Gold sold a life-of-mine silver stream to LunR Royalties Corp. for
# 50,505,051 LunR shares, distributed to shareholders in kind on 2026-06-11;
# the Stream is 'a derivative financial liability, to be measured at fair
# value' (Q2 2026 note 8, p.37): 'Silver stream obligation 663,990'
# non-current and 'Current portion of silver stream obligation 26,355' on
# the balance sheet (p.30), note 19 (p.45) total 690,345 (inception 821,452,
# less deliveries 4,395, less a derivative gain 126,712). It is settled in
# silver, not cash, and is NOT a borrowing under E14/E35 as written -- so
# the borrowing fields below are caption zeros and the Stream is NAMED here
# and in the report, not entered. Whether a metal-stream obligation is a
# net-debt leg (E68's reasoning: a measured, discounted, non-optional
# future outflow) is the owner's ruling; net debt without it reads as
# $507 million of net cash.
#
# E34 -- INTEREST. Interest RECEIVED is inside operating activities: the
# FY2025 statement prints 'Interest received 22,863' in the working-capital
# block above 'Net cash provided by operating activities' (p.54), the Q3
# 2025 statement the same ('Interest received 6,892', p.33); the 2026
# interim statements dropped the separate line but changed nothing -- the
# finance income sits in net income with no reclassification, and Q2 2026
# note 17 (p.42) restates 'Interest received 5,897' for the quarter and
# 12,240 for the half. Interest PAID, when the company had debt, was a
# FINANCING line ('Interest paid (3,688)' in 2024, p.54, with the dash for
# 2025). Nil since the 2024 repayment. So `interest_in_ocf: yes` -- the
# operating cash flow bears every interest flow the filer has -- and E34's
# add-back of net interest paid (nil paid less received) REMOVES the
# interest income from FCF0 where both halves are stated. They are stated
# for Q3 2025, Q2 2026 and FY2025; NOT for Q4 2025 (no Q4 column) and NOT
# for Q1 2026 (its note 16, p.39, lists only the cash composition), so on
# the TTM basis the leg is DATA MISSING and named in the report. Mixed
# placement (paid outside, received inside) is the same shape RMV.L shows
# in mirror image -- a class for the owner.
#
# E70 -- LEASES. No lease liability caption anywhere in the statements or
# notes; nothing to add back. `operating_leases_in_ocf: no` under IFRS 16
# as a matter of standard, with nothing behind it.
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS at 2026-06-30 (p.30):
#   * borrowings: ZERO on the caption form -- the balance sheet enumerates
#     every liability (accounts payable and accrued liabilities, income
#     taxes payable, other current liabilities, current portion of silver
#     stream obligation, other non-current liabilities, silver stream
#     obligation, reclamation provisions, deferred income tax liabilities)
#     and no borrowing is among them; the FY2025 quarterly summary prints
#     'Long-term debt -' for every 2025 quarter (p.21); the 2024 debt was
#     repaid ('Repayments of long-term debt (101,106)', 2024, p.54). The
#     Stream is named above, not here.
#   * leases: ZERO on the caption form -- no lease liability line on the
#     balance sheet; 'Other current/non-current liabilities' are the
#     cash-settled share units (note 10).
#   * pension: DATA MISSING. No pension caption and NO SENTENCE anywhere in
#     the FY2025 notes saying the company has no defined-benefit plan (the
#     word does not occur in the audited statements). E35.1's note form
#     needs the sentence; absence of the word is not it. A class for the
#     owner: filers with no plan and no statement.
#   * asset retirement obligation: 'Reclamation provisions 8,910' -- the
#     mine-closure provision, read as E68 requires of an extractive filer
#     (E68.1's refuse-until-read list), not zeroed; FY2025 note 10 (p.68)
#     gives the undiscounted, inflated estimate of $29.8 million at a 9.4%
#     pre-tax discount rate, 8,626 at 31 December 2025.
#   * cash: 'Cash and cash equivalents 507,130' INCLUDES short-term
#     investments of 99,986 (note 17, p.42: cash 407,144 + short-term
#     investments 99,986); no separate current financial asset line, so
#     `other_current_financial_assets` is blank (E25). Provisionally priced
#     trade receivables of $134 million are fair-valued, inside receivables.
#
# E36 -- SHARE-BASED COMPENSATION. The cash flow line 'Stock-based
# compensation' (8,583 / 4,100 / (2,911) / 48,460) is dominated by the
# REVALUATION of cash-settled share units, which are 'recognized as
# financial liabilities measured at fair value' and paid through 'Share
# units settled in cash' inside operating cash flow (27,250 in Q1 2026) --
# so FCF0 already bears them and E36 excludes them. The EQUITY-SETTLED
# charge is the stock-option expense: $1.0 million for 2025 (FY note 12,
# p.69: 'expense of $1.0 million (2024 - $1.2 million) related to
# options'), $0.3 million for Q1 2026 (Q1 note 9, p.35), stated for the
# nine months ($0.8 million) not the quarter in Q3 2025, and for the half
# ($0.5 million) not the quarter in Q2 2026. `sbc` is entered where the
# period's own figure is printed and is DATA MISSING otherwise; the annual
# 1,000 reaches the TTM basis under E41.
#
# E38 / E75 / E75.1 -- DIVISOR. Each statement prints a diluted weighted
# average for its period; FY2025's 242,510,385 (p.52; note 11 p.68) is
# E41's annual figure. No period-end share count is printed for 30 June
# 2026 (note 9 states issuances only); the MD&A's 'As at the date of this
# MD&A, there were 241,832,730 common shares issued and outstanding' (p.32)
# is a count on a later day and is entered as the memo `shares_point_in_time`
# (E38: never the divisor). The window-end count is DATA MISSING; E41's
# annual average stands, 0.3% from the point-in-time count.
#
# E23 -- CAPEX. One line, 'Acquisition and development of property, plant
# and equipment' -> `capex_combined`; 'VAT paid on investing activities'
# is a separate line, not capex, named. No intangibles line; mineral
# properties are depleted, not purchased.
#
# NOT PRESENTED: an operating profit line (Canadian format runs income from
# mining operations, then other expenses, to net income before tax -- E5
# takes the statement's own presentation, and there is none, so
# `operating_income` and `op_margin` are absent); a stated revenue growth
# rate; gross profit is entered as 'Income from mining operations'
# (revenue less cost of goods sold including depletion), the statement's
# own subtotal. EBITDA is the MD&A's non-IFRS 'Adjusted EBITDA' (the figure
# the issuer guides on; for Q2 2026 it excludes the derivative gain and
# LunR loss that the unadjusted 398,879 carries).

ticker: LUG.ST
