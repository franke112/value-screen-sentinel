reporting_currency: USD
money_unit: thousands
share_unit: whole
quote_currency: SEK
sector: Basic Materials   # the screener's own string (data/screener_snapshots/2026-08-29/fundamentals.sqlite, field sector) -- not from these documents
reporting_frequency: quarterly
origin: manual

interest_in_ocf:
  value: yes
  source: "Consolidated statements of cash flows, years ended December 31, 2025 and 2024 (audited, FY2025 package p.54); Q3 2025 and Q2 2026 packages"
  page: "FY2025 p.54: 'Interest received 22,863' sits INSIDE operating activities, among the changes in non-cash working capital above 'Net cash provided by operating activities 1,023,029'; 'Interest paid 9 | - | (3,688)' sits in FINANCING activities, a dash for 2025 and 3,688 for 2024 when debt existed. Q3 2025 p.33: 'Interest received 6,892' inside operating, 'Interest paid -' in financing. The 2026 interims print no separate interest line; Q2 2026 note 17 (p.42) restates 'Interest received 5,897' (quarter) and 12,240 (six months) as supplemental cash information. With no debt, the operating cash flow bears every interest flow the company has; where interest paid returns it will be a financing flow"
  interest_source: cash_flow_statement

operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS filer with no lease liability caption"
  page: "IFRS 16.50(b) would put any lease principal in financing; the statements present no lease liability (balance sheet p.30, every liability enumerated) and no lease payment line, so nothing is added back and `lease_payments_capital` is absent"

