# BOUV.OL -- Bouvet ASA, hand-read from the issuer's own periodic reports.
# WRITTEN 2026-09-08 at INTAKE (E111): the name is READ, NOT WATCHED. No
# section 5 run, no fv_base, no tier, no mbp, no growth view, and no entry
# on the watchlist.
#
# DOCUMENTS. All five are PRIMARY under `sources/manifest.json`, origin
# `euronext-oslo-newsweb` -- taken from Euronext Oslo's NewsWeb, the
# Norwegian Officially Appointed Mechanism, and not from bouvet.no:
#   1. Q3 report 2025 (msg 659260, 2025-11-11)
#      sources/BOUV.OL_2025-Q3_half-year-financial-report_2025-11-11_en_a1.pdf
#   2. Q4 report 2025 (msg 665740, 2026-02-13)
#      sources/BOUV.OL_2025-Q4_half-year-financial-report_2026-02-13_en_a0.pdf
#   3. Annual Report 2025, AUDITED (msg 670820, 2026-04-16)
#      sources/BOUV.OL_2025-FY_annual-financial-report_2026-04-16_en_a0.pdf
#   4. Q1 report 2026 (msg 673265, 2026-05-13)
#      sources/BOUV.OL_2026-Q1_half-year-financial-report_2026-05-13_en_a0.pdf
#   5. Q2 report 2026 (msg 680129, 2026-08-19)
#      sources/BOUV.OL_2026-Q2_half-year-financial-report_2026-08-19_en_a0.pdf
# The ESEF/iXBRL package (msg 670820 attachment 1,
# bouvetasa-2025-12-31-1-no.zip) exists and was NOT fetched: it is the
# Norwegian-language tagged copy of document 3 and nothing here reads it.
# Every filing is also on NewsWeb in a Norwegian edition, as a separate
# message; the English edition was taken, and `--language en` on the
# download is the OWNER'S LABEL, not a field the feed carries.
#
# EXTRACTION: THE PDF PATH, everything UNVERIFIED (E40). Figures were read
# from each PDF's text layer (pypdf) into this file. NO READ-BACK against a
# rendered page has happened, so nothing here is VERIFIED and section 5 is
# gated until the owner reads back what E108's floor says matters.
#
# UNITS. money_unit: THOUSANDS -- every statement in all five documents is
# headed `NOK 1 000`. The narrative and the highlights table on p.2 of each
# quarterly speak in NOK million and are NOT the source of any figure here
# (E53: one scale per file). share_unit: WHOLE -- the key-figures table
# prints whole shares (`Weighted average diluted shares outstanding
# 103 372 896`).
#
# BASIS: E19's twelve-month window is 2025-Q3 + 2025-Q4 + 2026-Q1 + 2026-Q2,
# ending 2026-06-30. Every quarter is a STANDALONE calendar quarter column
# printed in its own report (Jul-Sep, Oct-Dec, Jan-Mar, Apr-Jun).
#
# THE ISSUER'S OWN R12M COLUMN CONFIRMS THE STITCH. The Q2 2026 report's
# highlights table (p.2) prints a `Jul 2025-Jun 2026` column, and every sum
# of the four quarters entered below lands on it:
#   revenue   870 474 + 998 435 + 1 037 016 + 974 968 = 3 880 893  (3 880.9)
#   EBIT       91 592 + 103 362 +   127 037 + 122 310 =   444 301  (444.3)
#   profit     70 085 +  71 853 +    97 228 +  92 908 =   332 074  (332.1)
#   OCF        12 144 + 363 443 -    48 547 -  54 600 =   272 440  (272.4)
# Four independent documents, one column, four agreements. That is the
# strongest check this store gets and it was free.
#
# E34 -- WHERE THE INTEREST SITS, AND IT IS PROVED RATHER THAN ASSUMED.
# `interest_in_ocf: no`. The cash flow statement presents interest RECEIVED
# under INVESTING (`Received interest`) and every interest PAID under
# FINANCING (`Payments interests on lease liabilities`, `Interest
# payments`), with `Net cash flow from operating activities` struck above
# all three. The operating section carries one reversal line, `Interest
# income and interest expenses`, and on its face that line removes only the
# interest income and the NON-LEASE interest expense: FY2025 -23 942 +
# 1 093 = -22 849, exactly the printed figure, and the same identity holds
# in all four quarters. Read literally that would leave the lease interest
# (FY2025: 24 386) charged inside operating AND paid again in financing.
# IT CANNOT BE. The three sections sum to `Net changes in liquid assets`
# -162 037, and the balance sheet moves 834 341 -> 672 304, the same
# 162 037. A double charge of 24 386 would break that tie by 24 386 and it
# does not break. So the add-back is inside `Changes in other accruals`
# (-7 542), unnamed but necessarily present, and the operating total is
# stated BEFORE all interest. Nothing is added back to FCF0, and
# `net_interest_paid` is therefore not read at all.
#
# E70 -- THE LEASES IN THE FLOW. IFRS 16 filer: the principal is a
# financing flow (IFRS 16.50(b)) and the statement prints it there
# (`Payments on lease liabilities`), so `operating_leases_in_ocf: no` and
# nothing is added back. `lease_payments_capital` is entered as E70's MEMO
# so a reader can see the size of what the bridge charges.
#
# E23 -- CAPEX IS SPLIT, in every one of the five documents: `Purchase of
# fixed assets` and `Purchase of intangible assets` are two printed lines,
# so `capex_ppe` and `capex_intangibles` are used and `capex_combined`
# stays blank. Q3 2025 prints the intangibles line as a literal 0.
#
# E14 / E35 -- THE DEBT LEGS. Bouvet has NO BORROWINGS AND SAYS SO, in
# every document: *"The group has no interest-bearing debt"* (Q3 2025 p.8,
# Q4 2025 p.8, Q1 2026 p.5, Q2 2026 p.5) and, in the audited annual report,
# *"the group had no interest-bearing liabilities other than lease
# liabilities recognised under IFRS 16"* (p.10, directors' report) and
# *"Bouvet had no interest-bearing liabilities as at the end of 2025"*
# (p.10, interest-rate risk). Note 17 lists the group's financial
# instruments exhaustively -- work in progress, trade receivables, liquid
# assets, lease liabilities, trade payables -- and no borrowing is among
# them. E25 `note` on both borrowing fields, every quarter. The `Loan from
# group company 40 000` in the AR's PARENT-company balance sheet (p.170) is
# Bouvet ASA's payable to Bouvet Norge AS, eliminated on consolidation and
# not group debt; named here so a reader who greps for "loan" sees it was
# read. The unutilised NOK 100.0m overdraft facility is a facility, not a
# drawing.
#
# E35.1 -- PENSION. ZERO, on the issuer's own sentence: note 06 (p.134),
# *"The Group's pension schemes satisfy the requirements of this law, and
# represents a defined contribution plan"*, with the whole NOK 128 395
# thousand of 2025 pension cost being paid contributions and the
# commitment *"fully met when paid"*. No defined-benefit obligation exists
# and no balance sheet in any of the five documents presents a pension
# caption. E25 `note`.
#
# E68.1 -- ASSET RETIREMENT OBLIGATION. ZERO. Bouvet is an IT consultancy
# that LEASES 17 offices and owns no plant requiring decommissioning: it is
# on none of E68.1's refuse-until-read lists. The quarterly balance sheets
# carry `Other provisions for obligations` as a literal 0 at 31.12.2025,
# 31.03.2026 and 30.06.2026 -- an E25 CAPTION at nil -- and the annual
# report contains not one occurrence of `asset retirement`, `decommission`,
# `dismantl`, `restoration`, `make good`, `dilapidation`, `reinstatement`
# or `environmental provision` (E107 search, recorded on the field).
#
# THE ONE BALANCE-SHEET ITEM NO DOCUMENT EXPLAINS. `Other provisions for
# obligations` stood at 5 545 at 30.09.2025 (and 5 545 at 31.12.2024),
# inside LONG-TERM DEBT, and went to 0 in Q4 2025. The annual report's
# balance sheet points it at note 14 (Intangible assets) and note 14 never
# mentions it; the words `contingent`, `earn-out` and `conditional
# consideration` do not occur in the report at all. IT DOES NOT REACH THE
# BASIS -- net debt is a stock at 2026-06-30, where the caption is zero --
# but it is an open question about the accounts and is reported as one.
#
# E81 -- PREPAID DELIVERY OBLIGATION. ZERO, with the deferred revenue
# NAMED. The balance sheets carry `Deferred revenue` (6 014 / 6 478 /
# 6 314 / 5 346 across the four quarter-ends) and note 02 explains it as
# ordinary billings in advance of a time-and-materials consultancy. E81's
# own exclusion, in its own words: *"NOT this leg: the ordinary contract
# liabilities of a subscription or services business, customer deposits,
# billings in advance -- working capital the flow already carries."*
#
# E105 -- DIVIDENDS TO NON-CONTROLLING INTERESTS. ZERO, and Bouvet has no
# minority to pay. The group's last NCI was extinguished in 2024: the
# FY2025 statement of changes in equity carries an NCI column that reads
# 5 074 at 01.01.2024, `Change non-controlling interests -5 074`, and 0 at
# 31.12.2024 and 31.12.2025; the FY2025 cash flow prints `Purchase from
# non-controlling interests 0` (2024: -4 917); and every income statement
# in the window assigns the WHOLE profit to `Shareholders in parent
# company`. The Q1 and Q2 2026 reports contain no occurrence of any NCI
# term at all.
#
# E88 / E91 -- THE DIVISOR. Bouvet prints a per-quarter weighted-average
# DILUTED count in the key-figures table of every quarterly report, for all
# four calendar quarters of the window, so E91 governs and the divisor is
# the code's day-weighted average of the four stated counts -- not E88's
# annual fall-back. The FY2025 annual average (103 788 395, note 11) is on
# the annual entry below; the window-end count is entered as E80's stated
# ISSUED / TREASURY pair and stays MEMO (E88: never promoted).
#
# WHAT NONE OF THE FIVE DOCUMENTS STATES, and is therefore absent here and
# never derived:
#   * GROSS PROFIT. Bouvet presents operating expenses BY NATURE and prints
#     no gross-profit line in any document. DATA MISSING, not zero -- E6's
#     quality leg has no numerator for this name.
#   * A NET DEBT figure and a FREE CASH FLOW reconciled to the statements.
#     `Net free cash flow` IS printed in the key figures and IS an APM the
#     issuer defines (`net cash flow from operations plus net cash flow
#     from investing activities`); it is entered as an E103 REFERENCE
#     figure only, never in a basis. No net-debt figure is stated anywhere.
#   * INTEREST PAID as one line. It is split across two financing lines
#     (lease interest and other interest), so `finance_costs_paid` stays
#     blank; the income statement's `Net financial items` IS printed and is
#     entered as `net_finance_costs`.
#
# TWO THINGS THE ISSUER'S OWN ARITHMETIC DISAGREES WITH ITSELF ABOUT,
# found by reading the four reports whole and reported rather than fixed:
#   1. **The Q1 2026 report's EBITDA is on a different definition from the
#      Q2 2026 report's and from the annual's.** Q1 2026 prints EBITDA
#      134 659 against EBIT 127 037 -- a difference of 7 622, which is
#      `Depreciation fixed assets 5 426` + `Amortisation 2 196` and
#      EXCLUDES `Depreciation of right-of-use assets 17 849`. The same
#      report's own definition table says *"EBITDA Operating profit +
#      depreciation fixed assets and intangible assets"*, and the Q2 2026
#      report's Jan-Jun 2026 EBITDA of 300 361 against EBIT 249 347 gives
#      51 014 = 25 471 + 25 543, which DOES include right-of-use
#      depreciation in both quarters. On the later report's basis Q1 2026
#      EBITDA is 300 361 - 147 853 = 152 508, not 134 659. The two
#      documents disagree, so `ebitda` for 2026-Q1 is DATA MISSING with
#      both figures named rather than a figure picked between them (E104's
#      posture). FY2025's 572 623 and the other three quarters reconcile
#      exactly and are entered.
#   2. **`Ordinary profit before tax` differs by a few thousand between
#      the income statement and the cash flow statement in three of the
#      five documents** -- Q4 2025: 102 121 vs 102 117; Q1 2026: 125 660
#      vs 125 654; Q3 2025 Jan-Sep: 370 423 vs 370 427. Nothing entered
#      here reads that line, so nothing turns on it; recorded because a
#      later reader will meet it.

