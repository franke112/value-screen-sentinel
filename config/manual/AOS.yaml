      # THE DIRECTION IS `raises`, and that is the whole reason the field
      # gained one: this leg is an ADD-BACK. The record strikes it at ZERO,
      # which is the LOW end of its range, so the fair value it produces is
      # the conservative one and the bound says how much higher the truth
      # could be. Perturbing it DOWNWARD -- which is what E106's first
      # implementation did for every leg -- would measure a move that
      # cannot happen.
      operating_lease_payments:
        bound: 23200000
        bound_direction: raises
        source: "E106 clause 3 bound, from the issuer's own lease note"
        page: "sources/AOS_FY2025_annual-report-10k_2026-02-10_en_a0.htm, note 4 Leases, 'The components of lease expense were as follows' (dollars in millions), year ended December 31 2025: 'Operating lease expense / Cost of products sold $6.4' and 'Selling, general and administrative expenses 16.8' -- TOTAL OPERATING LEASE EXPENSE 23.2, entered as 23,200,000 on this file's whole-unit declaration. THE CEILING IS STRICT AND HERE IS WHY IT CANNOT BE EXCEEDED: (1) the same note states 'Cash flows associated with leases are materially consistent with the expense recorded in the consolidated statement of earnings', so cash and expense do not diverge; (2) 23.2 INCLUDES short-term lease expense of $1.8m and variable lease expenses of $5.8m (note 4 footnote 1), and ASC 842 excludes BOTH from the measurement of the lease liability -- so the payments E70 adds back, which are only those on the capitalised portfolio in net debt, are at most 23.2 - 1.8 - 5.8 = 15.6 and the bound is left at the looser 23.2 rather than at a figure formed by subtraction (E22); (3) the maturity table on the same page corroborates the order of magnitude: 2026 payments $14.3m against total undiscounted payments $56.7m over a 7.1-year weighted-average remaining term."
