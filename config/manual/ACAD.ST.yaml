# config/manual/ACAD.ST.yaml -- AcadeMedia AB (publ), hand-read from the
# documents the issuer filed on Nasdaq Stockholm's disclosure feed
# (sources/manifest.json; config/nordic_issuers.yaml, "AcadeMedia AB").
# Built 2026-10-20. IFRS as adopted by the EU; FISCAL YEAR JULY-JUNE.
#
# INTAKE OUTSIDE THE SCREENER. The owner asked for it 2026-10-20 from a
# one-off cheapness scan of names NOT in the drawdown band. Gate 1 needs a
# drawdown, so this name cannot enter the watchlist on today's price; the
# store exists to strike a value, nothing more.
#
# DOCUMENTS:
#   1. Year-end report 2025/26 (July 2025 - June 2026), released 2026-08-31.
#      sources/ACAD.ST_2026-Q4_financial-statement-release_2026-08-31_en_a0.pdf
#   2. Annual and Sustainability Report 2024/25 (audited), for policies only.
#      sources/ACAD.ST_2025-FY_annual-financial-report_2025-10-23_en_a0.pdf
#   The Annual Report 2025/26 is due 2026-10-23. Four legs WAIT FOR IT,
#   because the year-end report does not print them: pension_deficit (a
#   Norwegian defined-benefit plan exists -- 'Actuarial gains and losses 11'
#   in other comprehensive income), asset_retirement_obligation and
#   prepaid_delivery_obligation (the notes behind 'Provisions and other
#   non-current liabilities 245' and 'Other current liabilities 3,275'),
#   and diluted_weighted_average_shares (profit / diluted EPS would only
#   reproduce it to rounding). Until then `vss manual` refuses, correctly.
#
# Page numbers are PDF pages.
#
# INTEREST: IN FINANCING. AR 2024/25 accounting policies: 'Interest
# payments are recognised in financing activities.' The year-end report's
# cash flow statement p.19 agrees: 'Interest received (+) and paid (-) -93'
# and 'Interest paid, lease liabilities -669' sit under financing. So
# operating cash flow is BEFORE interest and E34 adds nothing back.
#
# LEASES: IFRS 16, and large -- the schools are rented. E117 deducts all of
# the lease cash (principal 1,888 + interest 669 = 2,557) from the flow, and
# every IFRS lease liability (12,244) leaves net debt.

ticker: ACAD.ST
name: AcadeMedia AB (publ)
reporting_currency: SEK
money_unit: millions
share_unit: whole
quote_currency: SEK
sector: Consumer Defensive   # the vendor's string for this ticker, fetched 2026-10-20 in the one-off scan (yfinance info.sector) -- not from these documents
reporting_frequency: quarterly
origin: manual

interest_in_ocf:
  value: no
  source: "Annual and Sustainability Report 2024/25; Year-end report 2025/26"
  page: "AR 2024/25 accounting policies: 'Interest payments are recognised in financing activities.' Year-end report p.19, Consolidated cash flow statement, financing activities: 'Interest received (+) and paid (-) -34 -23 -93 -67' and 'Interest paid, lease liabilities -173 -153 -669 -628', below 'Cash flow from operating activities 1,118 1,185 3,930 3,742'"
  interest_source: cash_flow_statement

operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-10-20 to an IFRS 16 filer"
  page: "IFRS 16.50(b): lease principal is a financing flow. Year-end report p.19: 'Repayment of lease liabilities -552 -479 -1,888 -1,897' under financing activities"

