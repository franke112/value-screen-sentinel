  value: yes
  source: "SEC XBRL companyfacts for CIK 0001467373 (Accenture plc) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0001467373.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E34.1 via E18, APPLIED BY HAND 2026-08-30 after the FY2025 10-K was
  # read. The filer states BOTH halves of the income statement's pair:
  # 'Interest income | 336,324' (tagged us-gaap:InvestmentIncomeInterest,
  # `finance_income_period`) and 'Interest expense | (228,555)' (tagged
  # us-gaap:InterestExpense, an element the map does not read -- entered
  # under E69 as `finance_costs_period`). The store subtracts (E18): net
  # interest EXPENSE 228,555 - 336,324 = -107,769 thousand, a net INCOME,
  # which E34's add-back REMOVES from FCF0 (the cash pile's interest is not
  # the firm's operating flow). Printed as 'accrual proxy'. E61's gross-only
  # proxy and E61.1 do NOT apply: interest income is stated and tagged, so
  # there is no unrecorded income to bound.
  interest_source: income_statement_net

