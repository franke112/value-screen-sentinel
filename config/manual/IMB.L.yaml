# config/manual/IMB.L.yaml -- Imperial Brands PLC, hand-read from the
# documents the issuer filed with the FCA's National Storage Mechanism
# (sources/manifest.json, origin `fca-nsm`, LEI 549300DFVPOB67JL3A42).
# Built 2026-08-30. UK-adopted IFRS; fiscal year to 30 September;
# half-yearly reporter.
#
# DOCUMENTS:
#   1. "Annual Report and Accounts 2025" (year ended 30 September 2025) --
#      NSM disclosure NI-000135706, Direct Upload PDF, published 2025-12-12,
#      220 pp, audited. PRINTED PAGE = PDF PAGE - 2 (PDF p.139 carries the
#      printed '137'); citations below give the PRINTED page.
#      sources/IMB.L_2025-FY_annual-financial-report_2025-12-12_xx_a0.pdf
#      The ESEF/iXBRL package NI-000138519 (2025-12-11) is on file beside
#      it (.zip). UPDATED 2026-08-30: the inline-XBRL report inside it
#      (reports/549300DFVPOB67JL3A42-2025-09-30-T01.xhtml, 484
#      ix:nonFraction facts; units GBP, GBP/shares and pure, no
#      xbrli:shares unit, so no share count is tagged) was read and
#      compared field by field against the 2025-FY entries (E40; the AUTO.L
#      ESEF precedent, E58). TWENTY fields agree exactly with a tagged fact
#      and carry `verified_kind: cross_document` citing tag and context
#      inline; four of them agree on magnitude with the sign reconciled by
#      CONVENTION (capex_ppe, capex_intangibles, lease_payments_capital:
#      an outflow concept tagged positive, signed negative here;
#      net_finance_costs: the income-less-costs concept tagged negative,
#      the printed net cost held positive here) -- not discrepancies. No
#      tagged fact DIFFERS from an entered figure. SIX fields have no tag
#      and were settled under E59, each citing its reconciling note
#      inline: depreciation_amortisation (five parts from notes 12-14 sum
#      to the tagged combined line 781), the diluted average (profit /
#      diluted EPS to rounding), shares_issued (the parent company's note
#      VI restates it; IssuedCapital 87 at 10p), treasury (the Directors'
#      Report's exact 62,589,137), net_debt_ebitda (the APM table's 8,406 /
#      4,299), and the two caption zeros (the tagged provision and
#      liability captions sum exactly to the tagged totals). ONE field is
#      NOT settled: employee_trust_shares_period_end -- the trusts' 3.0
#      million is stated once, in note 27, and nothing restates it; it
#      stays UNVERIFIED and section 5 refuses on it alone. 2026-H1 is
#      outside the package and stays UNVERIFIED.
#   2. "Half-year Financial Report" for the six months ended 31 March 2026
#      -- the NSM record f78fb72f-... (2026-05-12) is a 16 KB RNS SUMMARY
#      that holds no statements and points to 'the full statement ...
#      available via RNS' at rns-pdf.londonstockexchange.com/rns/8727D_1-
#      2026-5-11.pdf (47 pp, unaudited condensed statements). That PDF is
#      what was read; it is recorded in the manifest with origin `rns-pdf`
#      and the provenance note. Its pages are self-numbered 'Page N/47'.
#      sources/IMB.L_2026-H1_half-year-financial-report_2026-05-12_xx_a1.pdf
#   3. "Final Results" RNS 68423907-... (2025-11-18) -- on file, not read.
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF, 100 dpi): AR
# printed pp.137, 138, 141 (the statements), 158 (note 10), 166 (notes
# 18-20), 183, 184 (notes 25, 26), 190 (note 31); H1 pp.20, 22, 25 (the
# statements), 32, 33, 34 (notes 6, 9, 10). THE TEXT LAYER IS INTACT in
# both documents: every numeral came out whole ('32,171', '869,890,634',
# '(10,943)') -- the AUTO.L / APN.L spacing defect does not occur -- and
# every figure agreed between the two readings.
#
# STATUS: 2025-FY VERIFIED / cross_document after the ESEF and E59 pass of
# 2026-08-30 except employee_trust_shares_period_end (UNVERIFIED, stated
# once); 2026-H1 all UNVERIFIED. No section 5 run, no fv_base, no tier, no
# mbp; no growth view is registered.
#
# PERIODS HELD: 2025-FY (fiscal year to 2025-09-30) and 2026-H1 (six
# months to 2026-03-31), labels on the FISCAL basis. Under E31 section 5
# stands on the year as filed and names 2026-H1 as the newer period. The
# interim's H1 2025 comparatives, for the record: revenue 14,604;
# operating profit 1,456; net cash used in operating activities (32);
# PPE (89); intangibles (78); share-based payments 16; profit 886 (GBP m).
#
# UNITS: GBP MILLION (money_unit millions; every statement is headed
# '£ million'). share_unit WHOLE (note 26 prints 869,890,634; the EPS
# notes print their averages in millions). Per-share figures in PENCE;
# the quote is GBX.
#
# E34 -- INTEREST. `interest_in_ocf: no`. Both legs sit OUTSIDE operating:
# 'Interest received 73' heads cash flows from INVESTING activities and
# 'Interest paid (457)' heads cash flows from FINANCING activities; 'Net
# cash generated from operating activities 3,627' is struck after tax
# paid (513) and contains no interest. The interim keeps the placement
# (received 9 investing, paid (270) financing). Entered as
# `finance_costs_paid` / `finance_income_received`; the tool nets them.
#
# E70 -- LEASES. `operating_leases_in_ocf: no`: IFRS 16 filer; 'Lease
# liabilities paid (94)' / (46) sits in financing (IFRS 16.50(b)); note 14
# shows the lease cash flow 109 of which 15 is interest, so the 94 is the
# principal. Counted once, in net debt; `lease_payments_capital` is a memo.
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS. Borrowings by the two balance
# sheet captions, 'Borrowings' current 1,070 and non-current 8,524 (note
# 20 total 9,594, all capital-market notes bar 4 of bank loans); lease
# liabilities are SEPARATE captions (89 + 313), so E67 is not needed and
# the borrowing captions are already ex-lease. Leases by E71's stated
# total: note 14 roll-forward 'At 30 September 2025 402' (= 89 + 313;
# note 31 shows the same 402); H1 note 10 'At 31 March 2026 (404)' (= 88
# + 316). Pension: 'Retirement benefit liabilities (801)' -- the balance
# sheet presents the schemes' deficits and the UK scheme's surplus
# ('Retirement benefit assets 314') as separate captions; E35.1 takes the
# LIABILITY as presented (the RKT.L precedent), the net 487 -- stated by
# the interim's note 5 as 'Net retirement benefit liabilities (487)' at
# 30 September 2025 and (493) at 31 March 2026 -- is recorded on the
# field for the owner. Asset retirement obligation: no decommissioning or
# restoration caption on the balance sheet; note 25 Provisions is
# restructuring 101, employment-related claims 91 and 'other' 60 (local
# tax or duty 30, market exit 8, factory closure 2), none of them a
# restoration obligation -- ZERO on the caption form under E68.1, a
# tobacco manufacturer being none of E68.1's extractive/heavy classes;
# the factory-closure and market-exit provisions are named on the field
# so the owner can move them if E68 is read to reach them. E36: cash
# 1,439 / 497; 'Derivative financial instruments' current assets 45 / 53
# are hedging derivatives, not cash-like, and are NOT entered as other
# current financial assets (blank; E25 forbids a zero).
#
# E38 / E75 / E75.1 -- SHARE COUNTS. Diluted weighted average 830.6
# million for FY2025 (note 10) and 799.0 million for H1 2026 (note 9),
# entered whole. Point-in-time: issued 869,890,634 at 30 September 2025
# (note 26) with treasury shares 62.6 million (note 28, printed to 0.1m
# only) and 3.0 million in the employee trusts (note 27) -- the NET count
# is not printed, so under E80 (2026-08-30) the PAIR is entered
# (`shares_issued_period_end`, `treasury_shares_period_end` at the
# issuer's 0.1m precision) with the trusts' 3.0 million as E54's third
# leg, and the store subtracts: 804,290,634. Issued 844,313,254 at 31
# March 2026 (H1 note 6), treasury not stated in the interim, so no net
# there. The £1,450 million buyback (to 28 October 2026) keeps reducing
# the count.
#
# E23 -- CAPEX. Two lines printed ('Purchase of property, plant and
# equipment (198)', 'Purchase of intangibles (186)'), the split fields
# entered and `capex_combined` blank. 'Purchase of brands and operations
# (77)' is an acquisition line and is not capex.
#
# THE MARGIN CHECK (B46, settled by E79 2026-08-30). No statutory
# operating margin is stated in either document -- the margins printed
# are 'Tobacco & NGP adjusted operating margin' and 'adjusted operating
# margin %' (APMs). Under E79 a stated EBIT with no stated margin enters:
# operating profit 3,490 (10.8% of revenue) and 925 (6.3%; the H1 figure
# carries the £312 million Delaware settlement charge, see below) are
# entered with `op_margin` blank on both periods.
#
# DEPRECIATION AND AMORTISATION (E82): the cash flow line 'Depreciation,
# amortisation and impairment 781' / 326 carries impairment and E82
# refuses it; the annual notes decompose it only in part (amortisation
# 419, depreciation 155, impairments 6 + 100, and a right-of-use line
# 'Depreciation and impairment (101)' that is itself combined), the
# interim not at all -- DATA MISSING on both entries, the lines and the
# parts named on the field. 'Adjusted EBITDA'
# is an APM and is not entered. `net_debt_ebitda` IS entered as the
# issuer's own APM 'Adjusted net debt/EBITDA 2.0x' (AR printed p.35;
# p.23 'Adjusted net debt to EBITDA increased to 2.0x in FY25') and
# '2.4x' on a 12-month basis (H1 pp.2, 14) -- 'adjusted net debt' is the
# issuer's definition, not the tool's E35 net debt.
#
# LITIGATION PROVISIONS AND REGULATORY EXPOSURE -- reported as fields
# that exist or do not, not as a judgement (owner's instruction):
#   * The auditor's report names 'Litigations' as a KEY AUDIT MATTER (AR
#     printed pp.128, 133).
#   * QUANTIFIED, RECOGNISED: (a) Delaware / Reynolds indemnity for the
#     Florida state settlement payments on the Acquired Brands -- at 30
#     September 2025 a contingent liability only (note 30 pp.187-188:
#     judgment damages US$276m through 2024 + US$94m interest + US$50.8m
#     estimated through 2025, ~US$24.2m a year thereafter; 'the Group
#     therefore considers that no provision is required'); on 15 December
#     2025, after the Delaware Supreme Court's final ruling, 'a liability
#     to pay the counterparties £312 million (US$420 million) was
#     recognised' (H1 note 13 p.37), charged to administrative expenses,
#     US$200m paid in the half, the remaining US$234m in roughly equal
#     instalments over three years, plus up to ~US$23m a year of ongoing
#     reimbursement; the unpaid balance sits in trade and other payables
#     (£54m current, £108m non-current) and the cash flow adds back
#     'Unpaid settlement costs of historic legal cases 163'. (b)
#     Employment-related claims provision: 'An amount of £54 million (2024:
#     £64 million) has been provided for employment related claims arising
#     from a number of legacy legal disputes' (note 25 p.184); £46m at 31
#     March 2026 (H1 note 4 p.30) inside a £85m employment-claims
#     provision. (c) Tax: transfer-pricing provision £381m at 30 September
#     2025, £389m at 31 March 2026 (of which £185m the open German audit),
#     and a German CFC provision £79m (H1 note 7 p.33); uncertain tax
#     positions £387m / £392m in total.
#   * UNQUANTIFIED, NO PROVISION: Helms-Burton Title III claim in Miami
#     ('unquantified damages ... could potentially reach approximately
#     US$365 million'; dismissed April 2024, appeal heard August 2025; 'No
#     provision has been made', note 30 p.189); the Malawi supply-chain
#     claim in the English High Court (no figure, defended in full);
#     product-liability (smoking and health) actions ('will not have a
#     material adverse effect', no figure); the MSA Previously Settled
#     States Reduction dispute (up to ~US$65m a year of payment reductions
#     at stake). The Spanish CNMC fines (€11.4m Altadis, €20.9m Logista,
#     never provided, bank-guaranteed) were ANNULLED by the Spanish High
#     Court in November 2025 and the annulment is final (H1 p.37).
#   * REGULATORY EXPOSURE is a PRINCIPAL RISK, not a quantified field:
#     'Regulatory change' (AR printed p.69: flavour and ingredient
#     restrictions and nicotine caps across NGP, sub-category bans, US
#     federal menthol/flavour proposals withdrawn but liable to re-emerge,
#     state-level activity, Australia's Public Health Bill April 2025) and
#     'Pricing & excise change' (p.70: EU Tobacco Excise Directive proposal
#     of July 2025 with substantial minimum-rate increases from 2028, US
#     tariffs, illicit trade); the FDA marketing denial order on some
#     disposable vape products 'is subject to ongoing litigation
#     proceedings' (p.71); disposable vape bans in the UK and France in
#     2025 (p.72). No amount is attached to any of these anywhere in the
#     accounts.
#
# ALSO NAMED: the £1,250m buyback completed 29 October 2025 and the
# £1,450m programme to 28 October 2026 (H1 note 6); the 2030 Strategy
# Review Programme, c.£740m total cost of which c.£600m cash, provision
# 132 at 31 March 2026 (H1 note 4); the Taiwan site sale (H1 note 14).

