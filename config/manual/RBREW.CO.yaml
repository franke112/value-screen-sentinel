# config/manual/RBREW.CO.yaml -- Royal Unibrew A/S, hand-read from the
# documents the issuer filed on Nasdaq Copenhagen's disclosure feed
# (sources/manifest.json; config/nordic_issuers.yaml, "Royal UNIBREW A/S").
# Built 2026-10-19. IFRS as adopted by the EU; calendar year.
#
# DOCUMENTS:
#   1. Annual Report 2025 (audited), released 2026-02-26, 205 pp.
#      sources/RBREW.CO_2025-FY_annual-financial-report_2026-02-26_en_a0.pdf
#   2. Interim Report H1 2026 (unaudited), released 2026-08-17.
#      sources/RBREW.CO_2026-H1_half-year-financial-report_2026-08-17_en_a1.pdf
#   (The H1 2025 report is on file too. Nothing is read from it here: the
#   H1 2026 report prints the H1 2025 comparatives beside its own.)
#
# Page numbers are PDF pages, not the printed folios.
#
# REPORTING FREQUENCY: half-yearly. The Q1 and Q3 releases are trading
# statements ("Q1 2026 trading statement", 2026-04-21; "Q3 2025 trading
# statement", 2025-11-12) with no cash flow statement and no balance
# sheet. Under E31 section 5 stands on the year as filed, FY2025, and the
# report names the H1 2026 period it passes over.
#
# INTEREST. Inside operating activities, three lines: 'Received financial
# income 26', 'Paid financial expenses -268', 'Financial expenses related
# to leasing -12'. The lease interest is its OWN line and is NOT inside
# the -268. So the E34 leg is the issuer's own stated net, 'net interest
# paid of DKK 254m' (= 268 + 12 - 26), which takes ALL interest out of
# the flow once, and E117 then deducts the lease cash (principal 177 +
# interest 12) once. Entering 268 - 26 = 242 would leave the 12 in the
# flow AND deduct it again under E117.
#
# LEASES. IFRS 16, no separate caption: 'Leasing debt is included in the
# balance sheets as credit institutions' (note 18). Note 18 states the
# ex-lease and lease parts apart, and those are what is entered.
#
# DILUTED SHARE COUNT. The issuer defines diluted EPS on 'average number of
# shares in circulation including restricted shares "in-the-money"', and
# note 15 prints that count, 49,650,160. Profit 1,560 / 49,650,160 =
# 31.42, which is the printed BASIC EPS 31.4, not the printed diluted
# 31.3 (1,560 / 31.3 would imply about 49.84m). The issuer's two figures
# do not reconcile to the decimal. E134: the count on the issuer's own
# stated definition is entered. The gap is about 0.4% of the divisor.
#
# DEPOSIT ON RETURNABLE PACKAGING, 251 (note 17, inside 'Other payables').
# NOT entered as a net-debt leg. See prepaid_delivery_obligation: it is
# working capital that turns over with every crate and keg returned, and
# the packaging in circulation is an asset in PP&E. QUESTION PUT TO THE
# OWNER 2026-10-19, because E136 (customer money owed back on demand)
# comes close to it. RULED A by the owner the same day (E138): working
# capital, not net debt.

