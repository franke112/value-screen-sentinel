# config/manual/KAR.ST.yaml -- Karnov Group AB (publ), hand-read from the
# issuer's own reports as filed on the Nasdaq Stockholm disclosure feed
# (sources/manifest.json, origin nasdaq-nordic, market "Main Market,
# Stockholm", company "Karnov Group AB"). Built 2026-08-30. IFRS; calendar
# year; quarterly reporter in SEK.
#
# DOCUMENTS (each fetched and recorded by `vss nordic`):
#   Q3 2025  release 1400090 (2025-11-12), a0 = the interim report (32 pp)
#            sources/KAR.ST_2025-Q3_interim-report-q1-and-q3_2025-11-12_en_a0.pdf
#   Q4 2025  release 1419359 (2026-02-11), a0 = the year-end report (31 pp)
#            sources/KAR.ST_2025-Q4_financial-statement-release_2026-02-11_en_a0.pdf
#   FY 2025  release 1429575 (2026-03-27), a0 = Annual and Sustainability
#            Report 2025 (165 pp, audited)
#            sources/KAR.ST_2025-FY_annual-financial-report_2026-03-27_en_a0.pdf
#            and, from the Swedish release 1429577, a1 = the ESEF package
#            (549300P7312749LJS754-2025-12-31-1-sv.xbri, 22.6 MB, the tagged
#            inline-XBRL report, Swedish), sources/KAR.ST_2025-FY_annual-financial-report_2026-03-27_sv_a1.zip
#            -- ON FILE, NOT YET READ: the second reader for the annual entry.
#   Q1 2026  release 1439969 (2026-05-06), a0 = the interim report (28 pp)
#            sources/KAR.ST_2026-Q1_interim-report-q1-and-q3_2026-05-06_en_a0.pdf
#   Q2 2026  release 1459217 (2026-08-20), a1 = the half-year report (32 pp)
#            sources/KAR.ST_2026-Q2_half-year-financial-report_2026-08-20_en_a1.pdf
#   (the a1/a0 partner of each release is the two- to three-page press
#   release; recorded, not read for figures.)
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF, 100 dpi): each
# interim's income statement, balance sheet (liabilities page) and cash
# flow statement, the Q2 2026 notes 4 and 5, and the annual report's
# pp.100, 102, 104, 124, 134 and 139. The text layer carries every numeral
# intact (comma thousands, one decimal); every figure agreed. Printed page
# = PDF page in every document.
#
# STATUS: all UNVERIFIED (owner's instruction). No section 5 run, no
# fv_base, no tier, no mbp; no growth view is registered.
#
# BASIS: E19's twelve months = 2025-Q3 + 2025-Q4 + 2026-Q1 + 2026-Q2,
# ending 2026-06-30. Each report prints a STANDALONE quarter column for the
# income statement and the cash flow statement; the Q4 column is the
# year-end report's own.
#
# ONE THING TO SEE BEFORE ANY NUMBER: the 2025 DIVESTMENT GAIN. Karnov sold
# its EHS business in Q4 2025 ('Business divestments 991.1' in investing,
# AR p.104 'Gain/loss from divestment -921.0' among non-cash items).
# 'Other operating income and expenses' swung to +723.6 in Q4 2025, EBIT
# to 895.7 for the quarter and 1,123.0 for the year, the printed EBIT
# margin to 134.7% for Q4 and 42.5% for the year. `operating_income` is
# entered AS PRESENTED (E5) with the printed margin beside it; the TTM EBIT
# 88.7 + 895.7 + 94.9 + 69.6 = 1,148.9 is therefore not an operating
# measure and Method B must not be read off it without a ruling on
# one-off gains. Adjusted EBITA (the issuer's own operating APM: 172.1 /
# 172.4 / 179.8 / 153.6, TTM 677.9) is recorded in this comment for that
# ruling and entered nowhere -- the schema's `operating_income_adjusted`
# is an adjusted EBIT, not an EBITA.
#
# UNITS: MSEK (money_unit millions), one decimal as printed. share_unit
# THOUSANDS: the statements print share counts in thousands ('Weighted
# average number of ordinary shares (thousands) 108,102'); the annual
# report's note 6.3 prints whole shares, entered as exact conversions
# (108,102,047 -> 108,102.047). Per-share figures in SEK.
#
# E34 -- INTEREST. Karnov's cash flow statement runs from EBIT and shows ONE
# net line inside operating activities: 'Net financial items, paid'
# (Q2 2026 p.16: -16.6; FY2025 AR p.104: -100.8). Interest paid and interest
# received are not printed apart, so `net_interest_paid` is entered as that
# line (positive = net cost) and `finance_costs_paid` / `finance_income_received`
# are absent. THE LINE IS BROADER THAN INTEREST: note 6.7 (AR p.139) says
# financial items comprise interest, bank fees, interest on lease
# liabilities and realised FX; the net financial items paid carry all of
# that. Named here; nothing is split by hand.
#
# E70 -- LEASES IN THE FLOW. IFRS 16 filer. The principal is in FINANCING
# ('Payment of lease liabilities', e.g. -14.5 in Q2 2026, -57.2 for FY2025,
# which the financing reconciliation AR p.136 restates as the lease
# liabilities' 'Cash flow -57.2'); the interest on leases is inside net
# financial items paid, in operating (note 6.7). IFRS 16.50(b).
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS at 2026-06-30 (Q2 2026):
#   * borrowings: 'Borrowing from credit institutions' 1,775.5 non-current
#     and 104.8 current (p.14), EXCLUDING leases -- the balance sheet keeps
#     'Lease liabilities' on its own lines; note 4 (p.20) states the total
#     'Borrowing from credit institutions 1,880.3' = 1,775.5 + 104.8. 'Bank
#     overdraft' is '-' at 30 June 2026 (107.4 at 30 June 2025), named.
#   * leases: note 4 (p.20) states 'Lease liabilities 252.5' = 206.2 + 46.3
#     on the balance sheet -- a stated total (E65). One IFRS 16 liability;
#     no finance/operating split exists.
#   * pension deficit and asset retirement obligation: the interim presents
#     'Provisions 84.6' (non-current) as one aggregate. The annual report's
#     note 3.7 (p.124) splits the 31 Dec 2025 balance 91.4 into 'Asset
#     Retirement obligation 10.5', 'Pension plans 45.3', 'Jubilee and
#     long-service benefits 4.3', 'Restructuring provision 31.3'. Both legs
#     are DATA MISSING at 30 June 2026 and carried on the FY2025 annual
#     entry, which E41 reaches on the TTM basis (annual-only fields). The
#     ARO is a lessee's obligation to restore leased premises in Denmark and
#     France (note 3.7 p.123) -- entered under E68 via E69 on AUTO.L's and
#     RMV.L's dilapidations precedent (E68.1 applications table).
#   * other_current_financial_assets: no such caption; blank (E25).
#
# E36 -- SHARE-BASED COMPENSATION. The annual cash flow statement (p.104)
# adds back 'Sharebased payments 9.9' among non-cash items; note 2.3
# (p.110) puts the total LTIP expense at 10.3 (including social charges).
# 9.9 is entered on the annual entry as the equity-settled IFRS 2 charge
# (performance-share LTIPs 2023-2025 settled in shares of series C
# converted to ordinary shares). Not stated quarterly.
#
# E38 / E75 / E75.1 -- DIVISOR. Each quarter states its own diluted
# weighted average (thousands); the FY2025 annual entry carries 108,102.047
# (note 6.3 p.134). THE WINDOW-END COUNT AT 30 JUNE 2026 IS DATA MISSING:
# the interim (p.9) states the ISSUED count -- 99,683,846 shares in total,
# 99,536,458 ordinary and 147,388 of series C, after 8,418,201 repurchased
# ordinary shares were cancelled in May 2026 -- and says the company
# 'controlled 3.3% of the shares' at 30 June 2026, a percentage, not a
# treasury count. E16 has one half of the pair, so the net count cannot be
# formed; E75 therefore falls to E41's annual average 108,102 thousand,
# which is 8.4 million shares (7.8%) ABOVE the issued count after the
# cancellation and further above the net of treasury. A material
# overstatement of the divisor that a stated treasury count would cure --
# reported in the missing-items table as a filing gap.
#
# E23 -- CAPEX. Two lines printed, 'Acquisition of intangible assets' and
# 'Acquisition of property, plant and equipment' (capitalised tech
# development is the larger), so the split fields are entered and
# `capex_combined` stays blank. 'Sale of property, plant and equipment
# 18.8' (Q3 2025) is not netted by the issuer's own free cash flow
# (note 5 p.23: OCF less acquisitions less lease payments), so
# `proceeds_from_disposals_ppe` is not entered.
#
# EBITDA. Karnov prints no EBITDA for a quarter or a year; its leverage
# APM uses 'Adjusted Proforma EBITDA LTM' (note 5 p.23: 863.1 at 30 June
# 2026) and the covenant (AR p.135) a facility-agreement EBITDA. `ebitda`
# is absent; the STATED 'Leverage ratio 2.0' (net debt 1,697.4 / LTM
# adjusted proforma EBITDA 863.1, net debt EXCLUDING leases) is entered as
# `net_debt_ebitda` with its definition named -- not E35's net debt.
#
# NOT PRESENTED: gross profit (the statement runs revenue less cost of goods
# sold, employee benefits, D&A and other -- no gross-profit subtotal);
# quarterly share-based payments; quarterly interest paid/received apart;
# a period-end treasury count (see E75 above).

