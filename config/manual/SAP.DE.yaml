# SAP.DE -- fundamentals from the filer's own tagged facts.
#
# GENERATED by `vss xbrl --annual --write` on 2026-08-26T08:27:52+02:00 from
#     https://data.sec.gov/api/xbrl/companyfacts/CIK0001000184.json
# through the `ifrs-full` tag map in `vss/xbrl.py`. No model read
# this. Nothing was quoted, summarised, inferred, summed, netted or
# rescaled. A tag the filer does not use is DATA MISSING and is named
# in the run's report, never filled from a near neighbour.
#
# ANNUAL, NOT QUARTERLY, and that is the point of this file. Filers
# stopped tagging discrete fourth quarters when the SEC dropped the
# Selected Quarterly Financial Data requirement in 2021, so the newest
# COMPLETE tagged quarter can lag the newest filing by months. These
# are `annual:` entries (E15), keyed on the fiscal year, and E19's
# `as filed` branch is what puts section 5 on the newest of them.
#
# CURRENCY: EUR, MEASURED from the filer's own facts rather
# than assumed -- the census counts every tagged fact carrying a
# three-letter currency code and takes the commonest. It is not the
# only one present for every filer: SAP's facts carry USD
# convenience translations from a 2018 20-F beside its EUR.
#
# UNITS: WHOLE UNITS, as XBRL states them -- 46,309,000,000 where a
# press release for the same year says 46,309 million. Both are the
# figure the source states and neither is rescaled here. DO NOT ADD A
# PERIOD FROM A RELEASE TO THIS FILE: a history holding both units is
# a history in which no comparison means anything, and the writer
# refuses to overwrite a file of any other origin for that reason.
#
# SIGN: the `Payments...` elements state an OUTFLOW AS A POSITIVE
# NUMBER and this schema states an outflow as a negative one, because
# section 5 SUMS the capex legs into operating cash flow. The sign is
# flipped on those fields and nothing else is done to the magnitude.
#
# EVERY FIGURE IS VERIFIED / tagged (E40): a tagged fact is
# verified BY PROVENANCE -- tag + accession + filing date, on every
# figure's own page line. There is no transcription to have got
# wrong; WHICH TAG answers which field is the committed map in
# `vss/xbrl.py`, diffable and argued with there. The gate accepts
# the kind (E21 as narrowed by E40) and prints it beside the figure.

ticker: SAP.DE
name: "SAP SE"
reporting_currency: EUR
money_unit: whole     # as XBRL states them; the run record normalises on this declaration
share_unit: whole     # counts are tagged as whole shares
quote_currency: EUR   # from the watchlist entry, not from the facts: a listing currency is not a tagged fact

# E34: where this filer books its interest, for the BASIS YEAR
# (FY2025). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
# THIS FILER IS ON BOTH SIDES INSIDE THIS FILE -- at least one older
# year is classified the other way. A reclassification, not an error.
interest_in_ocf:
  value: no
  source: "SEC XBRL companyfacts for CIK 0001000184 (SAP SE) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0001000184.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ifrs-full:InterestPaidClassifiedAsFinancingActivities [2025-01-01..2025-12-31] 20-F 0001104659-26-020058"
origin: sec-xbrl

# E41 (2026-08-26): FOUR QUARTERS FROM THE ISSUER'S OWN QUARTERLY STATEMENTS,
# so that section 5 stands on the R12M to 2026-06-30 and not on FY2025. The
# 20-F above fills only the ANNUAL-ONLY fields (share count, share-based
# compensation, interest classification, pension). Entered by the Build 2
# session on 2026-08-26 from pdftotext extractions of the four PDFs in
# sources/, NOT read back by the owner: `verified_kind: cross_document` where
# a second document or the 20-F tag states the same figure, `same_page`
# where only a second extraction of the same page does.
#
# UNITS: WHOLE EUR, this file's one unit. The statements print "€ millions"
# and every page line below quotes the printed figure so the conversion is
# on the page, not hidden: 3,153 (€ millions) is entered as 3153000000.
#
# WHAT IS NOT ENTERED, and why (E41 names both):
#   * capex. SAP prints "Purchase of intangible assets and property, plant,
#     and equipment" CUMULATIVELY (Q1, Q1-Q2, Q1-Q3, Q1-Q4) and never as a
#     standalone quarter. A quarter would be one cumulative column minus
#     another, which no rule licenses in the store. DATA MISSING here; the
#     re-strike record carries the R12M 735 as a HAND input naming all four
#     columns (FY2025 -739 [Q4 p.19]; Q1-Q3 2025 -559 [Q3 p.18]; Q1-Q2 2025
#     -358 and Q1-Q2 2026 -354 [Q2 2026 p.15]; Q1 2026 -238 [Q1 p.12]).
#   * financial_liabilities_current / _noncurrent / lease_liabilities. The
#     interim balance sheet presents ONE `Financial liabilities` line per
#     side (1,966 / 8,541 at 2026-06-30, Q2 p.10), leases and derivatives
#     inside, and no note splits it. Under E14 all three stay DATA MISSING.
#     The re-strike takes the consolidated line as a HAND input (E35 needs
#     only the sum) and the bridge note says so.
#   * free_cash_flow_reported is SAP's OWN non-IFRS measure (OCF - capex +
#     disposal proceeds - lease payments); a memo, never FCF0.
#
# E35.1 (2026-08-26): `pension_deficit` was added to the annual entries by
# hand, line for line as `vss xbrl --annual` emits it (run into a scratch
# directory and copied), so the tagged block stays what the writer would
# write: ifrs-full:RecognisedLiabilitiesDefinedBenefitPlan, 249,000,000
# at 2025-12-31. The 19,000,000 of RecognisedAssetsDefinedBenefitPlan is
# NOT netted (no field; omitting an asset is the safe direction).
#
# `vss xbrl --annual --write` WILL REFUSE to overwrite this file without
# --force, because these flags are readings (E40) -- and --force would drop
# this block. Re-add it from git history if the annual block is regenerated.
reporting_frequency: quarterly

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# lease principal. Under IFRS 16 it does not, so nothing is added back: the
# lease is counted once, in net debt (E35, E65); `lease_payments_capital`,
# where entered, is a memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities, so this filer's `operating_cash_flow` never bore the principal; the interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records. The standard leaves no choice on the principal"

