        page: "Item 8, Consolidated Statements of Income, year ended December 31, 2025, 10-K 0000906163-26-000018 filed 2026-02-11 (in thousands): 'Income before taxes | 1,761,932'. READ FOR E126 STEP 2 AND NOTHING ELSE. WHY THE NUMERATOR IS RECONSTRUCTED AT ALL: this filer states NO subtotal before financing cost. Its statement is segmented -- Homebuilding runs revenues 10,094,269, other income 96,260, cost of sales (7,953,401), SG&A (599,667) and 'Interest expense (27,578)' to 'Homebuilding income 1,609,883'; Mortgage Banking runs fees, interest income and G&A through its own 'Interest expense (1,257)' to 'Mortgage banking income 152,049' -- and the two meet at this line. E126 step 1 therefore has nothing to read. WHY E126'S PROHIBITION DOES NOT REACH THE OPERAND BESIDE THIS ONE: E126 forbids building a numerator from SEGMENT SUBTOTALS summed across segments, and 'Homebuilding income' and 'Mortgage banking income' are exactly that -- they are NOT used here and must not be. What `finance_costs_period` holds is the two segments' own INTEREST EXPENSE CHARGES, 27,578 + 1,257 = 28,835, which are the income statement's printed charge for the period and not subtotals of anything; they were entered under E71 on the issuer's own evidence that they are one quantity. So the numerator is this pre-tax line plus that charge, which is what E126 step 2 names and all that it names."
