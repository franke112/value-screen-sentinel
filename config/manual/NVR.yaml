# E34: where this filer books its interest, for the BASIS YEAR
# (FY2025). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0000906163 (NVR, Inc.) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0000906163.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E34.1 via E18 and E71, APPLIED BY HAND 2026-08-30 (see the header):
  # the income statement's pair is stated in SEGMENT captions the issuer
  # never totals; E71 adds them (expense 27,578 + 1,257; income 84,158 +
  # 17,886) and the store subtracts a net INCOME of 73,209 thousand,
  # which E34's add-back removes from FCF0. Printed as 'accrual proxy'.
