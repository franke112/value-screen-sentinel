# DECK -- fundamentals from the filer's own tagged facts.
#
# GENERATED by `vss xbrl --annual --write` on 2026-08-26T08:27:54+02:00 from
#     https://data.sec.gov/api/xbrl/companyfacts/CIK0000910521.json
# through the `us-gaap` tag map in `vss/xbrl.py`. No model read
# this. Nothing was quoted, summarised, inferred, summed, netted or
# rescaled. A tag the filer does not use is DATA MISSING and is named
# in the run's report, never filled from a near neighbour.
#
# ANNUAL, NOT QUARTERLY, and that is the point of this file. Filers
# stopped tagging discrete fourth quarters when the SEC dropped the
# Selected Quarterly Financial Data requirement in 2021, so the newest
# COMPLETE tagged quarter can lag the newest filing by months. These
# are `annual:` entries (E15), keyed on the fiscal year, and E19's
# `as filed` branch is what puts section 5 on the newest of them.
#
# CURRENCY: USD, MEASURED from the filer's own facts rather
# than assumed -- the census counts every tagged fact carrying a
# three-letter currency code and takes the commonest. It is not the
# only one present for every filer: SAP's facts carry USD
# convenience translations from a 2018 20-F beside its EUR.
#
# UNITS: WHOLE UNITS, as XBRL states them -- 46,309,000,000 where a
# press release for the same year says 46,309 million. Both are the
# figure the source states and neither is rescaled here. DO NOT ADD A
# PERIOD FROM A RELEASE TO THIS FILE: a history holding both units is
# a history in which no comparison means anything, and the writer
# refuses to overwrite a file of any other origin for that reason.
#
# SIGN: the `Payments...` elements state an OUTFLOW AS A POSITIVE
# NUMBER and this schema states an outflow as a negative one, because
# section 5 SUMS the capex legs into operating cash flow. The sign is
# flipped on those fields and nothing else is done to the magnitude.
#
# EVERY FIGURE IS VERIFIED / tagged (E40): a tagged fact is
# verified BY PROVENANCE -- tag + accession + filing date, on every
# figure's own page line. There is no transcription to have got
# wrong; WHICH TAG answers which field is the committed map in
# `vss/xbrl.py`, diffable and argued with there. The gate accepts
# the kind (E21 as narrowed by E40) and prints it beside the figure.

ticker: DECK
name: "Deckers Brands"
reporting_currency: USD
money_unit: whole     # as XBRL states them; the run record normalises on this declaration
share_unit: whole     # counts are tagged as whole shares
quote_currency: USD   # from the watchlist entry, not from the facts: a listing currency is not a tagged fact

# E34: where this filer books its interest, for the BASIS YEAR
# (FY2026). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0000910521 (Deckers Brands) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0000910521.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E34.1: this filer states interest PAID as a cash figure and
  # never interest RECEIVED, so E18's cash pair cannot form. The
  # add-back is the INCOME STATEMENT'S net (`net_finance_costs`),
  # an ACCRUAL PROXY, and FCF0 prints it as one. Interest paid
  # alone is never the net.
  interest_source: income_statement_net
origin: sec-xbrl

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# operating lease payments. Under ASC 842 it does, so FCF0 ADDS the stated
# cash paid (`operating_lease_payments`) back: the lease liability in net
# debt already charges the obligation, and the lease is counted once.
operating_leases_in_ocf:
  value: yes
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to a us-gaap filer"
  page: "ASC 842-20-45-5(a): a lessee classifies payments for operating leases within OPERATING activities, so this filer's `operating_cash_flow` already bears them; the stated cash paid is `us-gaap:OperatingLeasePayments` ('cash paid for amounts included in the measurement of operating lease liabilities'), written as `operating_lease_payments` where tagged. No filer-specific tag states the classification because the standard leaves no choice"

