# EXE -- fundamentals from the filer's own tagged facts.
#
# GENERATED by `vss xbrl --annual --write` on 2026-08-29T23:22:47+02:00 from
#     https://data.sec.gov/api/xbrl/companyfacts/CIK0000895126.json
# through the `us-gaap` tag map in `vss/xbrl.py`. No model read
# this. Nothing was quoted, summarised, inferred, summed, netted or
# rescaled. A tag the filer does not use is DATA MISSING and is named
# in the run's report, never filled from a near neighbour.
#
# ANNUAL, NOT QUARTERLY, and that is the point of this file. Filers
# stopped tagging discrete fourth quarters when the SEC dropped the
# Selected Quarterly Financial Data requirement in 2021, so the newest
# COMPLETE tagged quarter can lag the newest filing by months. These
# are `annual:` entries (E15), keyed on the fiscal year, and E19's
# `as filed` branch is what puts section 5 on the newest of them.
#
# CURRENCY: USD, MEASURED from the filer's own facts rather
# than assumed -- the census counts every tagged fact carrying a
# three-letter currency code and takes the commonest. It is not the
# only one present for every filer: SAP's facts carry USD
# convenience translations from a 2018 20-F beside its EUR.
#
# UNITS: WHOLE UNITS, as XBRL states them -- 46,309,000,000 where a
# press release for the same year says 46,309 million. Both are the
# figure the source states and neither is rescaled here. DO NOT ADD A
# PERIOD FROM A RELEASE TO THIS FILE: a history holding both units is
# a history in which no comparison means anything, and the writer
# refuses to overwrite a file of any other origin for that reason.
#
# SIGN: the `Payments...` elements state an OUTFLOW AS A POSITIVE
# NUMBER and this schema states an outflow as a negative one, because
# section 5 SUMS the capex legs into operating cash flow. The sign is
# flipped on those fields and nothing else is done to the magnitude.
#
# RE-CHECKED 2026-08-30 against a fresh `vss xbrl --annual` run (written to
# a scratch directory and diffed): NO FIGURE MOVED since 2026-08-29 -- the
# facts on data.sec.gov are the same 10-K 0000895126-26-000011 (filed
# 2026-02-18) and 10-Q 0000895126-26-000047 (filed 2026-07-28); the diff was
# the issuer's display name and block order only. The FY2025 10-K was then
# READ (primary document exe-20251231.htm) for the rulings the tags cannot
# answer, and ONE THING WAS ADDED BY HAND, `same_page`, named here so that
# `--force` (which discards it) is a decision and not an accident:
#   1. `pension_deficit` 0 on E25's `note` form, FY2025: Note 12, Employee
#      Benefit Plans, describes ONE plan, a 401(k) profit sharing plan,
#      and 'defined benefit' appears nowhere in the filing. The bridge's
#      last missing leg; net debt now forms.
# THE E61.1 READ, RECORDED (the tool fired E61 on the tag; the ruling asks
# that the filing be read before the proxy stands): the Consolidated
# Statements of Operations print 'Interest expense | (235)' and 'Other
# income, net | 42' under 'Other income (expense)'; 'interest income'
# appears NOWHERE in the 10-K in any form, and 'Other income, net' is a
# composite the filing does not decompose. So the add-back is the stated
# expense alone, `interest_source: interest_expense_only`, and the bound
# is 235 / FCF0 2,060 = 11.4% -- the most the unrecorded interest income
# on 616m of cash could overstate FCF0 by. Item 7 states the expense's
# composition: 'Interest expense on debt 295; Amortization of premium,
# discount, issuance costs and other 4; Capitalized interest (64); Total
# interest expense 235' -- the add-back is the NET of capitalised interest,
# as printed.
# E68 / E68.1 as read: the balance sheet presents 'Asset retirement
# obligations, net of current portion | 688' and the total 724 is tagged
# (E68's stated total, current 36 inside 'Other current liabilities'); the
# leases note states 'As of December 31, 2025 and 2024, we did not have any
# finance leases', so E65 adds nothing and E67 has no combined caption to
# read ('Long-term debt, net | 5,009' is borrowings alone; 'Current
# maturities of long-term debt, net | —' is the tool's caption zero).
#
# EVERY FIGURE IS VERIFIED / tagged (E40): a tagged fact is
# verified BY PROVENANCE -- tag + accession + filing date, on every
# figure's own page line. There is no transcription to have got
# wrong; WHICH TAG answers which field is the committed map in
# `vss/xbrl.py`, diffable and argued with there. The gate accepts
# the kind (E21 as narrowed by E40) and prints it beside the figure.

