# SEC Central Index Key, written 2026-09-04 on the owner's ruling: a
# CIK identifies the COMPANY, not the watching of it, so the store is
# where it belongs -- and a ticker lookup at runtime can match the
# wrong company on a re-used or dual-listed symbol and fetch the wrong
# document with nothing to catch it. A CIK written in the file is a
# fact that can be seen; a lookup is an assumption made fresh each run.
# Source: https://www.sec.gov/files/company_tickers.json, fetched
# 2026-09-04 with VSS_SEC_CONTACT declared -- {cik_str: 895126, ticker: EXE, title: EXPAND ENERGY Corp}.
cik: 895126
name: "EXPAND ENERGY Corp"
reporting_currency: USD
money_unit: whole     # as XBRL states them; the run record normalises on this declaration
share_unit: whole     # counts are tagged as whole shares
quote_currency: USD   # from the watchlist entry, not from the facts: a listing currency is not a tagged fact

# E34: where this filer books its interest, for the BASIS YEAR
# (FY2025). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0000895126 (EXPAND ENERGY Corp) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0000895126.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E61: this filer tags GROSS interest expense
  # (`finance_costs_period`) but never the net and never an
  # interest-received figure, so neither E34's cash pair nor
  # E34.1's accrual net can form. The add-back is the gross
  # expense alone -- a BOUNDED, ONE-SIDED PROXY: interest income
  # is never negative, so this can only OVERSTATE FCF0, never
  # understate it, and FCF0 prints the bound as a percentage.
  # E61.1 READ, 2026-08-30 (see the header): the 10-K states NO interest
  # income anywhere -- 'Other income, net | 42' is a composite -- so the
  # gross-only proxy stands after the read, not merely on the tag. Bound
  # 235 / 2,060 = 11.4% of FCF0.
  interest_source: interest_expense_only
origin: sec-xbrl

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# operating lease payments. Under ASC 842 it does, so FCF0 ADDS the stated
# cash paid (`operating_lease_payments`) back: the lease liability in net
# debt already charges the obligation, and the lease is counted once.
operating_leases_in_ocf:
  value: yes
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to a us-gaap filer"
  page: "ASC 842-20-45-5(a): a lessee classifies payments for operating leases within OPERATING activities, so this filer's `operating_cash_flow` already bears them; the stated cash paid is `us-gaap:OperatingLeasePayments` ('cash paid for amounts included in the measurement of operating lease liabilities'), written as `operating_lease_payments` where tagged. No filer-specific tag states the classification because the standard leaves no choice"

