# E34 (filled 2026-08-26, Build 2 item 7): Pandora books interest INSIDE
# operating cash flow -- POST-interest. Read from the annual report's cash
# flow statement, where both lines sit above the operating subtotal.
# p.106 of the same report: from 2027 (IFRS 18) interest paid will be
# presented in the financing category, so this attribute flips to `no`
# across one year boundary inside this file.
interest_in_ocf:
  value: yes
  source: "Annual Report 2025 (audited)"
  page: "p.103, consolidated statement of cash flows: 'Finance income received 4.6 174' and 'Finance costs paid 4.6 -1,009' both ABOVE 'Cash flows from operating activities, net 7,361'; Pandora's own free-cash-flow reconciliation on the same page strips them back out"

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# lease principal. Under IFRS 16 it does not, so nothing is added back: the
# lease is counted once, in net debt (E35, E65); `lease_payments_capital`,
# where entered, is a memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities, so this filer's `operating_cash_flow` never bore the principal; the interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records. The standard leaves no choice on the principal"

