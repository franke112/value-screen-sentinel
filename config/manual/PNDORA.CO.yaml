      # exists, no minority stands in the equity, and the H1 2026 report
      # carries no occurrence of any of the five terms at all.
      nci_dividends_paid:
        value: 0
        zero_basis: searched
        source: "E105 leg; E107 searched absence"
        page: "E107 SEARCHED ABSENCE. Documents: sources/PNDORA.CO_2026-Q2_inside-information_2026-08-12_en_a1.pdf (Pandora A/S interim report H1 2026, 2026-08-12; 100,216 characters) -- ZERO occurrences of 'non-controlling', 'noncontrolling', 'non controlling', 'minority interest' or 'minority interests'; and sources/PNDORA.CO_2025-FY_annual-financial-report_2026-02-04_en_a1.pdf (Annual Report 2025; 490,717 characters) -- TWO occurrences of 'non-controlling', both searched 2026-09-04 and neither a holding: the IFRS 3 policy sentence ('the amount of any non-controlling interests in the acquiree') and Pandora's own net-debt definition, which lists 'other liabilities relating to obligations to acquire non-controlling interests' as a category. A definition of what would be included is not a statement that anything is. The consolidated statement of changes in equity carries no non-controlling column (E106 clause 5: a determined zero)."
        status: UNVERIFIED
      # E81 (2026-09-04): THE ISSUER SPLITS IT FOR US, which is the whole
      # difficulty on this leg elsewhere. Pandora's interim balance sheet
      # prints `Refund liabilities` and `Contract liabilities` as SEPARATE
      # current captions, so no judgement and no summing is needed: the
      # 571 of refund and warranty provision is NOT money received against
      # a future delivery (E81's second application, EXE 2026-08-30) and is
      # not this leg; the 225 of contract liabilities IS.
      #
      # The FY2025 note 3.8 shows what is inside the caption at the year
      # end -- prepayments from customers 54, coupons and gift cards 136,
      # loyalty programme 82 -- every one of them cash taken against
      # product still to be handed over.
      prepaid_delivery_obligation:
        value: 225
        source: "E81 leg, entered 2026-09-04 from the issuer's own interim balance sheet"
        page: "sources/PNDORA.CO_2026-Q2_inside-information_2026-08-12_en_a1.pdf (Pandora A/S interim report H1 2026, company announcement published 2026-08-12), consolidated balance sheet, the 30 June 2026 column: 'Contract liabilities 225 221 271' (DKK million; 30 June 2026 / 30 June 2025 / 31 December 2025), printed as its own current caption BENEATH 'Refund liabilities 571 565 793' -- the two are separate lines and only the first is E81's concept. FY2025 annual report note 3.8 (p.127) itemises the caption at the year end: prepayments from customers 54, coupons/gift cards etc. 136, loyalty programme 82, against refund and warranty liability 793 shown apart."
        status: VERIFIED        # read back 2026-09-19: p.30, "Contract liabilities 225" (30 June 2026 column)
        verified_kind: same_page
      # E106 clause 3 (2026-09-04): the pension is BOUNDED, not absent.
      # Pandora recognises defined-benefit obligations for its Thai
      # employees and does NOT present them separately on the interim
      # balance sheet -- they sit inside `Provisions`. E35.1 wants the
      # recognised net liability at the WINDOW END and no such figure is
      # stated, so the leg is DATA MISSING; total provisions are a strict
      # CEILING on any component of them, and the sum of the two stated
      # provision captions is a LOOSENING operation (E106, applied
      # 2026-09-04), so it may be formed.
      #
      # DIRECTION `reduces`: a pension deficit ADDS to net debt, so the
      # record struck with the leg at zero is the HIGH case and the truth
      # can only be lower.
      #
      # MEASURED 2026-09-04 AND IT DOES NOT CLEAR: 556 moves fv_base by
      # 9.27%, past E106's 3.5%, so PANDORA REFUSES. That is clause 2, and
      # the refusal is now informative where before it only said "absent":
      # the leg is worth at most 9.27% of the answer. Pandora is levered
      # (net debt 15,868 against FCF0 7,041) and E108's own arithmetic says
      # why a stock leg bites so hard here -- with net cash negative the
      # factor D/(D + net_cash/FCF0) EXCEEDS one.
      #
      # WHAT WAS CONSIDERED AND DECLINED. The issuer's own 187 would give
      # about 3.1% and would clear. It is NOT used, because it is measured
      # at 2025-12-31 and this basis ends 2026-06-30: E19/E20 take a STOCK
      # AT THE WINDOW END, and E41's annual-only fill is for a figure the
      # filer states once a year and section 5 then reads on the window --
      # stretching it to a balance-sheet liability measured six months
      # early would put a stale stock in the bridge, which is the thing E19
      # exists to prevent. Refusing on a measured 9.27% is better than
      # valuing on a six-month-old actuarial figure.
      #
      # WHAT CLOSES IT: one number -- Pandora's recognised defined-benefit
      # obligation at 30 June 2026.
      pension_deficit:
        bound: 556
        bound_direction: reduces
        source: "E106 clause 3 bound, from the issuer's own interim balance sheet"
        page: "sources/PNDORA.CO_2026-Q2_inside-information_2026-08-12_en_a1.pdf (Pandora A/S interim report H1 2026, company announcement published 2026-08-12), consolidated balance sheet, the 30 June 2026 column: non-current 'Provisions 520 541 558' plus current 'Provisions 36 41 33' = 556 DKK million at 30 June 2026, a CEILING on any component of them and therefore on the recognised defined-benefit obligation. WHAT THE OBLIGATION ACTUALLY IS, from the FY2025 annual report note 2.2 (staff costs): 'The Group's pension plans are primarily defined contribution plans. Pandora has defined benefit plans relating to employees in Thailand. The defined benefit plans are recognised at the present value of the actuarially measured obligations. In 2025, these obligations amounted to DKK 187 MILLION (2024: DKK 145 million).' 187 is the year-end figure and the basis ends 2026-06-30, so it is not the window-end value and is not entered as one -- but it says the bound of 556 is loose by roughly a factor of three."
        status: UNVERIFIED
      # E110 sweep (2026-09-04): a searched zero. The concept is absent
      # from the accounts, which is a different finding from the two legs
      # this sweep did NOT clear -- Pandora's defined-benefit plans and its
      # contract liabilities are both real and both stated, and neither is
      # an immateriality sentence.
      asset_retirement_obligation:
        value: 0
        zero_basis: searched
        source: "E110 sweep 2026-09-04; E25 named zero on an E107 search"
        page: "E107 SEARCHED ABSENCE. Document: sources/PNDORA.CO_2025-FY_annual-financial-report_2026-02-04_en_a1.pdf (Pandora A/S Annual Report 2025, published 2026-02-04; 490,717 characters of extracted text). Searched 2026-09-04 for 'asset retirement', 'decommission', 'dismantl', 'make good' -- ZERO occurrences of any of them; 'restoration' appears once and is not a liability caption. No such provision stands on the balance sheet."
        status: UNVERIFIED
      net_debt_reported:
        value: 15643
        source: "E103 automatic reference extraction (pdf (model-read))"
        page: "5 [printed in millions] -- verbatim: Net interest-bearing debt (NIBD) 15,643"
        status: UNVERIFIED
      # VERIFIED 2026-08-25 -- the figures below marked VERIFIED were read
