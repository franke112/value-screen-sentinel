# config/manual/RKT.L.yaml -- Reckitt Benckiser Group plc, hand-read from the
# documents the issuer filed with the FCA's National Storage Mechanism
# (sources/manifest.json, origin `fca-nsm`, LEI 5493003JFSMOJG48V108).
# Built 2026-08-30. UK-adopted IFRS; calendar year; half-yearly reporter.
#
# DOCUMENTS:
#   1. "Annual Report and Accounts 2025" -- NSM disclosure NI-000141601, Direct
#      Upload PDF, published 2026-03-25, 216 pp, audited (the NSM holds an
#      identical second upload, NI-000141608, same bytes).
#      sources/RKT.L_2025-FY_annual-financial-report_2026-03-25_xx_a0.pdf
#      The ESEF/iXBRL package NI-000141611 is on file beside it (.zip).
#      UPDATED 2026-08-30: the inline-XBRL report inside it
#      (reports/5493003JFSMOJG48V108-2025-12-31-T01.xhtml, 456
#      ix:nonFraction facts; units GBP and GBP/shares only, no xbrli:shares
#      unit, so no share count is tagged) was read and compared field by
#      field against the 2025-FY entries (E40; the AUTO.L ESEF precedent,
#      E58). EIGHTEEN fields agree exactly with a tagged fact and carry
#      `verified_kind: cross_document` citing tag and context inline; three
#      of them (income_tax_paid, capex_ppe, capex_intangibles) agree on
#      magnitude with the sign reconciled by CONVENTION (iXBRL tags an
#      outflow concept as a positive magnitude, this file signs outflows
#      negative) -- not a discrepancy. No tagged fact DIFFERS from an
#      entered figure. TEN fields have no tag and were settled under E59,
#      each citing its reconciling note inline: the ex-lease borrowings
#      (note 17's parts + note 19's lease split = the tagged inclusive
#      captions 810 and 7,620, exactly) and the lease total (the same two
#      equations); depreciation_amortisation (notes 9 and 10's four parts
#      sum to the tagged combined line 756); the diluted average (profit /
#      diluted EPS to rounding, the AUTO.L shape); shares_outstanding (note
#      20's issued and treasury roll-forwards reproduce the Directors'
#      Report count); op_margin (ratio of tagged figures at the printed
#      tenth, E79); net_debt_ebitda (the AR's own APM table: 6,558 / 3,979);
#      and the two caption zeros (the tagged provision and liability
#      captions sum exactly to the tagged totals). 2026-H1 is outside the
#      package and stays UNVERIFIED.
#   2. "Results for the Six Months Ended 30 June 2026" -- NSM disclosure
#      NI-000149357, Direct Upload PDF, published 2026-07-29, 41 pp, the
#      half-year condensed statements (unaudited). The NSM's RNS record of
#      the same date (7e79db1d-...) is a three-paragraph notice pointing to
#      this PDF -- recorded, not read.
#      sources/RKT.L_2026-H1_half-year-financial-report_2026-07-29_xx_a0.pdf
#   3. "Results For The Year Ended 31 December 2025" -- NI-000140120, PDF,
#      2026-03-05, the full-year results announcement; on file, not read.
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF, 100 dpi): AR
# printed pp.133, 134, 136 (the statements; printed page = PDF page - 2),
# 147, 149, 164, 165, 166, 174 (notes 6, 8, 16-19, 25); H1 PDF pp.18, 20,
# 22, 25, 26. THE TEXT LAYER IS INTACT: every numeral came out whole
# ('14,205', '4,217', '681,142,714') -- the AUTO.L spacing defect does not
# occur in either document -- and every figure agreed between the readings.
#
# STATUS: 2025-FY VERIFIED / cross_document throughout after the ESEF and
# E59 pass of 2026-08-30; 2026-H1 all UNVERIFIED. No section 5 run, no
# fv_base, no tier, no mbp; no growth view is registered.
#
# PERIODS HELD: 2025-FY and 2026-H1 (the overlap guard never holds 2025-H1
# beside 2025-FY). Under E31 section 5 stands on the year as filed and
# names 2026-H1 as the newer filed period. The interim's H1 2025
# comparatives, for the record: net revenue 6,981; operating profit
# 1,498; net cash from operating activities 812; PPE (158); intangibles
# (41); share-based payments 50; profit 960 (all GBP m).
#
# UNITS: GBP MILLION (money_unit millions), whole -- every statement is
# headed '£m'. share_unit WHOLE (note 8 prints 681,142,714; the interim
# prints its averages in millions and its issued count whole). Per-share
# figures in PENCE; the quote is GBX.
#
# THE YEAR HAS A DISPOSAL IN IT: Essential Home was sold in 2025 ('Gain on
# disposal 1,245' inside operating profit, 'Proceeds from the sale of
# intangible assets and related businesses 1,786' in investing; the AR's
# own words: 'IFRS operating margin and EPS are impacted mainly by the
# completion of the Essential Home disposal, an intangible asset
# impairment charge and restructuring costs', p.1). `operating_income`
# is entered as presented (E5) with the issuer's own IFRS margin beside
# it; 'Adjusted operating profit' is the issuer's APM and is not entered.
# In February 2026 a £1,578 million special dividend was paid with a
# 24-for-25 share consolidation (H1 note 7, 9).
#
# E23 -- CAPEX. Two lines printed ('Purchase of property, plant and
# equipment (536)', 'Purchase of intangible assets (79)'); the split
# fields are entered, `capex_combined` blank.
#
# E34 -- INTEREST. BOTH sides INSIDE operating activities: the cash flow
# statement runs 'Cash generated from continuing operations 3,501',
# 'Interest paid (344)', 'Interest received 41', 'Tax paid (897)', then
# 'Net cash generated from operating activities 2,297' (p.136); the
# interim the same ('Interest paid (152)', 'Interest received 48', p.22).
# `interest_in_ocf: yes`, both halves entered.
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS at 2026-06-30 (H1 note 8, p.26):
#   * borrowings: the balance sheet's 'Short-term borrowings (2,695)' and
#     'Long-term borrowings (7,468)' INCLUDE lease liabilities (73 and 223).
#     Note 8 lists the components, so E14's ex-lease borrowing fields are
#     the stated parts added (E71: the issuer presents them as one
#     'Total short-term borrowings' / 'Total long-term borrowings'):
#     current = bank loans and overdrafts 15 + commercial paper 723 + bonds
#     1,884 = 2,622; non-current = bonds 6,243 + senior notes 399 + other
#     non-current borrowings 603 = 7,245. At 31 December 2025 the annual
#     note 17 (p.165) also prints the ex-lease total outright: 'Gross
#     borrowings (unsecured) 8,156' = 745 current + 7,411 non-current.
#   * leases: H1 note 8 'Lease liabilities 73' + '223' = 296 (E71; no
#     total printed in the interim); AR note 19 (p.166) states the total
#     'Lease liabilities included in the Statement of Financial Position
#     at 31 December 274' (current 65, non-current 209) (E65).
#   * pension: 'Retirement benefit obligations (220)' as presented (AR:
#     217); the separately presented 'Retirement benefit surplus 286' (AR:
#     284) is NOT netted (E35.1, schema).
#   * asset retirement obligation: ZERO on the caption form -- AR note 18
#     (p.165) analyses 'Provisions for liabilities and charges' into 'Legal
#     provisions 108' and 'Other provisions 37' only; no decommissioning,
#     restoration or dilapidations provision exists in a consumer-health
#     and hygiene group, and the balance sheet presents none. E68.1.
#   * other_current_financial_assets: none -- money market fund
#     investments (987 at year end) sit INSIDE cash and cash equivalents
#     (note 16, p.164); blank (E25).
#
# E36 -- SHARE-BASED COMPENSATION. 'Share-based payments 101' in the
# cash flow statement (p.136), which note 25 (p.174) states: 'All awards
# under these plans are equity settled. The total expense recognised in
# respect of share-based payments for the year was £101 million.' H1
# 2026: 41 (p.22).
#
# E38 / E75 / E75.1 -- DIVISOR. FY2025 diluted weighted average
# 681,142,714 (note 8, p.149). At 30 June 2026 the interim states issued
# 674,005,752 and treasury 38,950,759 (note 9, p.26), so E16 forms the net
# count 635,054,993 -- E75's window-end divisor on any TTM basis, basic
# (E75.1: no diluted count at a date). The H1 diluted average (648.2
# million) is a six-month figure. Shares held by the employee share
# ownership trust are not counted at the period end in the interim.
#
# E70 -- LEASES IN THE FLOW. IFRS 16 filer: lease principal is a
# financing flow (IFRS 16.50(b)); the statement folds it into 'Repayment
# of borrowings' with no separate line (note 17's reconciliation p.165
# treats leases inside financing liabilities), so `lease_payments_capital`
# is absent; lease interest 13 is inside 'Interest paid' (note 6, p.147).
#
# EBITDA. Not stated. The issuer's leverage measure is 'Net debt was 1.6x
# adjusted EBITDA' at 31 December 2025 (AR printed p.41 = PDF p.43, the CFO's financial review; also p.34) and
# '2.5x adjusted EBITDA at 30 June 2026' (H1 PDF p.17; the highlights on p.2 repeat it) -- entered as
# `net_debt_ebitda`, the issuer's own APM.
#
# THE MARGIN CHECK. FY2025: the AR states 'an IFRS operating margin of
# 29.7% (2024: 17.1%)' (p.40 of the printed report) -- entered. H1 2026:
# no IFRS group operating margin is stated to a decimal (the results
# summary's 'Operating profit margin 18.7%' belongs to a different
# grouping than the statement's 1,166 / 6,411 = 18.2%), so
# `operating_income` 1,166 is entered on the interim with `op_margin`
# blank (E79, 2026-08-30, which withdrew B46's block).
#
# DEPRECIATION AND AMORTISATION (E82, E69). The cash flow prints one
# combined line ('Depreciation, amortisation and impairment 756'), which
# E82 refuses; notes 9 and 10 state the charges apart from the
# impairments (amortisation 143, depreciation 356, impairments 256 + 1 =
# 756 exactly), so the FY figure is an E69 hand read of 499. The interim
# prints only the combined 391 and nothing decomposes it: DATA MISSING,
# the line named on the field.

