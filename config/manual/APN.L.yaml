# config/manual/APN.L.yaml -- Applied Nutrition plc, hand-read from the
# documents the issuer filed with the FCA's National Storage Mechanism
# (sources/manifest.json, origin `fca-nsm`, LEI 213800KCP1IDX51ZHE47).
# Built 2026-08-30. UK-adopted IFRS; fiscal year to 31 July; half-yearly
# reporter; Main Market since 24 October 2024 (FTSE 250 from December 2025).
#
# DOCUMENTS:
#   1. Annual report FY2025 (year ended 31 July 2025) -- the NSM holds it
#      ONLY as the ESEF/iXBRL package NI-000134643 (published 2025-11-27,
#      zip with one xhtml, 213800KCP1IDX51ZHE47-2025-07-31-T01.xhtml). No
#      PDF annual report was filed with the NSM.
#      sources/APN.L_2025-FY_annual-financial-report_2025-11-27_xx_a0.zip
#   2. "Final Results" for the year ended 31 July 2025 -- RNS 943fa974-...,
#      2025-11-10, the full audited primary statements and notes as text.
#      sources/APN.L_2025-FY_final-results_2025-11-10_xx_a0.html
#   3. "Interim Results" for the half year ended 31 January 2026 -- RNS
#      4b44f706-..., 2026-03-23, condensed statements (unaudited).
#      sources/APN.L_2026-H1_half-year-financial-report_2026-03-23_xx_a0.html
#   4. "FY26 Trading Update" -- RNS 21714cc2-..., 2026-08-26, for the year
#      ended 31 July 2026: NAMED, not read for figures (no statements in it;
#      the FY26 results are due in November 2026 and will replace 2025-FY
#      here when filed).
#
# THE TEXT LAYER. Two behaviours in one issuer. The ESEF xhtml's text
# inserts spaces inside numerals ('107 .1', '(57 .8)', '250 ,000,000') --
# the AUTO.L defect, here on the only annual document the NSM holds. The
# RNS texts (2, 3) are clean: every numeral whole. So every figure below
# was READ FROM THE RNS TEXT (the Final Results carry the audited
# statements verbatim) and CROSS-READ against the ESEF: after removing the
# inserted spaces every FY2025 figure entered here is found in the ESEF
# text, and the ESEF tags ifrs-full Revenue, ProfitLossFromOperating-
# Activities, ProfitLoss, CashFlowsFromUsedInOperatingActivities,
# PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities,
# InterestReceivedClassifiedAsInvestingActivities, InterestPaidClassified-
# AsFinancingActivities, PaymentsOfLeaseLiabilitiesClassifiedAsFinancing-
# Activities, Current/NoncurrentLeaseLiabilities, CashAndCashEquivalents,
# DilutedEarningsLossPerShare, FinanceIncome, FinanceCosts, IncomeTaxesPaid
# and ExpenseFromSharebasedPaymentTransactionsWithEmployees (a tag-map
# second reader for a later pass; NOT applied here). There is NO rendered
# page to read back against for this name: an RNS has no pages and the
# xhtml is not a paginated document, so citations below name the
# statement or note, not a page. THE OWNER'S READ-BACK STEP COULD NOT BE
# PERFORMED IN ITS PDF FORM; the two-document agreement above is what
# stands in for it.
#
# THE TAG-MAP PASS, 2026-08-30 (E40; the AUTO.L ESEF precedent, E58). The
# question first: is the ESEF an honest second reader here, when it is
# the document the figures were NOT read from because its text spaces its
# numerals? The answer taken is YES, on these grounds, and the owner may
# overturn it by reverting this one commit. (1) The figures were read from
# the Final Results RNS of 2025-11-10; the ESEF is the annual report
# published 2025-11-27 -- two separately published documents carrying the
# same audited statements, which is MORE separation than AUTO.L had (one
# report, two renderings). (2) What was compared is not the text layer
# read by eye but the 187 ix:nonFraction facts parsed mechanically --
# concept, context, unit, scale and the digits of the value string with
# every inserted space removed -- extracted BEFORE any comparison, so
# nothing was read knowing the RNS number. (3) The spacing defect can only
# COST an agreement, never manufacture one: a dropped or doubled digit
# would disagree with the RNS, and no de-spacing choice exists for a
# string like '(57 .8)' or '250 ,000,000'. (4) The record above already
# said this pass was the second reader 'for a later pass'. The E59 route
# inside the RNS's own notes remains open as the fallback if the owner
# strikes this one. RESULT: every 2025-FY figure the basis reads has a
# tagged fact and AGREES -- 16 fields cross_document on the tag, three of
# them (income_tax_paid, capex_combined, lease_payments_capital) on
# magnitude with the sign reconciled by iXBRL convention; three fields
# have no tag (no xbrli:shares unit exists; no prepaid caption) and were
# settled under E59 -- the two 250,000,000 counts (the Directors' Report,
# the parent company's note and note 11 restate note 21) and the
# prepaid_delivery_obligation caption zero (the tagged liability captions
# sum exactly to the tagged totals). No tagged fact DIFFERS from an
# entered figure. The package also tags ifrs-full:Assets 75.0 and
# PropertyPlantAndEquipment 2.0, which this file never entered -- named,
# not added. 2026-H1 is outside the package and stays UNVERIFIED.
#
# STATUS: 2025-FY VERIFIED / cross_document throughout after the tag-map
# and E59 pass of 2026-08-30 (the four caption_statement zeros under E78
# stand); 2026-H1 all UNVERIFIED. No section 5 run, no fv_base, no tier,
# no mbp; no growth view is registered.
#
# PERIODS HELD: 2025-FY (fiscal year to 2025-07-31) and 2026-H1 (six
# months to 2026-01-31), labels on the FISCAL basis. Under E31 section 5
# stands on the year as filed and names 2026-H1 as the newer period. The
# interim's H1 FY25 comparatives, for the record: revenue 47.6; operating
# profit 11.5; net cash from operating activities 7.1; purchase of tangible
# fixed assets (0.3); profit 8.9 (GBP m).
#
# UNITS: GBP MILLION to one decimal (money_unit millions; every statement
# is headed '£m'). share_unit WHOLE (250,000,000 printed whole). Per-share
# figures in PENCE; the quote is GBX.
#
# SECTOR: the screener holds no fundamentals row for APN.L (first bar
# 2024-10-24, inside the listing-age floor), so no screener string exists;
# the vendor classifies the ticker 'Consumer Defensive / Packaged Foods'
# and that string is entered AS A PLACEHOLDER for the owner to confirm.
#
# E34 -- INTEREST. `interest_in_ocf: no`. Both legs sit OUTSIDE operating:
# 'Interest received 0.6' is in cash flows from INVESTING activities and
# 'Interest paid on lease liability (0.1)' in FINANCING (the only interest
# the group pays -- it has no borrowings). Operating cash flow therefore
# bears no interest at all; the two legs are entered as `finance_costs_paid`
# and `finance_income_received` and the tool nets them (E34). The interim
# keeps the placement.
#
# E70 -- LEASES. `operating_leases_in_ocf: no`: IFRS 16 filer, 'Principal
# paid on lease liability (0.3)' sits in financing (IFRS 16.50(b)); the
# lease is counted once, in net debt; `lease_payments_capital` is a memo.
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS. No borrowings: the balance sheet
# presents no borrowings caption in either liability block (current: lease
# liabilities, trade and other payables; non-current: deferred tax, lease
# liabilities, provision for liabilities) and note 23 / interim note 9 list
# the financial liabilities in full -- trade and other payables, accruals,
# lease liabilities -- so both borrowing legs are ZERO on the caption form.
# Leases by E71's stated total (note 14 'Total lease liability 3.0';
# interim note 9 'Lease liabilities 3.1'), the two captions summing to the
# same. Pension: 'The Group operates a defined contribution pension scheme'
# (accounting policy 2.19, the only pension arrangement; no retirement
# caption on the balance sheet) -- ZERO on the note form under E35.1.
# Asset retirement obligation: the ONLY provision is 'Leasehold property
# dilapidations 0.3' (note 20; balance sheet 'Provision for liabilities
# (0.3)') -- a discounted, legally required, cash-settled restoration
# obligation on leased property, read by hand (E69) and ENTERED as the E68
# leg on the AUTO.L precedent (FRAMEWORK-EDITS E68.1 applications table).
# E36: cash 18.5 / 26.4; no other-current-financial-assets caption (blank,
# E25 forbids a zero there).
#
# E38 / E75 / E75.1 -- SHARE COUNTS. Diluted weighted average 250,000,000
# for FY2025 (note 11: no dilutive instruments) and 250,407,125 for H1
# FY26 (interim note 8: 'Effect of potentially dilutive items 407,125').
# Point-in-time: 250,000,000 ordinary shares in issue (note 21, interim
# note 10); no treasury shares exist or are mentioned, so the issued count
# IS the net count and is entered.
#
# E23 -- CAPEX. One investing purchase line, 'Purchase of tangible fixed
# assets (1.0)' / (0.2); intangible additions are stated 'below £0.1
# million' (note 15) and have no cash-flow line, so `capex_combined`
# carries the one line and the split fields stay blank.
#
# THE MARGIN CHECK (B46, settled by E79 2026-08-30). No statutory operating
# margin is stated in either document; the only margin printed is 'EBITDA
# margin of 29% for FY25', an APM to a whole percent. Under E79 a stated
# EBIT with no stated margin enters: operating profit 28.1 (26.2% of
# revenue) and 20.7 (27.8%) are entered with `op_margin` blank.
#
# NOT STATED: any net-debt-to-EBITDA (the group is net cash); a pension
# deficit; borrowings. NOT ENTERED: 'Adjusted EBITDA 30.9' / '21.5' (APM).
#
# THE FY26 TRADING UPDATE (2026-08-26) reports the year to 31 July 2026
# unaudited; nothing from it is entered.

ticker: APN.L
name: Applied Nutrition plc
reporting_currency: GBP
money_unit: millions
share_unit: whole
quote_currency: GBX
sector: Consumer Defensive   # PLACEHOLDER: no screener string exists for APN.L (no fundamentals row); the vendor's classification, for the owner to confirm
reporting_frequency: half_yearly
origin: manual

interest_in_ocf:
  value: no
  source: "Final Results FY2025 (RNS 2025-11-10, audited statements); Interim Results H1 FY26 (RNS 2026-03-23, unaudited)"
  page: "Consolidated statement of cash flows, year ended 31 July 2025: 'Net cash inflow from operating activities 15.6' contains no interest line; 'Interest received 0.6' is under cash flows from INVESTING activities and 'Interest paid on lease liability (0.1)' under cash flows from FINANCING activities (beside 'Principal paid on lease liability (0.3)'). The interim (half year to 31 January 2026) keeps the placement: 'Interest received 0.2' investing, 'Interest paid on lease liability (0.1)' financing. The ESEF tags the two as InterestReceivedClassifiedAsInvestingActivities and InterestPaidClassifiedAsFinancingActivities"
  interest_source: cash_flow_statement

operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): principal payments on lease liabilities are financing cash flows; the statement shows exactly that -- 'Principal paid on lease liability 14 (0.3)' (FY2025) and '(0.4)' (H1 FY26) under cash flows from financing activities, tagged PaymentsOfLeaseLiabilitiesClassifiedAsFinancingActivities in the ESEF. Lease interest follows the filer's IAS 7 placement, recorded in `interest_in_ocf`"

