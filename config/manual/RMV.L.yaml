# config/manual/RMV.L.yaml -- Rightmove plc, hand-read from the documents the
# issuer filed with the FCA's National Storage Mechanism (sources/manifest.json,
# origin `fca-nsm`, LEI 2138001JXGCFKBXYB828). Built 2026-08-30. UK-adopted
# IFRS; year to 31 December; half-yearly reporter (E31 / config.py: periods are
# YYYY-H1 / YYYY-H2 / YYYY-FY).
#
# DOCUMENTS (the two the owner asked for, plus two RNS notices used only to
# corroborate and to supply a period-end count):
#   1. "Annual report and accounts 2025" -- NSM disclosure NI-000141952, Direct
#      Upload PDF, published 2026-03-30, document date 2025-12-31 (audited).
#      sources/RMV.L_2025-FY_annual-financial-report_2026-03-30_xx_a0.pdf.
#      The ESEF/iXBRL package NI-000141949 is downloaded beside it (.zip).
#      UPDATED 2026-08-30: the inline-XBRL report inside it
#      (reports/2138001JXGCFKBXYB828-2025-12-31-T01.xhtml, 278
#      ix:nonFraction facts, two units: u-1 GBP and u-2 GBP/shares, no
#      xbrli:shares unit) was read and compared field by field against the
#      2025-FY entries below (E40; the AUTO.L ESEF precedent, E58). TWENTY-ONE
#      fields agree exactly with a tagged fact and carry
#      `verified_kind: cross_document` citing tag and context inline. Four of
#      them -- income_tax_paid, capex_ppe, capex_intangibles,
#      lease_payments_capital -- agree on magnitude with the sign reconciled
#      by CONVENTION (iXBRL tags an outflow concept as a positive magnitude,
#      this file signs outflows negative), which is not a discrepancy. No
#      tagged fact DIFFERS from an entered figure. EIGHT fields have no tag
#      (no share count of any kind, no APM EPS, no ratio, no prepaid caption)
#      and were settled under E59 instead, each citing its reconciling note
#      or section inline: the three period-end share counts (restated in the
#      Directors' Report and the Remuneration Report), the diluted weighted
#      average (net_income / diluted_eps to rounding, the AUTO.L shape),
#      diluted_eps_adjusted (note 1's underlying profit over that count),
#      op_margin and revenue_yoy (ratios of tagged figures at the printed
#      precision, E79), and the prepaid_delivery_obligation caption zero
#      (the tagged liability captions sum exactly to the tagged total). The
#      2026-H1 entries are outside the package and stay UNVERIFIED.
#   2. "Half-year Financial Report" -- RNS 0dac321e-e548-4dbf-8e4c-aaba3fa00ef6,
#      published 2026-07-31 07:00, the condensed consolidated interim statements
#      for the six months to 30 June 2026 (unaudited).
#      sources/RMV.L_2026-H1_half-year-financial-report_2026-07-31_xx_a0.html.
#   3. "Annual Financial Report" final-results RNS 5fd6b503-2f4e-442a-9e18-908be7579695,
#      2026-02-27 -- the FY2025 results announcement; on file, not read for figures.
#   4. "Total Voting Rights" RNS 0db60171-bfa5-4b90-b546-5b47ba8a7b9e, 2026-07-01:
#      the issued and treasury counts at 30 June 2026, which the interim itself
#      does not print as a count (E75's window-end divisor).
#
# READ-BACK. Every FY2025 figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF 1.28.2, 110-120 dpi):
# printed pages 115, 116, 117 (the three statements), 123 (policies), 128
# (notes 7-9), 129 (note 10), 130 (notes 12-13), 132 (notes 17-19), 133
# (notes 19-21), 135 (note 23). Unlike AUTO.L's annual report, this PDF's
# text layer carries every numeral intact -- no inserted spaces -- and every
# figure agreed between the two readings. Printed page = PDF page - 2. The
# interim is an RNS HTML document flattened by vss/source.py's html_to_text;
# there is no rendered page to read back against, the text IS the filing.
#
# STATUS: 2025-FY VERIFIED / cross_document throughout after the ESEF and E59
# pass of 2026-08-30 (the three caption_statement zeros under E78 stand);
# 2026-H1 all UNVERIFIED. No section 5 run, no fv_base, no tier, no mbp: no
# growth view is registered for this name.
#
# PERIODS HELD: 2025-FY and 2026-H1. The interim's six-months-to-30-June-2025
# comparatives are NOT entered: the overlap guard (vss/rules.py
# overlap_problem) never holds 2025-H1 beside 2025-FY. Under E31 section 5
# stands on the year as filed (2025-FY) and names 2026-H1 as the newer filed
# period it passed over. For the record, the interim's H1 2025 column reads:
# revenue 211,730; operating profit 145,385; net cash from operating
# activities 120,048; income taxes paid (35,331); PPE (387); intangibles
# (4,033); share-based payments 4,541; profit 109,908 (all £000).
#
# UNITS. money_unit: thousands -- every statement and note is headed "£000".
# share_unit: whole -- share counts are printed in full (773,281,827), no
# rounding (E53). Per-share figures are PENCE, as printed, and the quote is
# GBX (pence), so the two agree without conversion (as AUTO.L).
#
# E23 -- CAPEX. The cash flow statement prints TWO lines, 'Acquisition of
# property, plant and equipment (903)' and 'Acquisition of intangible assets
# (9,276)', so `capex_ppe` and `capex_intangibles` are entered and
# `capex_combined` is left blank (the schema reads the pair). The intangible
# line is the larger: note 13 (p.130) shows additions of 6,509 computer
# software and 2,767 software development -- internally generated software is
# capitalised, and the flow deducts it as capex.
#
# E34 -- INTEREST. See `interest_in_ocf` below. Mixed placement: interest
# PAID sits inside operating activities ('Financial expenses paid (535)'),
# interest RECEIVED sits in investing ('Interest received on cash and cash
# equivalents 2,435'). `operating_cash_flow` therefore already bears the cost
# side and excludes the income side.
#
# E35 / E35.1 / E65-E68 -- NET DEBT LEGS. No borrowings at all (balance
# sheet p.116 carries no borrowings caption; the Strategic Report p.59 says
# "no external debt"): both borrowing fields are named zeros. Lease
# liabilities 7,184 (note 19 p.132 states the total beside its current and
# non-current parts -- E65; an IFRS 16 lessee has ONE lease liability, there
# is no finance/operating split to size, so E73 is not engaged). Pension: a
# named zero on E35.1's `note` form -- the Group provides defined
# contribution plans only (p.123). Asset retirement obligation: the
# dilapidations provision 1,717 (note 20 p.133) is entered under E68 via E69,
# exactly as AUTO.L's dilapidations 3.7 was (E68.1 applications table):
# a lessee's obligation to make good leased premises, discounted, unwound
# through financial expenses (note 8: 'Interest unwind on dilapidations 12').
# Named beside the legs but NOT a leg: 'Other current liabilities 428', the
# ringfenced deferred consideration for HomeViews Platform Limited payable
# February 2026 (note 17 p.132) -- settled in H1 2026 ('Settlement of
# deferred consideration (400)' in the interim's investing activities).
#
# E36 -- SHARE-BASED COMPENSATION. `sbc` is the cash-flow add-back 'Share-based
# payments 8,539' (p.117), which note 23 (p.135) states as the 'Total
# share-based payments charge 8,539' -- the IFRS 2 charge across the five
# equity-settled schemes. The income statement's 'Share-based incentive
# charge (9,815)' is that charge PLUS 'NI on applicable share-based
# incentives at 15.0% 1,276', a cash cost the flow already bears; entering
# 9,815 would deduct the NI twice. Same convention as AUTO.L (charge
# excluding associated NI). All schemes are equity-settled (policy p.123).
#
# E38 / E75 / E75.1 -- DIVISOR. FY2025 states a diluted weighted average
# (775,356,560, note 10 p.129) for the twelve months, which is E38's
# divisor on the 2025-FY basis. The interim states a SIX-month diluted
# average (756,031,940), not a window average for any twelve-month basis;
# if a TTM basis to 2026-06-30 were ever struck, E75 takes the count at the
# window end -- no diluted period-end count is printed anywhere, so E75.1
# falls to the BASIC net count: issued 755,900,469 less treasury 10,490,552
# less EBT 1,464,961 less SIP 1,500,721 (E16 / E54), which the store forms.
#
# E70 -- LEASES IN THE FLOW. IFRS 16 filer: principal in financing
# ('Payment of principal portion of lease liabilities (3,146)', p.117), so
# nothing is added back; `lease_payments_capital` is the memo E70 makes it.
# The interest portion (80, note 19 p.133) sits inside 'Financial expenses
# paid (535)' in operating activities.
#
# NOT PRESENTED, therefore absent (never derived, E22): gross profit (the
# income statement runs revenue less administrative expenses); EBITDA (the
# issuer states none -- there is no debt to lever it against); a single
# depreciation-and-amortisation total (the cash flow statement prints
# 'Depreciation charges 3,937' and 'Amortisation charges 4,391' as two lines
# and no note adds them); a free-cash-flow line (p.126 defines an operating
# cash conversion of 107% but prints no FCF figure).

ticker: RMV.L
name: Rightmove plc
reporting_currency: GBP
money_unit: thousands
share_unit: whole
quote_currency: GBX
sector: Communication Services   # the screener's own source-list string (config/watchlist.yaml, 2026-08-27 PIPELINE entry) -- not from these documents
reporting_frequency: half_yearly
origin: manual

interest_in_ocf:
  value: yes
  source: "Annual report and accounts 2025 (audited); Half-year Financial Report 2026 (RNS, unaudited)"
  page: "p.117, consolidated statement of cash flows: 'Financial expenses paid (535)' sits INSIDE cash flows from operating activities, between 'Cash generated from operating activities 308,015' and 'Net cash from operating activities 236,299' (beside 'Income taxes paid (71,181)'); 'Interest received on cash and cash equivalents 2,435' sits in cash flows used in INVESTING activities, outside. So the operating cash flow already bears every finance cost PAID (note 8, p.128: the £557k charge is 'Bank charges 455', 'Interest unwind on lease liabilities 90', 'Interest unwind on dilapidations 12') and does not contain the interest RECEIVED -- the conservative side. The interim keeps the placement: 'Financial expenses paid (272)' in operating, 'Interest received on cash and cash equivalents 1,116' in investing"
  interest_source: cash_flow_statement

# E70 (2026-08-30): whether this filer's operating cash flow bears its lease
# principal. Under IFRS 16 it does not, so nothing is added back: the lease
# is counted once, in net debt (E35, E65); `lease_payments_capital` is a
# memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities; p.117 shows exactly that, 'Payment of principal portion of lease liabilities 19 (3,146)' under cash flows used in financing activities. The interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records (80 inside 'Financial expenses paid'). The standard leaves no choice on the principal"

