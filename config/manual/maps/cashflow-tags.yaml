# THE CASH FLOW STATEMENT'S OPERATING ROWS: tag -> class.
#
# Read by vss/cfrecon.py (data rule under E164, decided by the owner
# 2026-11-08). Every row between net income and "net cash provided by
# operating activities" must be classed here, or the name's working capital
# is DATA MISSING and section 5 does not run for it. The rows must also sum
# to the printed operating cash flow exactly.
#
# The classes (the owner's three):
#   rörelsekapital  -- E140(1)'s operating working capital. Stripped from
#                      FCF0 as a swing (or kept under E154). The ONLY class
#                      that enters `working_capital_change`.
#   kvar-i-flödet   -- a cash line that stays in the flow: tax, lease and
#                      long-term lines (E140(1)), E123's inventory where it
#                      is the business, and whatever is not named as working
#                      capital.
#   icke-kassapost  -- a non-cash adjustment to net income. It stays in the
#                      flow; it is named apart only for the reader.
#
# section: adjustments | changes -- WHERE THE FILING PRINTS THE ROW, read
#   from it (vss/cfrecon.py finds the "changes in ... assets and
#   liabilities" heading). A row standing in another section than its entry
#   says is DATA MISSING. Owner, 2026-11-08: a row under the changes heading
#   is working capital whatever its tag; an entry there in another class
#   must name its E140(1) exception (e140_exception: tax | lease |
#   long-term | E123), or the map does not load.
# class: följer-sektion -- a CATCH-ALL ("Other", "Other, net"): working
#   capital under the changes heading, a non-cash adjustment above it.
#
# A tag missing from the map STOPS the name (DATA MISSING) and is put to the
# owner. The session never adds one; it may only list it under `pending:`
# with a proposal.
#
# Flags:
#   fordran: true          -- a receivable. Where one is stripped, a row
#                             with följer_fordran is stripped with it.
#   följer_fordran: true   -- a loan book's provision for losses, added back
#                             above the receivable (E140(1), HRB's Emerald
#                             Advance). Only a ROW of the statement can
#                             follow; a provision tagged in a note never
#                             does. The old companyfacts sum took CTSH's
#                             11m from a note, which is why its FY2025 was
#                             -327m and the statement's is -338m.
#
# `overrides:` is per ticker and wins over `tags:`. A tag that means
# different things at different filers (IncreaseDecreaseInDepositsOutstanding)
# is classed ONLY in an override, so a new filer using it stops on DATA
# MISSING instead of inheriting a meaning.
#
# Every entry has a note. A change here changes values: it is a data-rule
# change and lands with the re-valuation table that shows what moved.

