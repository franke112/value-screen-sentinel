# config/manual/NHY.OL.yaml -- Norsk Hydro ASA, hand-read from the issuer's
# own published reports. Built 2026-08-30. IFRS as adopted by the EU;
# calendar year; QUARTERLY reporter in NOK.
#
# DOCUMENTS (sources/manifest.json, origin `issuer-website`). Every one of
# these is also filed on Euronext Oslo's NewsWeb -- the Norwegian Officially
# Appointed Mechanism -- as an attachment to the results release (message
# and attachment ids in the manifest), but NewsWeb's attachment endpoint
# answers HTTP 400 to every automated request this tool could form, so the
# files were taken from hydro.com, the issuer's own site, and the NewsWeb
# record is named beside each as the regulatory copy of the same document.
#   1. Report Q3 2025 (2025-10-24)            sources/NHY.OL_2025-Q3_quarterly-report_2025-10-24_en_a0.pdf
#   2. Fourth Quarter Report 2025 (2026-02-13) sources/NHY.OL_2025-Q4_quarterly-report_2026-02-13_en_a0.pdf
#   3. Integrated Annual Report 2025 (2026-02-13, audited)
#                                              sources/NHY.OL_2025-FY_annual-financial-report_2026-02-13_en_a0.pdf
#   4. First Quarter Report 2026 (2026-04-29)  sources/NHY.OL_2026-Q1_quarterly-report_2026-04-29_en_a0.pdf
#   5. Second Quarter Report 2026 (2026-07-22) sources/NHY.OL_2026-Q2_quarterly-report_2026-07-22_en_a0.pdf
# The ESEF/iXBRL package (NewsWeb message 665792, attachment 319033,
# nhy-2025-12-31-1-nb.zip) is filed on NewsWeb only and could not be fetched.
#
# READ-BACK. Every figure was read from the PDF text layer and then read
# back against the page rendered as an image (PyMuPDF 1.28.2, 105 dpi):
# the quarterly reports' income statement (p.21) and cash flow statement
# (p.24) for all four quarters, the Q2 2026 balance sheet (p.23) and
# adjusted net debt table (p.34), and the annual report's income statement
# (p.140), balance sheet (p.141), cash flow statement (p.142), provisions
# table (p.172), debt note (p.182), equity note (p.184) and cash flow
# information (p.206). Printed page = PDF page in every document. The text
# layer carries every numeral intact (the annual report uses a space as the
# thousands separator, "207 971"; the quarterlies a comma) and every figure
# agreed between the two readings.
#
# STATUS: all UNVERIFIED (owner's instruction, 2026-08-30). No section 5
# run, no fv_base, no tier, no mbp: no growth view is registered.
#
# UNITS. money_unit: millions -- every statement is headed "NOK million".
# share_unit: millions -- the quarterlies print counts in millions
# ('Weighted average number of outstanding shares (million) 1,966'); the
# annual note 7.6 prints whole shares (1,965,278,330), entered as an exact
# conversion to millions (E53: one scale per file).
#
# WHAT A QUARTERLY REPORT DOES NOT STATE, and is therefore absent on the
# quarters (never derived): interest paid and received, income taxes paid,
# share-based compensation, lease liabilities, the asset retirement
# obligation, and any split of the debt captions. The annual report states
# each once a year and the FY2025 annual entry carries them; on a TTM basis
# only the fields E41 names as annual-only (sbc, pension_deficit,
# asset_retirement_obligation, diluted_weighted_average_shares) reach a
# window from there -- the borrowing and lease legs at 30 June 2026 stay
# DATA MISSING, as said on the 2026-Q2 entry.
#
# E23 -- CAPEX. One line, 'Purchases of property, plant and equipment';
# no intangibles line is printed in any of the five documents (the
# investing section's other lines are long-term investments and
# short-term investments). E23: where the issuer prints ONE line it is
# `capex_combined`, and the split fields stay blank -- the schema reads the
# pair only where both resolve, and this one line otherwise.
#
# E34 -- INTEREST. Both sides INSIDE operating activities: annual report
# note 10.3 (p.206), 'Cash disbursements and receipts included in cash
# from operations: Income taxes paid 4 765, Interest paid 2 358, Interest
# received 1 072'. The condensed quarterly statements do not print them.
#
# E35 / E14 / E67 -- THE DEBT LEGS. Hydro's balance sheet presents 'Bank
# loans and other interest-bearing short-term debt' and 'Long-term debt',
# and note 7.4 (p.182) shows both CONTAIN the lease liabilities: outstanding
# debt = unsecured loans 31 721 + other loans 445 + lease liabilities 4 305
# = 36 471, less the current portion 8 046 = long-term debt 28 425; the
# short-term caption is that current portion plus bank loans 103. The
# leases' own current/non-current allocation is not stated. Under E67 the
# two captions are read WHOLE at 31 December 2025, the lease 4 305 inside
# them named and not added again by E65 (`lease_liabilities` a named zero
# on E25's `subtotal` form: 8 149 + 28 425 = 36 574 = 36 471 + 103, every
# krone once). At 30 June 2026 the interim states no lease figure, so E67
# refuses and all three fields are DATA MISSING with the captions named.
#
# E68 / E68.1 / E69 -- ASSET RETIREMENT OBLIGATION. An extractive filer on
# E68.1's refuse-until-read list: bauxite mining, alumina refining,
# smelting. Read, not zeroed. Note 4.1 (p.172) states 'Environmental
# clean-up and asset retirement obligations (ARO)' short-term 1 066,
# long-term 3 224, TOTAL 4 290 at 31 December 2025 (2024: 4 710) --
# entered under E69 as the stated total. The interim balance sheet carries
# only the aggregate 'Provisions 5 026' (non-current, all five categories)
# with the current portion inside 'Other current liabilities', so at 30
# June 2026 the leg is DATA MISSING with those captions named; the Q2
# report's adjusted-net-debt table (p.34, footnote 5) deducts the ARO net
# of a 30% tax benefit inside a combined 5 332, which is not the gross
# figure and is not entered.
#
# E35.1 -- PENSION. 'Pension liabilities' as presented (8 756 at 30 June
# 2026; 8 902 at 31 December 2025). The separately presented 'Prepaid
# pension' asset (10 559 / 10 563) is NOT netted: the schema holds no field
# for it and omitting an asset is the conservative direction.
#
# E36 -- SHARE-BASED COMPENSATION. Equity-settled awards are the employee
# share purchase plan only: note 9.2 (p.199) 'Compensation expense related
# to the award, NOK thousand 17 425' (2024: 38 551) = NOK 17.425 million.
# Hydro's long-term incentive is cash-settled and flows through operating
# cash flow when paid (E36 excludes it). Annual-only; not stated quarterly.
#
# E38 / E75 -- DIVISOR. Every quarterly and annual statement prints
# 'Basic and diluted earnings per share' on one count with the footnote
# 'There were no significant diluting elements', so the stated diluted
# weighted average IS the basic one. The 30 June 2026 balance sheet prints
# the net count directly, 'Total number of outstanding shares (million)
# 1,967' -- E75's window-end count, basic (E75.1: no diluted count at a
# date is printed).
#
# E70 -- LEASES IN THE FLOW. IFRS 16 filer: the principal is a financing
# flow (IFRS 16.50(b)); Hydro's statement folds it into 'Loan repayments'
# and prints no separate lease line, so `lease_payments_capital` is absent.
#
# EBITDA. Entered as Hydro's own 'Adjusted EBITDA' -- the measure its
# leverage target is set on (IAR p.35: 'adjusted net debt to adjusted
# EBITDA ... targeted maximum ratio of 2.0 over the cycle') -- a non-GAAP
# figure the reports print in their performance review (p.4); each
# quarter's figure is the one printed there, and the four quarters of 2025
# (9 516 + 7 790 + 5 996 + 5 587) add to the annual report's 28 889.
#
# NOT STATED anywhere in the five documents: an operating margin (Hydro
# presents EBIT and adjusted EBITDA, never a margin), gross profit, a free
# cash flow reconciled to the statements (the 'free cash flow' in the
# performance review is an APM), a stated revenue growth rate.

