name: Norsk Hydro ASA
reporting_currency: NOK
money_unit: millions
share_unit: millions
quote_currency: NOK
sector: Basic Materials   # the screener's own source-list string (config/watchlist.yaml, 2026-08-27 PIPELINE entry) -- not from these documents
reporting_frequency: quarterly
origin: manual

interest_in_ocf:
  value: yes
  source: "Integrated Annual Report 2025 (audited), note 10.3 Cash flow information"
  page: "p.206, note 10.3, 'Cash disbursements and receipts included in cash from operations': 'Income taxes paid 4 765 4 719', 'Interest paid 2 358 2 661', 'Interest received 1 072 1 542' (2025, 2024) -- both interest sides are INSIDE 'Net cash provided by operating activities 23 311' (p.142), which is stated after them; the condensed quarterly cash flow statements (p.24 of each report) print only net income, depreciation/amortization/impairment and 'Other adjustments' above the operating total"
  interest_source: cash_flow_statement

operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities; note 2.6 (p.165) 'Lease liabilities are included in debt, see note 7.4', and the cash flow statement (p.142) carries the principal inside 'Loan repayments (11 877)' with no separate lease line. The interest portion is inside operating activities with the rest of the interest paid (note 10.3)"

