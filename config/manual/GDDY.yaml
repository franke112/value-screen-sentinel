name: "GoDaddy Inc."
reporting_currency: USD
money_unit: whole     # as XBRL states them; the run record normalises on this declaration
share_unit: whole     # counts are tagged as whole shares
quote_currency: USD   # from the watchlist entry, not from the facts: a listing currency is not a tagged fact

# E34: where this filer books its interest, for the BASIS YEAR
# (FY2025). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0001609711 (GoDaddy Inc.) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0001609711.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"
  # E61: this filer tags GROSS interest expense
  # (`finance_costs_period`) but never the net and never an
  # interest-received figure, so neither E34's cash pair nor
  # E34.1's accrual net can form. The add-back is the gross
  # expense alone -- a BOUNDED, ONE-SIDED PROXY: interest income
  # is never negative, so this can only OVERSTATE FCF0, never
  # understate it, and FCF0 prints the bound as a percentage.
  # OVERRIDDEN BY HAND 2026-08-30 under E69 after the 10-K was read (see
  # the header): the filing STATES the net -- 'Interest expense, net of
  # interest income | (114.2)' (Note 17; Item 7) -- so the E61 proxy may
  # not stand and E34.1's accrual net applies. The stated net is entered
  # as `net_finance_costs` on the FY2025 entry; the tagged gross expense
  # 151.0 stays on the file as `finance_costs_period` and is no longer
  # the leg.
  interest_source: income_statement_net

# E70: whether this filer's operating cash flow bears its operating
# lease payments. Under ASC 842 it does, so FCF0 ADDS the stated cash
# paid (`operating_lease_payments`) back: the lease liability in net
# debt already charges the obligation, and the lease is counted once.
operating_leases_in_ocf:
  value: yes
  source: "SEC XBRL companyfacts for CIK 0001609711 (GoDaddy Inc.) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0001609711.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 842-20-45-5(a): a lessee classifies payments for operating leases within OPERATING activities, so this filer's `operating_cash_flow` already bears them; the stated cash paid is `us-gaap:OperatingLeasePayments`, written as `operating_lease_payments` where tagged. No filer-specific tag states the classification because the standard leaves no choice"
