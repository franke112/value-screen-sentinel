# AUTO.L -- Autotrader Group plc, hand-read from the issuer's own filings.
# WRITTEN 2026-08-27. No section 5 run on this file: no fv_base, no tier,
# no mbp, no growth view registered in reference/growth-views/AUTO.L.md.
#
# SOURCES, all four in sources/, all recorded in sources/manifest.json with
# FCA National Storage Mechanism provenance (LEI 213800QLK9BZILB1DI86):
#   AR    Annual Report and Financial Statements 2026 (audited), 146 PDF
#         pages, published 2026-06-08, covering FY ended 2026-03-31.
#   ESEF  the same report as an ESEF/iXBRL tagged package. UPDATED
#         2026-08-27: the inline-XBRL report inside the taxonomy package
#         (reports/213800QLK9BZILB1DI86-2026-03-31-T01.html) was read and
#         its 326 ix:nonFraction facts cross-checked field by field against
#         this file (FRAMEWORK-EDITS E40). ELEVEN fields agree and now carry
#         `verified_kind: cross_document` -- revenue, operating_income,
#         net_income, total_assets, cash_and_equivalents,
#         financial_liabilities_noncurrent, lease_liabilities,
#         operating_cash_flow, diluted_eps, capex_ppe, capex_intangibles.
#         The last two match on magnitude only after reconciling a SIGN
#         CONVENTION, not a discrepancy: this file signs cash outflows
#         negative, while the iXBRL concept
#         (PurchaseOf...ClassifiedAsInvestingActivities) tags the outflow as
#         a positive magnitude by taxonomy convention -- same £27.3m /
#         £0.1m either way, noted inline where each field sits. FOUR fields
#         (financial_liabilities_current, shares_issued_period_end,
#         treasury_shares_period_end, diluted_weighted_average_shares) have
#         no corresponding tagged fact at all -- the package defines only
#         two units in the whole document (Unit_GBP and Unit_GBP_per_Share,
#         no bare xbrli:shares unit exists anywhere), so no share COUNT is
#         ever tagged, only the monetary IssuedCapital/TreasuryShares
#         captions and the EPS ratios themselves; and no current-borrowings
#         concept is tagged at all. Those four stay same_page; the three
#         share-count fields among them were instead checked by ARITHMETIC
#         against other entered figures (see SHARE COUNT ARITHMETIC CHECKS
#         below) since the PDF text layer is the hazard most likely to have
#         corrupted exactly these numbers.
#   FY RNS  "FULL YEAR RESULTS FOR THE YEAR ENDED 31 MARCH 2026", 2026-05-21.
#   H1 RNS  "HALF YEAR RESULTS FOR THE SIX MONTHS ENDED 30 SEPTEMBER 2025",
#           2025-11-06. Not used for a periods: entry -- see BASIS below.
# Nothing here comes from outside these four files (plus the ESEF package's
# own tagged facts, now read), and nothing was web-searched.
#
# PAGE CONVENTION: every `page:` below is the PRINTED folio, which for this
# PDF is PDF page minus 2 (the cover and contents carry no printed number).
#
# A HAZARD IN THE SOURCE, not in this file: the AR's PDF text layer inserts
# spaces inside some numerals -- note 25's share total extracts as
# "8 2 7, 5 0 3", note 12's goodwill as "1 1 7. 0". Every figure below was
# read back against the RENDERED page, not the raw extraction.
#
# BASIS. reporting_frequency: half_yearly. Autotrader files H1 and FY only,
# no discrete quarters. The one periods: entry is 2026-FY (year ended
# 2026-03-31), the newest filed period and the twelve-month window E19/E31
# put section 5 on for a half-yearly reporter. The H1 RNS (six months to
# 2025-09-30) falls ENTIRELY INSIDE that year and is not a second periods:
# entry -- it would overlap the FY window and double-count April-September
# 2025. It supplied no figure below; it was read only for the Gate 2 /
# section 2 narrative (reports/AUTO.L-reading-2026-08-27.md).
#
# EXPENSES ARE CLASSIFIED BY NATURE, and the issuer says so: "In the current
# and prior year, the Group has classified expenditure by nature (2025: by
# nature)" (note 4, p.114). The income statement carries a single "Operating
# costs" line and NO gross profit (p.101) -- gross_profit is DATA MISSING
# because the concept is not presented, not because it was not found.
#
# UNITS. money_unit: millions, as the accounts state: "rounded to the
# nearest hundred thousand (£0.1m)" (note 1, p.106).
#
# share_unit: thousands (FRAMEWORK-EDITS E53). Note 25 (p.125) prints the
# period-end issued count ALREADY ROUNDED to the nearest thousand -- "Total
# 827,503" -- and no more exact figure is printed anywhere; deriving one
# from note 11's opening count less note 25's cancellation would be MORE
# precise than the accounts state and is exactly the derivation E22
# forbids. share_unit is ONE scale for the whole file (vss/runrecord.py
# multiplies a single shares.unit against the whole record), so every OTHER
# share count -- notes 11 and 26 print these in WHOLE UNITS -- is converted
# to thousands by dividing by 1,000, an EXACT operation that loses no
# precision (E53's correction, same day): diluted_weighted_average_shares
# 862,666,250 -> 862,666.25; treasury_shares_period_end 4,412,082 ->
# 4,412.082; employee_trust_shares_period_end 282,389 -> 282.389. Only
# shares_issued_period_end (827,503) carries the issuer's own rounding,
# to +-500 shares.
#
# SHARE COUNT ARITHMETIC CHECKS, 2026-08-27. The ESEF package tags no share
# count at all (see ESEF note above), so the three PDF-only share fields
# were checked by ARITHMETIC against other entered figures instead of by a
# second document -- a CHECK, not a derivation, and none of the three
# entered values below was changed by it (E22, E53 stand).
#
#   diluted_weighted_average_shares (862,666.25 thousand = 862,666,250,
#   note 11 p.117, printed CLEANLY -- no space-insertion in this cell).
#   Reproduced from the two figures on this basis already VERIFIED
#   cross_document against the ESEF package: net_income 293.9 and
#   diluted_eps 34.07p. shares = net_income / diluted_eps =
#   293,900,000 / 0.3407 = 862,635,750 (point estimate on the rounded
#   inputs). Against the printed 862,666,250 that is a gap of 30,500
#   shares, 0.0035%. Both inputs are themselves rounded (net_income to the
#   nearest £0.1m, diluted_eps to the nearest 0.01p); propagating those
#   tolerances gives a band of 862,362,436-862,909,144, which contains
#   862,666,250 comfortably. CONSISTENT to rounding.
#
#   shares_issued_period_end (827,503 thousand, note 25 p.125, THE hazard
#   page -- "8 2 7, 5 0 3" in the raw extraction). Two independent checks:
#     (a) note 11's EXACT opening count less note 25's EXACT cancellation.
#     Note 11 (p.117, EPS reconciliation, printed cleanly): "Issued
#     ordinary shares at 1 April 884,700,426". Note 25's own narrative
#     (p.125, printed cleanly): "a total of 58,493,141 ordinary shares...
#     were purchased. ... 1,295,147 were held in treasury with 57,197,994
#     being cancelled." 884,700,426 - 57,197,994 = 827,502,432. Against the
#     printed rounded total of 827,503,000 that is a gap of 568 shares,
#     0.00007% -- outside a naive +-500 half-a-thousand rounding band, but
#     immaterial in size, and unsurprising: note 11's opening count and
#     note 25's share-capital roll-forward are two different disclosures
#     that need not share one internal cutoff to the share. CONSISTENT
#     for practical purposes; the residual is a fact about the accounts,
#     not corrected here (E22 -- this is a check, not a derivation, and
#     827,503 as printed remains the entered figure regardless).
#     (b) issued capital at par. Note 25's own table: shares of "1p each"
#     (£0.01 par), Amount column "8.3" (£m, rounded to the nearest £0.1m).
#     827,503,000 shares x £0.01 = £8,275,030 = £8.28m unrounded, rounds to
#     £8.3m -- matches. Reversing loosely (£8.3m +-£0.05m at £0.01 par is
#     825,000,000-835,000,000 shares) also contains 827,503,000 easily.
#     CONSISTENT.
#   Neither check failed; both entered figures stand as printed, now noted
#   as arithmetically checked rather than left as a single PDF read.
#
# FRAMEWORK-EDITS E59 (RULED, 2026-08-27, owner) -- an internal cross-check
# is a second read. Where a figure entered from one page reconciles to a
# DIFFERENT note in the same document (a roll-forward, a component sum, a
# segmental restatement) prepared separately from the entered figure's own
# source, that is an independent confirmation and the field takes
# `verified_kind: cross_document`, citing both pages -- a transcription
# error would break the tie, the same test cross-document verification
# applies across two filings. It does NOT extend to a figure that merely
# appears twice on the same page. Applied to ELEVEN fields, each now citing
# its reconciling note inline: depreciation_amortisation (note 28 sums to
# note 4's total), diluted_weighted_average_shares (p.101's net_income /
# diluted_eps reproduces note 11's count to rounding -- see SHARE COUNT
# ARITHMETIC CHECKS above, promoted from CHECK to cross_document verification
# by this ruling), employee_trust_shares_period_end and
# treasury_shares_period_end (note 26's own roll-forwards reproduce note
# 25's counts exactly), finance_income_received (note 9 restates p.105
# exactly), financial_liabilities_current (note 31 restates note 21's zero),
# lease_payments_capital (note 31's roll-forward restates p.105 exactly),
# net_finance_costs (note 9's own components sum to p.101's total),
# operating_cash_flow_pretax (note 28 restates p.105 exactly), sbc (note 29's
# own components net to note 28's figure), shares_issued_period_end (note 11
# less note 25's own narrative reproduces the total to rounding, plus the
# par-value check -- see SHARE COUNT ARITHMETIC CHECKS above, likewise
# promoted). THREE do NOT get it, and stay UNVERIFIED with the reason
# recorded at the field: finance_costs_paid (note 30 gives £2.7m against the
# cash flow's £2.8m -- a real £0.1m gap between two figures each already
# rounded to £0.1m, not one rounding absorbs); income_tax_paid (note 10's
# current tax CHARGE is an accrual, not the cash actually paid -- the
# numerical tie at this rounding may be coincidence, not a reconciliation);
# proceeds_from_disposals_ppe (no reconciling note found at all -- note 13's
# disposal schedule does not decompose into proceeds cleanly).
#
# THE EMPLOYEE TRUST LEG (FRAMEWORK-EDITS E54, first application). Note 11
# (p.117): basic EPS uses shares "excluding those held in treasury and by
# the Employee Share Option Trust ('ESOT')". Notes 25 and 26 (p.125) print
# the two counts SEPARATELY at the period end. Entered as its own field,
# employee_trust_shares_period_end, never folded into
# treasury_shares_period_end. shares_outstanding_period_end is left BLANK
# below so the store subtracts all three: issued 827,503 - treasury
# 4,412.082 - trust 282.389 = 822,808.529 thousand = 822,808,529 shares,
# which matches the EPS basis note 11 states (860,235,092 basic weighted
# average is a DIFFERENT, weighted-average figure and is not this net).
#
# THE VEHICLE STOCKING LOAN IS NOT NET DEBT (FRAMEWORK-EDITS E55). The
# £5.0m balance (note 20, p.121) is excluded from financial_liabilities_
# current: it can only fund vehicles held for resale, self-liquidates
# within 180 days on their sale, and the issuer books it inside trade and
# other payables, not borrowings (note 3, p.113; note 20, p.121).
#
# NET DEBT INCLUDES LEASES (FRAMEWORK-EDITS E56, confirming E35). The
# issuer's OWN "net bank debt" of £146.8m (p.23) excludes leases and is
# NOT what financial_liabilities_current/noncurrent/lease_liabilities below
# are struck to reproduce. Note 31's own net debt (p.131) -- "total
# borrowings and lease liabilities, less cash and cash equivalents" -- is
# £188.3m: 163.4 borrowings + 42.6 leases + 0.5 accrued interest - 18.2
# cash. THE SCHEMA HAS NO FIELD FOR THE £0.5M ACCRUED-INTEREST LEG, so the
# five legs below (163.4 + 42.6 + 0 pension - 18.2) sum to £0.5m LESS than
# the issuer's own 188.3 -- a schema gap, stated here rather than closed by
# adjusting a printed figure to make the arithmetic land. net_debt_ebitda is
# left DATA MISSING for a separate reason: the printed 0.3x leverage is
# struck on the £146.8m figure this ruling declines AND on a non-standard
# covenant EBITDA that strips share-based pay and joint-venture profit
# (note 21, p.122) and that the accounts state only as a RATIO, never as an
# amount.
#
# PENSION DEFICIT -- RESOLVED 2026-08-27 (E35.1), the open question above
# closed with primary-source evidence, not decided by inference from the
# balance-sheet asset caption alone. Note 24 (p.123-124) in full: the
# Scheme's buy-in policy was converted to a full buy-out on 2025-09-12, the
# Group "has accounted for the buy-out as a Settlement", and "it was not
# necessary to derive assumptions as at 31 March 2026 since there were no
# benefits to be valued". The note's own balance-sheet reconciliation
# (p.124) states, for 2026: "Present value of funded obligations –",
# "Fair value of plan assets –", "Net asset recognised in the Consolidated
# balance sheet –" -- all NIL, not merely a surplus caption's silence. The
# £2,000 (two thousand pounds) IFRIC 14 residual named on the same page is
# immaterial at this file's £0.1m rounding and is an ASSET, not a
# liability, consistent with E35.1's field being the recognised net
# defined-benefit LIABILITY specifically. Entered as pension_deficit: 0,
# zero_basis: note, status VERIFIED / same_page (E40): read directly off
# the rendered primary source this session, not cross-checked against a
# second document. Unblocks net_debt_on_basis, whose five required legs
# (E35.1) previously refused with pension_deficit absent.
# INTEREST (E34): Autotrader's operating cash flow does NOT bear interest --
# see interest_in_ocf below. FCF0 is not being struck here (section 5 is
# not run), so this affects nothing in this file beyond the declaration.
#
# SHARE-BASED COMPENSATION (E36): sbc is the non-cash addback note 28
# states inside "Cash generated from operations" -- "Share-based payments
# charge (excluding associated NI) 9.2" (p.126) -- the equity-settled
# charge before employer NI and the apprenticeship levy. No scheme is
# described as cash-settled (note 29, p.126-129: SIP, Sharesave, PSP,
# Deferred Annual Bonus and Single Incentive Plan, all measured at fair
# value under Black-Scholes/Monte Carlo, the shape of an equity award).
#
# WHAT IS DELIBERATELY ABSENT, and why (beyond gross_profit above):
#   * ebitda -- never stated as an amount, only the 0.3x leverage ratio
#     (see NET DEBT note above).
#   * free_cash_flow_reported -- no company-published free cash flow line
#     in the AR or either RNS.
#   * diluted_eps_adjusted, operating_income_adjusted -- no adjusted
#     measures are presented anywhere in these four documents.
#   * capex_combined -- the issuer prints the split (capex_ppe /
#     capex_intangibles), so E23 leaves the combined line blank.
#   * net_interest_paid -- not printed as one net; note 9 (p.116) nets
#     finance costs and finance income on the INCOME STATEMENT basis
#     (net_finance_costs, entered directly below) but the CASH FLOW
#     statement (p.105) never combines interest paid and interest received
#     into one line -- they sit in different sections (financing and
#     investing respectively) -- so finance_costs_paid and
#     finance_income_received are entered instead and the store subtracts.
#   * finance_costs_period, finance_income_period -- net_finance_costs is
#     printed directly (p.101; note 9 total, p.116), so E18 leaves the
#     split blank.
#   * pension_deficit -- RESOLVED 2026-08-27, see PENSION DEFICIT below.
#     No longer absent; entered as a stated zero.
#   * other_current_financial_assets -- no such caption on the balance
#     sheet. Current assets (Inventory 4.3 + Trade and other receivables
#     82.1 + Current income tax assets 2.7 + Cash 18.2 = 107.3, p.103) sum
#     exactly to the printed subtotal, which could support a
#     zero_basis: subtotal entry -- also an open question, not decided
#     here, and left blank rather than assumed.
#   * noncurrent_derivative_assets_on_debt -- note 31's own net debt
#     reconciliation (p.131) carries no such leg.
#   * shares_point_in_time -- no count stated as of a specific day distinct
#     from a period end in any of the four documents.
#   * market: block (as_of / enterprise_value / market_cap) -- these are
#     priced facts belonging to a date, not to a fiscal period, and none of
#     the four documents states one.

