# BETS-B.ST -- Betsson AB (publ), hand-read from the issuer's own reports.
#
# THERE IS NO FIGURES APPENDIX. Betsson publishes no xlsx beside its
# reports -- measured over its last 200 disclosures, every one is a PDF --
# so every figure below was read off a page by hand and carries that page.
# `vss appendix` has nothing to run against here and no cell map exists.
#
# EVERY FIGURE IS VERIFIED as of 2026-08-25. They were entered from one
# reading and then READ BACK against the rendered pages by the owner, with
# zero disagreements and every page citation checked with the figure. The
# route for 2025-Q4 differs and is recorded in that period's own comment.
# Section 5 may run on this file (E21); it did not before the read-back.
# E40 (2026-08-26): every flag here is a read-back against the page the
# figure was entered from, so its kind is `same_page` -- the parser reads
# an unstated kind as exactly that, and the report prints it.
#
# THE FOUR QUARTERS ARE THE E19 WINDOW: 2025-Q3, 2025-Q4, 2026-Q1 and
# 2026-Q2, ending 2026-06-30.
#
# EVERY FLOW IS THE STANDALONE QUARTER COLUMN -- three months -- and never
# the cumulative one. Betsson prints both side by side in every report:
# `Q2 26` beside `Jan-Jun 26`, `Q3 2025` beside `Jan-Sep 2025`, `Q4 25`
# beside `Jan-Dec 25`. The three-month column is the FIRST of each pair and
# is what is entered here. The cumulative columns are not entered anywhere.
#
# CURRENCY. The accounts are in EUR and the share trades in SEK on Nasdaq
# Stockholm Large Cap. Both are declared below; nothing here is converted
# (FRAMEWORK-EDITS E24 governs the price legs, which are not in this file).
#
# SIGNS. Outflows are entered as printed, negative: capex, taxes paid,
# lease payments. `net_finance_costs` follows the schema's own convention
# and is a POSITIVE MAGNITUDE for a net cost (E18) -- Betsson prints it as
# a negative net, `Financial income and expenses`, and the sign is flipped
# here and nowhere else.
#
# WHAT IS DELIBERATELY ABSENT, and why:
#   * capex_ppe / capex_intangibles -- the interims print ONE line,
#     `Investments in intangibles/tangibles`, and never split it. That line
#     is entered as `capex_combined` (E23). The annual report splits it;
#     the quarters do not, and a quarterly basis cannot use the annual
#     split.
#   * lease_liabilities -- the balance sheet presents `Lease liabilities`
#     twice, current and non-current, and states no total. Until E71
#     (2026-08-30) that was E26's DATA MISSING, both figures named in the
#     comment beside each period. E71 adds two stated captions the issuer
#     itself treats as one quantity -- Betsson's evidence is the annual
#     report's note 30, which presents the lease liability as ONE total at
#     2025-12-31 (15,359 thousand EUR), and the cash-flow statement's single
#     `Amortisation of lease liabilities` line -- so the 2026-Q2 entry, the
#     one stock the basis reads, now carries 18.9 + 4.3 = 23.2 -- the
#     components the owner read back on 2026-08-25, added under E71 by the
#     build session on 2026-08-30 and carried `same_page`. The
#     three older quarters keep their comments only: a stock is taken at
#     the window's end (E19) and nothing reads theirs.
#   * net_interest_paid, finance_costs_paid, finance_income_received -- no
#     interest line appears in the INTERIM cash flows at all. Not zero:
#     absent. The ANNUAL REPORT discloses both amounts as 'Additional
#     information' beneath the cash flow statement (p.117), and they are
#     entered in the annual block below; on this quarterly basis they are
#     another twelve months (E20) and E41 does not list interest among the
#     annual-only fields, so FCF0 stays DATA MISSING here until the owner
#     extends E41's list or the issuer discloses it quarterly.
#   * finance_costs_period / finance_income_period -- the interims print
#     only the NET. The net is entered; the operands are not (E18).
#   * diluted_weighted_average_shares -- defined in every report's
#     definitions page and printed in none of them. Annual only.
#   * free_cash_flow_reported, operating_income_adjusted,
#     diluted_eps_adjusted -- Betsson publishes no such measures. A zero
#     would claim it reported zero (E25).
#   * other_current_financial_assets, operating_cash_flow_pretax -- the
#     concept is not presented and the cash flow is not laid out that way.
#     A zero there is refused outright (E25).
#
# SOURCES, all in sources/ with their provenance in sources/manifest.json:
#   Q3 2025 interim report      2025-10-24   (Jan-Sep 2025, Q3 column)
#   year-end report 2025        2026-02-05   (Jan-Dec 2025, Q4 column)
#   Q1 2026 interim report      2026-04-24   (Jan-Mar 2026, Q1 column)
#   H1 2026 interim report      2026-07-17   (Jan-Jun 2026, Q2 column)
#   Annual Report 2025          2026-04-01   (not read for these quarters)

ticker: BETS-B.ST
name: "Betsson AB (publ)"
reporting_currency: EUR
money_unit: millions   # declared 2026-08-26: EUR millions, as the reports print them -- 'EBITDA was EUR 82.5 million' is entered as 82.5
share_unit: whole      # declared 2026-08-26: 'The total number of shares and votes in Betsson amounts to 142,729,838' entered whole
quote_currency: SEK
sector: "Consumer Cyclical"
reporting_frequency: quarterly
origin: manual

# E34 (filled 2026-08-26, Build 2 item 7): Betsson books interest INSIDE
# operating cash flow -- POST-interest. The statement has no interest line
# of its own; the amounts are the IAS 7.31 disclosure an issuer gives when
# they sit inside the operating subtotal (REVIEW-4 report A 1.2).
interest_in_ocf:
  value: yes
  source: "Betsson AB (publ) Annual Report 2025 (published 2026-04-01)"
  page: "p.117, consolidated cash flow statement, 'Additional information' beneath it: 'Interest paid during the year amounted to -15.6' and 'Interest received during the year amounted to 3.5'; the statement itself starts from 'Cash flow from operating activities before changes in working capital 261.5' with no interest line in operating, investing or financing"

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# lease principal. Under IFRS 16 it does not, so nothing is added back: the
# lease is counted once, in net debt (E35, E65); `lease_payments_capital`,
# where entered, is a memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities, so this filer's `operating_cash_flow` never bore the principal; the interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records. The standard leaves no choice on the principal"

