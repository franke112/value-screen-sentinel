# E34: where this filer books its interest, for the BASIS YEAR
# (FY2026). Section 5 reads that year and no
# other; a five-year per-share proxy reading this file is not
# covered by one attribute.
interest_in_ocf:
  # E115 (2026-09-18, the owner's ruling during this name's review): this
  # filer states interest PAID as cash (`InterestPaidNet` 76,728,000) and
  # states NO interest received -- searched in the 10-K's full text, its
  # other-income line, its cash-flow supplemental disclosures and every
  # interest-income element of the taxonomy, none of which carries an
  # FY2026 value -- and no income-statement net; its gross expense is filed
  # under `InterestExpenseDebt`, which `finance_costs_period` does not read.
  # So E34's pair, E34.1's accrual net and E61's gross leg all fail to form.
  # The add-back is INTEREST PAID ALONE, a NAMED ONE-SIDED PROXY whose bias
  # is printed beside FCF0: interest income is never negative, so FCF0 is
  # OVERSTATED by the unstated income, never understated. NOT the net --
  # E34.1's sentence stands.
  interest_source: cash_paid_only
  value: yes
  source: "SEC XBRL companyfacts for CIK 0000012659 (H&R BLOCK INC) -- https://data.sec.gov/api/xbrl/companyfacts/CIK0000012659.json. The filing each figure came out of is named on the figure itself, with its tag and context period."
  page: "ASC 230-10-45-17(d): under US GAAP interest paid is an OPERATING cash outflow for every filer, so this filer's `operating_cash_flow` already bears its interest. No tag states it because the standard leaves no choice to state"

