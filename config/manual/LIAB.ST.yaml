# LIAB.ST -- Lindab International AB, hand-read from the issuer's own
# periodic reports. WRITTEN 2026-08-26 by the Build 2 session (item 7); no
# store file existed before -- the first re-strike ran on hand inputs.
#
# BASIS: E19's twelve-month window is the four consecutive quarters 2025-Q3,
# 2025-Q4, 2026-Q1 and 2026-Q2, ending 2026-06-30. Lindab prints a
# STANDALONE QUARTER column in every report (Jul-Sep, Oct-Dec, Jan-Mar,
# Apr-Jun) beside the cumulative and R12M columns, and the Q2 2026 report's
# quarterly table (p.19) restates every quarter's operating cash flow, so
# each quarter's OCF is confirmed by a SECOND document (`cross_document`).
# The R12M column of the Q2 2026 report confirms every SUM: OCF 335 + 521 +
# 45 + 275 = 1,176; interest paid 61 + 52 + 50 + 48 = 211; interest received
# 3 + 5 + 1 + 1 = 10; investments in intangibles 31 + 41 + 27 + 43 = 142 and
# in tangible fixed assets 50 + 47 + 43 + 45 = 185.
#
# EVERY FIGURE WAS ENTERED FROM A pdftotext EXTRACTION AND RE-EXTRACTED FROM
# THE SAME PAGE (same_page, E40) BY THE BUILD SESSION -- NOT read back by the
# owner. Where a second document states the same figure the kind says so.
#
# UNITS: SEK MILLIONS for money, as every statement prints them. SHARE
# COUNTS ARE ENTERED IN MILLIONS (77.036 for the printed "77,036 thousand")
# so that SEK-million figures divide to SEK per share; the page line quotes
# the printed thousands. Signs as printed: outflows negative; the interest
# pair as POSITIVE MAGNITUDES per the schema (E18).
#
# INTEREST (E34): Lindab books interest INSIDE operating cash flow --
# POST-interest -- so FCF0 adds back net interest paid (211 - 10 = 201 on
# the R12M) and net debt is subtracted once.
#
# WHAT IS DELIBERATELY ABSENT, and why:
#   * capex_combined -- Lindab prints the split (intangible / tangible), so
#     the split pair is entered and the combined line is not (E23).
#   * lease_liabilities in the OLDER quarters -- only the newest quarter's
#     balance sheet is a stock on this basis (E19); 2026-Q2 carries it as
#     the STATED TOTAL from the net-debt note (p.25 'Lease liabilities
#     -1,410'), which the balance sheet presents as 1,018 + 392 (E26).
#   * other_current_financial_assets in 2026-Q1 -- the balance sheet shows
#     a DASH for 'Other interest-bearing receivables'; E25 refuses a zero on
#     this field outright, so it is left blank. Only 2026-Q2's matters.
#   * the 39 of NON-current 'Financial interest-bearing fixed assets' that
#     Lindab's own net debt nets (p.25, incl. pension-related assets 21) --
#     no field holds a non-current financial asset; omitting an ASSET is
#     the conservative direction (E35) and it is 0.5 SEK a share.
#   * revenue / operating income -- not needed by section 5 here; the
#     watchlist quarters carry them (source: release).
#
# SHARE-BASED COMPENSATION (E36): ZERO for FY2025 on E25's `note` form. The
# annual report states that the long-term incentive programmes for 2023,
# 2024 and 2025 are CASH remuneration "presumed to be invested in shares"
# (p.96) and that the share option programme is a market transaction, "no
# part of the program should be seen as share-based remuneration" (p.112).
# A performance share plan accounted for under IFRS 2 began in 2026 (Q2 2026
# interim p.10, "total accounting cost ... approximately SEK 4 m ...
# allocated over the vesting period" of three years); the charge inside the
# R12M window is not stated and is at most about SEK 0.3 m -- 0.03% of FCF0,
# in the generous direction. E41 fills the FY2025 zero onto this basis.

ticker: LIAB.ST
name: Lindab International AB
reporting_currency: SEK
money_unit: millions   # declared 2026-08-26: SEK MILLIONS, as every statement prints them (header above)
share_unit: millions   # declared 2026-08-26: counts ENTERED IN MILLIONS -- 77.036 for the printed '77,036 thousand' (header above)
quote_currency: SEK
sector: Industrials
reporting_frequency: quarterly
origin: manual

interest_in_ocf:
  value: yes
  source: "Lindab Interim Report January-June 2026 (Nasdaq release 1454549, 2026-07-17), sources/LIAB.ST_2026-Q2_half-year-financial-report_2026-07-17_en_a0.pdf"
  page: "p.17, consolidated cash flow statement, OPERATING ACTIVITIES: 'Interest received 1 3 2 5 10 13' and 'Interest paid -48 -52 -98 -107 -211 -220' (Apr-Jun 2026, Apr-Jun 2025, Jan-Jun 2026, Jan-Jun 2025, R12M, Jan-Dec 2025) ABOVE 'Cash flow from operating activities before changes in working capital'"

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# lease principal. Under IFRS 16 it does not, so nothing is added back: the
# lease is counted once, in net debt (E35, E65); `lease_payments_capital`,
# where entered, is a memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities, so this filer's `operating_cash_flow` never bore the principal; the interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records. The standard leaves no choice on the principal"

