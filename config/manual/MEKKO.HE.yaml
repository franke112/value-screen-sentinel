# ===================================================================
# WHY THE BASIS IS ANNUAL FY2025 AND NOT A TTM TO 2026-06-30, WHICH IS
# THE CENTRAL FINDING OF THIS INTAKE
# ===================================================================
#
# **MARIMEKKO'S CASH FLOW STATEMENT PRINTS NO STANDALONE QUARTER.** Its
# income statement does -- the Q2 2026 report's columns are `4-6/2026`,
# `4-6/2025`, `1-6/2026`, `1-6/2025`, `1-12/2025` -- and its balance sheet
# is a point in time. But the CASH FLOW STATEMENT carries only CUMULATIVE
# columns: `1-6/2026`, `1-6/2025`, `1-12/2025`. The same is true of all
# four interim documents.
#
# E19's quarterly route needs four consecutive quarters SUMMED, and the
# operating cash flow of a single quarter is not printed in any of the five
# documents. It could be reached only by SUBTRACTING one cumulative column
# from another -- 1-12/2025 less 1-6/2025, plus 1-6/2026, to make the
# twelve months to 30 June 2026. **That is derivation and this schema does
# not do it.** E69 permits a hand read that ADDS stated parts, every part
# named; nothing permits manufacturing a figure by difference, and E108's
# applied note (a) states the asymmetry directly -- loosening arithmetic is
# allowed and tightening arithmetic is not.
#
# So E19's OTHER route is taken: **the year as filed.** FY2025 ends
# 2025-12-31, 251 days before today, inside the 550-day limit, and every
# leg section 5 needs is stated for it in the audited annual report and
# repeated in the Financial Statements Bulletin. The cost is stated
# plainly: **the basis is two quarters staler than it would be for a filer
# that prints quarterly cash flow**, and the two quarters missing from it
# (H1 2026) are the ones in which net sales in Finland FELL 4%.
#
# WHAT THE PDF PATH COULD NOT FILL, in one place:
#   * a standalone quarterly operating cash flow -- see above. Not
#     available at any price short of the issuer changing its presentation;
#   * `net_debt_reported` as a STATED FIGURE. Marimekko states the RATIOS
#     -- `Net debt / EBITDA -0.17` and `Gearing, % -9.3` -- and defines
#     both on "Interest-bearing net debt", but never prints that number.
#     Recovering it from the ratio is derivation, so the field stays empty
#     and the two ratios are named on `net_debt_ebitda` instead;
#   * `gross_profit`. Marimekko presents costs BY NATURE and prints no
#     gross-profit line. DATA MISSING, not zero;
#   * `net_ppe`. The balance sheet prints `Tangible assets 32.4`, which
#     under IFRS 16 includes right-of-use assets, and no note read here
#     splits them. Entered with the caption named and the inclusion
#     flagged, since it is a ranking-key field and no section 5 leg
#     divides by it.
#
# UNITS. money_unit: MILLIONS -- every statement is headed `(EUR million)`.
# share_unit: WHOLE -- the per-share key figures print `Share issue
# adjusted average number of shares 40,571,380`.
#
# E34 -- INTEREST IS INSIDE OPERATING, and the statement says so on its
# face: `Paid interest and payments on other financial expenses -1.3` and
# `Interest received and payments on other financial income 0.5` sit ABOVE
# `CASH FLOW FROM OPERATING ACTIVITIES 34.5`, beneath the subtotal `Cash
# flow from operating activities before financial items and taxes 41.4`.
# `interest_in_ocf: yes`. The two sides are printed SEPARATELY, so E18
# applies: `finance_costs_paid` and `finance_income_received` are entered
# and the store subtracts; `net_interest_paid` stays blank.
#
# E70 -- THE LEASES IN THE FLOW. IFRS 16 filer: `Payments of lease
# liabilities -8.7` is in FINANCING, below the operating total, so
# `operating_leases_in_ocf: no` and nothing is added back. Entered as E70's
# MEMO on `lease_payments_capital`.
#
# E23 -- CAPEX IS ONE LINE. `Investments in tangible and intangible assets
# -2.9` is the whole investing section; there is no split anywhere in the
# five documents. `capex_combined`, and the split fields stay blank.
#
# E35 -- THE DEBT LEGS, AND MARIMEKKO'S OWN WORD FOR THEM. The balance
# sheet's ONLY liabilities are `Lease liabilities` (non-current 21.5,
# current 8.2) and `Trade and other payables 26.4`. There is no borrowing
# caption. And the issuer's own five-year key-figure table prints
# `Interest-bearing liabilities, EUR million 29.7` -- which is 21.5 + 8.2
# EXACTLY, so what Marimekko calls its interest-bearing liabilities IS the
# lease, and it has no borrowings at all. The `Short-term loans repaid
# -0.6` line in the FY2024 comparative went to nil in 2025. E25 `caption`
# on both borrowing fields.
#
# E35.1 -- PENSION. ZERO. `defined benefit` and `defined-benefit` have
# ZERO occurrences in the 552,801 characters of the audited annual report
# (searched 2026-09-08); `pension` occurs 24 times and every one is either
# a Finnish pension INSURANCE COMPANY on the shareholder register
# (Ilmarinen, Varma, Elo) or the remuneration note's sentence, "Pension
# benefits include only statutory pension payments. The management does
# not have additional pension benefits." Finnish statutory TyEL is a
# contribution arrangement and no defined-benefit obligation exists.
#
# E68.1 -- ASSET RETIREMENT OBLIGATION. ZERO. A clothing and homeware
# designer that leases its stores; on none of E68.1's refuse-until-read
# lists. E107 search of the annual report for `asset retirement`,
# `decommission`, `dismantl`, `restoration`, `make good`, `dilapidation`
# and `restoring` returns two hits and BOTH are sustainability boilerplate
# -- "the protection and restoration of biodiversity and ecosystems" and
# "protecting and restoring the environment". The balance sheet presents no
# provision caption at all: `current provisions` appears only inside the
# printed FORMULA for net working capital.
#
# E81 -- PREPAID DELIVERY OBLIGATION. ZERO, with the advances NAMED. Note
# 16 splits `Trade payables and other current liabilities`: trade payables
# 11.3, other payables 5.5, accrued liabilities and deferred income 7.9,
# and **`Advances received 1.8`**. Customer advances of a retailer are
# E81's own excluded class -- "customer deposits, billings in advance --
# working capital the flow already carries". No streaming, offtake or
# prepaid-delivery arrangement exists.
#
# E105 -- NCI. ZERO, and determined. `non-controlling`, `noncontrolling`
# and `minority interest` have ZERO occurrences in ALL FIVE documents
# (searched 2026-09-08). Every income statement line reads `Distribution of
# net result to equity holders of the parent company` for the whole result.
#
# E38 -- THE DIVISOR. Note 10 states `Weighted average number of shares,
# 1,000,000  40.6` and the per-share key-figure table states it exactly:
# `Share issue adjusted average number of shares 40,571,380`, the same in
# 2023, 2024 and 2025. Basic and diluted are one count -- the accounting
# principles say "There are no potential shares outstanding at the moment"
# -- so the stated basic average IS the diluted one.
#
# TWO CHECKS THAT COST NOTHING AND BOTH PASSED:
#   * the bridge against the issuer's own gearing. Net debt computes to
#     29.7 - 36.6 = -6.9 (net CASH). Marimekko prints `Gearing, % -9.3`
