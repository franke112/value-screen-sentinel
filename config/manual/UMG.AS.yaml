#
# LEFT OUT ON PURPOSE -- judgements for the owner, not transcription:
#   * CATALOGUE INVESTMENTS (FY25 (345), H1-26 (46), cash flow statement,
#     investing). capex_intangibles holds ONLY 'Other intangible assets
#     investments'. Whether buying catalogue is maintenance spend for this
#     business is the owner's call; UMG's own FCF definition changed on it
#     in Q2 2026 (H1 p.15): FY25 FCF 702 on the old basis, 1,497 restated.
#   * proceeds_from_disposals_ppe: the line printed is 'Proceeds from sales
#     of property, plant, equipment and intangible assets' (FY25 65) --
#     PPE and intangibles together, so it is not this field.
#   * other_current_financial_assets (FY25 43, H1 65): UMG's own net debt
#     counts only derivative assets (5 / 2) from this line (AR p.57); the
#     balance-sheet line is not the cash-management figure.
#   * issued/treasury share counts: stated in WHOLE (AR p.235: 1,834,181,772
#     issued, 214,235 treasury) and in THOUSANDS (H1 p.22: 1,838,527); this
#     file's share_unit is millions (the weighted averages). Not rescaled.
#   * finance_costs/income INCLUDE Spotify/Tencent revaluation (FY25 net
#     gain 283, AR p.235 fn3; H1-26 net loss 505, H1 p.34 fn3). Entered as
#     printed; Gate 3's coverage limb reads them.

