# SYNSAM.ST -- hand-entered from Synsam Group AB's own periodic reports.
#
# BASIS: E19's twelve-month window is the four consecutive quarters
# 2025-Q3 + 2025-Q4 + 2026-Q1 + 2026-Q2, ending 2026-06-30. Synsam prints a
# STANDALONE QUARTER COLUMN in every periodic report -- verified document by
# document, including the year-end report, whose income statement heads its
# first column `Q4` -- so the window is four filed quarters and nothing is
# annualised.
#
# EVERY FIGURE IS READ FROM ITS OWN QUARTER'S REPORT, never from a later
# report's comparative column, so that the Q2 2026 report's QUARTERLY DATA
# table (p.29) stays available as an INDEPENDENT second read of all four.
#
# E40 (2026-08-26): WHICH KIND OF VERIFICATION EACH FLAG STANDS ON is now
# on the figure. TWENTY carry `verified_kind: cross_document` -- revenue,
# operating income, net income, op_margin and diluted EPS for all four
# quarters, cross-checked against that p.29 table (20 agree, 0 disagree;
# HANDOFF-2026-08-25). The other FIFTY-TWO name no kind and are read as
# `same_page`: a second pdftotext extraction of the same page, which
# catches a column misread but is not a human read-back. THE FOUR CASH-FLOW
# LINES METHOD C READS -- OCF, the two capex legs, lease principal -- ARE
# AMONG THE FIFTY-TWO.
# Page numbers are the PRINTED page, which for these documents equals the
# PDF page.
#
# `revenue` IS `Total revenue`, NOT `Net sales`, and the reason is the
# issuer's own definitions on p.37 of the Q2 2026 report:
#     "EBIT margin -- EBIT as a percentage of total revenue."
#     "Gross profit -- Total revenue less the cost of goods for resale."
# The arithmetic confirms it: Q2 2026 EBIT 290 / Total revenue 2,081 =
# 13.9%, which is the margin Synsam states; 290 / Net sales 2,049 = 14.2%,
# which it does not. The schema's own note for the field says "Total
# Revenue". `Net sales` is the base of a DIFFERENT stated measure (Gross
# margin, organic growth), and is not entered anywhere in this file.
#
# `gross_profit` IS DATA MISSING and is NOT derived. Synsam defines it in
# prose and states `Gross margin, %`, but no statement prints the line.
# Total revenue minus Goods for resale would be arithmetic the sheet does
# not state, which is the one thing this path exists not to do. It is a
# ranking-key field and no method of section 5 reads it.
#
# `depreciation_amortisation` comes from the CASH FLOW statement, which
# prints ONE stated line. The income statement splits it into `Depreciation
# of tangible non-current assets` and `Amortisation of intangible
# non-current assets` and never totals them; adding those two would be a
# derivation, and under E26 a total the issuer never totals is not this
# file's to compute. The two do not always reconcile to the cash-flow line
# (Q1 2026: 182 + 32 = 214 against 213), which is the second reason to take
# the line the issuer actually prints.
#
# `finance_costs_period` and `finance_income_period` are entered as POSITIVE
# MAGNITUDES, per the field spec: the store subtracts costs minus income
# (E18) and a negative here would invert the net. The income statement
# prints Financial expenses negative.
#
# THE PAID-INTEREST TRIO IS ABSENT ON PURPOSE. `finance_costs_paid`,
# `finance_income_received` and `net_interest_paid` appear ONLY in the
# ANNUAL cash flow statement. Under E20 an annual flow from a different
# window end may not fill a gap at this basis -- FY2025 ends 2025-12-31 and
# the basis ends 2026-06-30 -- so they are left blank rather than reached
# for. They are DATA MISSING at this basis and that is the correct state.
#
# NO `market:` BLOCK. Enterprise value and market capitalisation are priced
# facts and no price was fetched for this entry pass. The ranking key's
# EBIT/EV leg is DATA MISSING in consequence.

ticker: SYNSAM.ST
name: Synsam Group AB
reporting_currency: SEK
money_unit: millions   # declared 2026-08-26: SEK millions, as the reports print them (Q2 2026 EBIT 290 / total revenue 2,081, header above)
share_unit: whole      # declared 2026-08-26: 'Average number of shares during the period' entered whole, 144,404,338
quote_currency: SEK
sector: Healthcare
reporting_frequency: quarterly

# E70 (2026-08-30): whether this filer's operating cash flow bears its
# lease principal. Under IFRS 16 it does not, so nothing is added back: the
# lease is counted once, in net debt (E35, E65); `lease_payments_capital`,
# where entered, is a memo the flow never deducted.
operating_leases_in_ocf:
  value: no
  source: "FRAMEWORK-EDITS E70, applied 2026-08-30 to an IFRS 16 filer"
  page: "IFRS 16.50(b): a lessee classifies cash payments for the principal portion of the lease liability within FINANCING activities, so this filer's `operating_cash_flow` never bore the principal; the interest portion follows the filer's IAS 7 policy, which `interest_in_ocf` records. The standard leaves no choice on the principal"

