# vss watchlist -- copy to config/watchlist.yaml and edit.
#
# THE TWO ENTRIES BELOW ARE DUMMIES. No vendor knows `EXMPL.ST` or
# `DUMMY.AS`, so a run on this file as it stands fetches nothing, and a
# `--dry-run` refuses (exit 3) because the HELD dummy has no close. Replace
# them with real symbols before the first run. The full field table is in
# docs/MANUAL.md, "The watchlist".
#
# Every field is MANUAL. vss never computes, guesses, defaults or
# back-fills any of them.
#
# There is deliberately no `mbp:` field. MBP is COMPUTED:
#   mbp = base value x tier cushion      (tier 1 = 0.85, 2 = 0.75, 3 = 0.65; E90)
# and it is INFORMATION since E168: it binds nothing. Writing an `mbp:` key
# by hand fails the run with a provenance conflict.
#
# A VALUE NEEDS ITS RECORD. `fv_base` is printed, and an MBP struck from
# it, only where `run_record:` names a complete run record that replays to
# it (`vss strike` writes the record). A bare `fv_base` with no record
# prints DATA MISSING (no complete run record) -- as these dummies would.
#
# Fields
#   ticker         yfinance symbol (e.g. VOLV-B.ST, RHM.DE, MSFT)
#   name           display name
#   currency       trading currency, display only
#   status         HELD | WATCH-PRICED | WATCH-GATED | PIPELINE | INTAKE |
#                  DROPPED. WATCH-PRICED passed and is only too expensive.
#                  WATCH-GATED failed something other than price: re-entry
#                  is on a named information event, NEVER a price level.
#                  INTAKE has been read and is not watched: it may carry a
#                  `growth:` view and nothing that stamps an entry.
#   fv_base        base-case fair value; needs `run_record:` (above)
#   fv_bull        the bull case; REQUIRED on a HELD name
#   tier           1 | 2 | 3, a hand field; it sets the MBP cushion
#   run_record     reference/run-records/<TICKER>-<stamp>.json
#   growth         the PRE-REGISTERED growth view a strike reads:
#                    growth: {base: 0.04, bear: 0.0, bull: 0.07,
#                             view: reference/growth-views/<TICKER>.md,
#                             registered: YYYY-MM-DD}
#   stop_price     E162: there is no price stop. A HELD name writes
#                  `stop_price: none` -- the decision; a BLANK field on a
#                  HELD name blocks it (NO_STOP), so a decision and a
#                  forgotten field never look alike. A number is accepted
#                  as the owner's own note; no rule reads it.
#   hurdle         E29's frozen hurdle rate, on a PURCHASE verdict only:
#                    hurdle:
#                      rate: 0.095
#                      core_expected_return: 0.070
#                      premium: 0.025          # E29 sets this at 2-3 points
#                      rate_as_of: 2026-08-25
#                  All four or none. rate must equal core + premium.
#   catalyst_date  YYYY-MM-DD, when the catalyst is/was due
#   catalyst_resolved  YYYY-MM-DD, the day you actually ingested the
#                  outcome. Once catalyst_date is in the past, a missing
#                  catalyst_resolved BLOCKS the ticker. It must not be
#                  earlier than catalyst_date -- that fails the run.
#   catalyst_event what the catalyst is
#   notes          free text. Prose only: the gate does NOT read notes.
#                  Write an `outcome:` line if you like it as a human
#                  record, but only catalyst_resolved resolves a catalyst.

tickers:
  - ticker: EXMPL.ST
    name: Example Industrials AB
    currency: SEK
    status: WATCH-GATED
    fv_base: 180.00      # prints only with a run_record (see the header)
    tier: 2
    catalyst_date: 2026-10-24
    catalyst_resolved:     # still in the future, nothing to resolve yet
    catalyst_event: Q3 report
    notes: |
      Dummy entry -- replace me.
      Thesis in one line so future-you remembers why this is on the list.

    # Optional: 8 quarters, oldest first, for the hard kills (FRAMEWORK
    # section 4: guidance cuts, EPS misses, covenant proximity, CEO and CFO
    # leaving). The other figures are information since E163 / E168.
    # ALL MANUAL. eps_consensus is MANUAL ONLY -- vss never extracts or
    # proposes it, and rule 4.2.4 reports CANNOT EVALUATE without it.
    # basis/accounting let a YoY comparison refuse to mix constant-currency
    # with reported rather than compute a meaningless number.
    #
    # A half-yearly reporter sets `reporting_frequency: half_yearly` on the
    # entry and stores YYYY-H1 / YYYY-H2 / YYYY-FY periods instead of
    # YYYY-Qn; its 4.2 windows are then counted in half-years. No two
    # periods of one ticker may overlap (2025-FY contains 2025-H1): the
    # overlap guard keeps the finest resolution and never both.
    quarters:
      - period: 2026-Q1
        revenue: 4130
        revenue_yoy: -0.02
        op_income: 537
        op_margin: 0.130
        eps: 2.31
        eps_consensus: 2.35      # MANUAL ONLY
        net_debt_ebitda: 2.0
        guidance_action: maintained   # raised|maintained|cut|none
        receivables: 1900
        inventory: 1239
        class_c_impact:          # a quantified one-off, stated on its own line
        covenant_headroom:
        basis: reported          # reported|constant_currency
        accounting: gaap         # gaap|non_gaap
    # Absent = "not recorded", so 4.2.6 reports CANNOT EVALUATE.
    # An empty list means "checked, no departures".
    exec_changes: []

  - ticker: DUMMY.AS
    name: Dummy Holdings NV
    currency: EUR
    status: HELD
    fv_bull: 87.5    # the exit test C4/E42 runs on (owner, 2026-09-20)
    fv_base: 62.50       # prints only with a run_record (see the header)
    tier: 1
    # OPTIONAL, and E32 is why it exists. The MBP has had three
    # definitions: `fv_base x 0.80 / 0.70 / 0.60` (superseded), E28's bear
    # case x cushion (superseded), and E90's base value x 0.85 / 0.75 /
    # 0.65, which is what the tool computes today. This block records WHEN
    # a stored figure was struck and under WHICH definition, so an old
    # figure is marked wherever it prints. Both keys or neither.
    #
    #   definition: fv_base_x_tier | e28_bear_case | e90_base_cushion
    #   struck:     YYYY-MM-DD, or `on or before YYYY-MM-DD` where the day
    #               is genuinely not recoverable. There is no third form,
    #               and a day is never invented to fill this in.
    #
    # mbp_basis:
    #   definition: fv_base_x_tier
    #   struck: 2026-08-22
    stop_price: none     # E162: no price stop, written as the decision it is
    catalyst_date: 2026-05-14
    catalyst_resolved: 2026-05-15   # the day the outcome was ingested
    catalyst_event: FY guidance update
    notes: |
      Dummy entry -- replace me.
      outcome: guidance reiterated, thesis intact, no action taken
      (this line is a human record only; catalyst_resolved above is what
      the gate actually checks)
