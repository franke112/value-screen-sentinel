# config/watchlist.yaml
#
# Live portfolio and pipeline state. Replaces FRAMEWORK.md §9.
# Verified against Avanza dashboard, 2026-08-20.
#
# MANUAL fields are never computed, estimated or defaulted by the tool.
# Blank means DATA MISSING, which is a legitimate state — leave it blank
# rather than inventing a placeholder. A guessed MBP is worse than no MBP.
#
# mbp is DERIVED (E90, 2026-08-30): BASE-case value x tier cushion
# (T1 0.85 / T2 0.75 / T3 0.65), computed from the linked run record's
# unrounded replay; the cushion covers model and input error, not scenario
# risk. Enter fv_base and tier; let the tool compute mbp. (History: the
# E28-era derivation was bear-case value x 0.80/0.70/0.60; before that
# fv_base x tier, E32's superseded definition.)
#
# OPEN E-CANDIDATE (owner, 2026-08-30 stop session; recorded, NOT built):
# a stop_price field FORM carrying a pre-registered DERIVATION (e.g.
# entry x 0.92, the C1 end chosen by drawdown class) resolved at the
# actual blended entry, instead of a level struck from a price nobody
# holds. Needs a ruling and a schema form; until then a WATCH name's
# stop stays null and the level is written at entry.
#
# ======================================================================
# PARKED DATA — no home in the current schema.
#
# The loader accepts exactly one top-level key, 'tickers:', and rejects
# unknown per-entry keys, so the blocks below are kept here as comments
# rather than deleted. They are the inputs for the §7 position-size
# checks. Move them into the schema if the tool grows support.
#
#   portfolio:            # MANUAL. Refresh when it drifts.
#     total_value_sek:      314058
#     satellite_sleeve_sek:  77271
#     cash_sek:                975
#
#   regime:               # MANUAL per FRAMEWORK §2.
#     elevated_valuation: false     # true shifts every name one tier
#                                   # stricter (§5.3)
#     verdict: NEUTRAL              # RISK_ON | NEUTRAL | RISK_OFF
#
#   core:                 # index funds — NOT satellite, NOT screened,
#                         # dropped from the entry list below. Retained
#                         # here for portfolio-percentage arithmetic.
#     Avanza Zero: 197920
#     Avanza USA:   37891
#
# Per-entry value_sek / last_seen_price from the old positions: block are
# parked as a comment above each entry.
# ======================================================================

