- step: growth-view
  outcome: next
  text: 'g_bear = -0.04, g_base = 0.02, g_bull = 0.05

    Base (2%): Nearly all growth comes from price (+4-5% per return per year). Real volume is roughly
    flat: the 1-2% company-owned volume growth is partly bought franchise offices, which costs cash rather
    than creating it; total offices are shrinking; paid DIY customers fell ~4% in FY2026. Assisted is
    ~65% of revenue growing ~6%, DIY flat, royalties falling, so total revenue grows ~3.5-4%. The main
    cost is tax-pro wages, which rise about as fast as prices, so cash flow grows slower than revenue
    and fades as pricing meets resistance. 2% means holding its own in real terms, no better. The CEO''s
    market-share statement gets modest weight: one season, new CEO, no published figures.

    Bear (-4%): The AI/free-software fear shows up in the numbers. Simple returns leave, and DIY doesn''t
    catch them because that''s where price competition is fiercest. The office network is mostly fixed
    cost, so a small loss of clients is a larger loss of cash, and raising prices on those who remain
    speeds up the leaving. -4% compounded leaves about two-thirds of today''s cash flow in 10 years: a
    melting ice cube, not a collapse, because complex returns and people who want a human don''t vanish.
    Management''s own 10-K now names AI as a competition risk, and free government filing could return.

    Bull (+5%): Share stabilization is real, tax complexity keeps pushing people toward help, pricing
    holds at 4-5% because remaining clients value the service, AI makes preparers more productive so margins
    widen, and small-business and financial products add a point. Possible, not probable: it needs both
    pricing and technology to break the right way for a decade.

    The spread is deliberately lopsided (bear 6 points below base, bull 3 above): a mature franchise with
    flat volume has modest upside and a fatter downside tail.

    What would change the view: 2-3 more tax seasons. Same-store assisted volumes holding while prices
    rise -> base up a point. Client counts falling faster than prices rise -> bear becomes base.

    Outcome: next

    '
